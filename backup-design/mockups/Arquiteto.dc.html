<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O Arquiteto · celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0A1E34}
button{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid #D0B386;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:linear-gradient(180deg,#0E2A45,#081628);color:#E9DEC9;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">

  <!-- tela ao fundo, com o atalho flutuante -->
  <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
    <div style="padding:24px 18px;color:#8F9BA8;font-size:13px">Tela do app ao fundo</div>
    <button onClick="{{ open }}" aria-label="Abrir O Arquiteto" style="position:absolute;right:20px;bottom:24px;min-height:52px;padding:0 20px 0 14px;border-radius:999px;border:1.5px solid #D0B386;background:linear-gradient(160deg,#173653,#0A1E34);color:#F1E8D5;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 0 3px rgba(208,179,134,.12)">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="#D0B386" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="14" cy="14" r="11"/><path d="M14 4v20M4 14h20"/><path d="M14 8l5 12H9z" fill="rgba(208,179,134,.2)"/></svg>
      O Arquiteto
    </button>
  </sc-if>

  <!-- gaveta -->
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(4,12,22,.6)"></div>
    <div role="dialog" aria-label="O Arquiteto" style="position:absolute;left:0;right:0;bottom:0;top:70px;border-radius:22px 22px 0 0;border:1.5px solid #A58A67;border-bottom:0;background:linear-gradient(180deg,#14304D,#0A1E34);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 14px 10px">
        <svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="#D0B386" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="14" cy="14" r="11"/><path d="M14 4v20M4 14h20"/><path d="M14 8l5 12H9z" fill="rgba(208,179,134,.2)"/></svg>
        <div style="flex:1">
          <div style="font-family:Georgia,serif;font-size:19px;color:#F1E8D5">O Arquiteto</div>
          <div style="font-size:11.5px;color:#B79F78">Estúdio de Aprendizagem Ativa · Quebrando a Banca</div>
        </div>
        <button onClick="{{ close }}" aria-label="Fechar" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(165,138,103,.55);background:rgba(10,30,52,.7);color:#E9DEC9;font-size:18px">✕</button>
      </div>
      <div role="tablist" style="display:flex;gap:8px;padding:0 14px 10px;overflow:hidden">
        <sc-for each="{{ tabs }}" as="t">
          <button role="tab" onClick="{{ t.pick }}" aria-selected="{{ t.on }}" style="{{ t.style }}">
            <span aria-hidden="true" style="font-size:16px">{{ t.glyph }}</span>
            <span>{{ t.label }}</span>
          </button>
        </sc-for>
      </div>
      <div style="margin:0 14px;padding:14px 16px;border-radius:16px;border:1px solid rgba(165,138,103,.5);background:rgba(17,40,63,.9)">
        <div style="font-size:11px;letter-spacing:.14em;color:#B79F78;font-weight:700">{{ cur.kicker }}</div>
        <p style="margin:8px 0 0;font-size:14px;line-height:1.55;color:#E9DEC9">{{ cur.text }}</p>
      </div>
      <div style="margin-top:auto;padding:12px 14px 18px;display:flex;gap:8px">
        <div style="flex:1;min-height:48px;border-radius:14px;border:1.5px solid #A58A67;background:rgba(10,30,52,.9);display:flex;align-items:center;padding:0 14px;font-size:14px;color:#8F9BA8">{{ cur.input }}</div>
        <button style="width:56px;min-height:48px;border-radius:14px;border:1.5px solid #D0B386;background:rgba(208,179,134,.16);color:#D0B386;font-size:18px" aria-label="Enviar">➤</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { open: true, tab: 0 };
  }
  renderVals() {
    const s = this.state;
    const T = [
      { label: 'Tutor Socrático', glyph: '◈', kicker: 'TUTOR SOCRÁTICO', text: 'O Arquiteto pergunta antes de explicar. Responda de cabeça e ele guia pelo que faltou.', input: 'Escreva a sua resposta…' },
      { label: 'Lab Feynman', glyph: '✦', kicker: 'LAB FEYNMAN', text: 'Explique o tópico com as suas palavras, como para um leigo; o Arquiteto aponta as lacunas.', input: 'Explique com as suas palavras…' },
      { label: 'Caderno Cornell', glyph: '▤', kicker: 'CADERNO CORNELL IA', text: 'Anotações em colunas: pistas, notas e resumo, geradas a partir do tópico do dia.', input: 'Tópico ou anotação…' },
      { label: 'Pomodoro e Áudio', glyph: '◷', kicker: 'POMODORO & ÁUDIO ALFA', text: 'Ciclos de foco com áudio de fundo.', input: 'Duração do ciclo' },
      { label: 'Flashcards 3D', glyph: '▧', kicker: 'FLASHCARDS 3D & SCANNER', text: 'Cartões em 3D e leitura de material por câmera.', input: 'Escanear ou escolher cartão' }
    ];
    const on = 'flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid #D0B386;background:rgba(208,179,134,.16);color:#F1E8D5;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap';
    const off = 'flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(165,138,103,.5);background:rgba(23,54,83,.8);color:#C9BEA8;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap';
    return {
      isOpen: s.open,
      closed: !s.open,
      open: () => this.setState({ open: true }),
      close: () => this.setState({ open: false }),
      tabs: T.map((t, i) => ({ label: t.label, glyph: t.glyph, on: i === s.tab, style: i === s.tab ? on : off, pick: () => this.setState({ tab: i }) })),
      cur: T[s.tab]
    };
  }
}
</script>
</body>
</html>

<title>Quebrando a banca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: uma coluna de leitura, como uma folha de respostas; abas no topo, placar fixo durante a rodada */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --ink:#13201D; --muted:#5A6965; --line:#D3DDDA;
  --pen:#1E4FD2; --pen-soft:#E3EAFC;
  --certo:#17784A; --certo-soft:#E1F3E9; --errado:#B4261D; --errado-soft:#FBE6E4; --duvida:#8A6A12; --duvida-soft:#F7EFD6;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1028; --surface:#111A3A; --ink:#E6EAF7; --muted:#97A1C4; --line:#253159;
  --pen:#7C9BFF; --pen-soft:#1B2A5E;
  --certo:#5CCB8E; --certo-soft:#13291E; --errado:#FF8E84; --errado-soft:#33181A; --duvida:#E2C268; --duvida-soft:#2C2512;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1028; --surface:#111A3A; --ink:#E6EAF7; --muted:#97A1C4; --line:#253159;
  --pen:#7C9BFF; --pen-soft:#1B2A5E;
  --certo:#5CCB8E; --certo-soft:#13291E; --errado:#FF8E84; --errado-soft:#33181A; --duvida:#E2C268; --duvida-soft:#2C2512;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.countdown{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.countdown b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-weight:600;font-stretch:90%;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pen)}
.count{font-family:var(--mono);font-size:12px;background:var(--line);color:var(--ink);border-radius:999px;padding:0 7px;line-height:18px}
.count.hot{background:var(--errado);color:var(--surface)}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px;color:var(--muted)}
.notice strong{color:var(--ink)}

/* setup */
.section-title{font-weight:700;font-stretch:88%;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.due{background:var(--surface);border:1.5px solid var(--pen);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.due-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.due-n{font-weight:800;font-stretch:85%;font-size:22px;line-height:1.15}
.due-n .mono{font-weight:600}
.due-meta{font-size:13.5px;color:var(--muted)}
.due.calm{border-color:var(--line)}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cap{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cap[aria-pressed="true"]{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.cap .cn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cap .ct{font-weight:700;font-stretch:90%;font-size:16px;line-height:1.25}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.cap .meta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mode input{margin-top:4px;accent-color:var(--pen)}
.mode b{font-weight:600}
.mode span{color:var(--muted);font-size:13.5px}
.mode.disabled{opacity:.55;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.check input{accent-color:var(--pen)}
tr.qr-m{cursor:pointer;background:var(--paper)} tr.qr-m:hover{background:var(--pen-soft)} tr.qr-a td:first-child{padding-left:28px;white-space:normal}
.check input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:700;font-stretch:90%;background:var(--pen);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13.5px}
.rule{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0}

/* placar */
.scorebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.score{display:flex;gap:14px;font-family:var(--mono);font-size:13.5px;flex-wrap:wrap}
.score .c{color:var(--certo)} .score .e{color:var(--errado)} .score .b{color:var(--duvida)}
.score .n{font-weight:600}
.progress{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* item */
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:18px}
.item-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.item-num{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.06em}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.statement{font-family:var(--read);font-size:18px;line-height:1.6;margin:0;max-width:65ch;text-wrap:pretty}
.statement .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.statement p{margin:0 0 10px}
mark.trava{background:var(--duvida-soft);color:inherit;border-bottom:2px solid var(--duvida);padding:0 2px;border-radius:2px}
.answers{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bubble{width:54px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-family:var(--mono);font-weight:600;font-size:17px;display:grid;place-items:center;transition:background .12s}
.bubble:hover:not(:disabled){background:var(--pen-soft)}
.bubble:disabled{cursor:default}
.bubble.picked{background:var(--ink);color:var(--surface)}
.bubble.key{border-color:var(--certo);box-shadow:0 0 0 3px var(--certo-soft)}
.blank{background:none;border:1.5px dashed var(--muted);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:14px}
.blank.picked{border-style:solid;border-color:var(--duvida);color:var(--duvida);background:var(--duvida-soft)}
.blank:disabled{cursor:default}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}

.conf{border:1.5px solid var(--pen);background:var(--pen-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.conf-q{font-weight:700;font-stretch:90%}
.conf-opts{display:flex;gap:8px;flex-wrap:wrap}
.conf-opts button{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;font-stretch:92%;display:flex;gap:8px;align-items:baseline}
.conf-opts button:hover{border-color:var(--pen)}
.conf-opts .mono{color:var(--muted);font-size:12.5px}

.verdict{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--certo-soft)} .verdict.bad{background:var(--errado-soft)} .verdict.dub{background:var(--duvida-soft)}
.verdict .vt{font-weight:800;font-stretch:88%;font-size:16px}
.verdict.ok .vt{color:var(--certo)} .verdict.bad .vt{color:var(--errado)} .verdict.dub .vt{color:var(--duvida)}
.verdict p{margin:0;font-family:var(--read);font-size:16px;line-height:1.55;max-width:65ch}
.calib{font-size:14px;font-weight:600}
.calib.alert{color:var(--errado)}
.ref{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.origem{display:flex;flex-direction:column;gap:8px}
.origem-q{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--ink);font-weight:600}
.origem-hint{font-size:13.5px;color:var(--muted);margin:0;max-width:65ch}

/* resumo */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.summary.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat.c .v{color:var(--certo)} .stat.e .v{color:var(--errado)} .stat.b .v{color:var(--duvida)}
@media (max-width:520px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* caderno */
.entry{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--errado);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.entry.dub{border-left-color:var(--duvida)}
.entry .statement{font-size:16.5px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.e{color:var(--errado);border-color:currentColor}
.pill.c{color:var(--certo);border-color:currentColor}
.pill.b{color:var(--duvida);border-color:currentColor}
.pill.p{color:var(--pen);border-color:currentColor}
details.why{border-top:1px dashed var(--line);padding-top:10px}
details.why summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--pen)}
details.why p{font-family:var(--read);font-size:15.5px;line-height:1.55;margin:8px 0 0;max-width:65ch}
.note label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.note textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:15px/1.45 var(--read);padding:8px 10px}
.saved{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.group-h h2{margin:0;font-size:17px;font-weight:700;font-stretch:88%}

/* desempenho */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.narrow{min-width:360px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.neg{color:var(--errado)} .pos{color:var(--certo)}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--read);font-size:16px;line-height:1.55;margin:0}
.insight b{font-family:var(--display);font-stretch:90%}
.agenda-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 12px 10px}
.agenda{display:grid;grid-template-columns:repeat(14,minmax(34px,1fr));gap:6px;align-items:end;min-width:520px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px}
.day .n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.day .col{width:100%;height:84px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.day .col i{display:block;width:100%;background:var(--pen);border-radius:3px 3px 0 0;min-height:0}
.day.today .col i{background:var(--errado)}
.day .d{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.day.today .d{color:var(--ink);font-weight:600}

/* método */
.metodo{display:flex;flex-direction:column;gap:16px}
.metodo ol,.metodo ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-family:var(--read);font-size:16px;line-height:1.55;max-width:65ch}
.metodo li b{font-family:var(--display);font-stretch:90%}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.book .bt{font-weight:700;font-stretch:90%;line-height:1.25}
.book .ba{font-size:13px;color:var(--muted)}
.book .bu{font-family:var(--read);font-size:14.5px;line-height:1.45}

/* central: painel e edital */
.st{display:inline-block;font-family:var(--mono);font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.st-nao{color:var(--muted)} .st-estudo{color:var(--duvida)} .st-revisao{color:var(--pen)} .st-dominado{color:var(--certo)}
.sbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;min-width:80px}
.sbar i{display:block;height:100%}
.sbar .b-dominado{background:var(--certo)} .sbar .b-revisao{background:var(--pen)} .sbar .b-estudo{background:var(--duvida)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.prog{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prog-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.prog-row:last-child{border-bottom:0}
.prog-row:hover{background:var(--paper)}
.prog-row .pn{font-weight:600;font-stretch:92%;min-width:0}
.prog-row .pm{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.prova-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 14px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
.feed{display:flex;flex-direction:column;gap:10px}
.log{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.log-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.log-h b{font-stretch:90%}
.log p{margin:0;font-family:var(--read);font-size:15.5px;line-height:1.5;max-width:70ch}
.log .nx{font-family:var(--display);font-size:13.5px;color:var(--muted)}
.log .nx b{color:var(--ink)}
.chips-t{display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--paper)}
a{color:var(--pen)}
.mat-l{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mat{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.mat:last-child{border-bottom:0}
.mat .mt{font-weight:600;font-stretch:92%;min-width:0}
.mtype{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select,.st-sel{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.st-sel{font-size:12.5px;padding:3px 6px;max-width:150px}
details.mat-g{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.mat-g>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,160px) auto;gap:12px;align-items:center;padding:12px 16px}
details.mat-g>summary::-webkit-details-marker{display:none}
details.mat-g>summary .gn{font-weight:700;font-stretch:88%;font-size:16px}
details.mat-g>summary .gn::before{content:"▸ ";color:var(--muted)}
details.mat-g[open]>summary .gn::before{content:"▾ "}
.topic{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.topic.fora{background:var(--paper)}
.t-h{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:baseline}
.t-num{font-family:var(--mono);font-size:13px;font-weight:600}
.t-tit{font-family:var(--read);font-size:15.5px;line-height:1.45}

<script>
(function(){
const S = {
  db:null, dbState:'loading', // loading | ok | missing
  q:new Map(), r:new Map(), rodadas:[], qLoaded:false,
  view:'portal', radialSection:null, trRadial:null, areaHub:null, cap:null, modo:'novos', shuffle:false,
  round:null, pendingRender:false,
  ed:new Map(), mat:new Map(), pt:new Map(), di:[], edLoaded:false,
  fEvo:'', evoCap:'', evoGrafico:'tempo', evoOrdem:'menor', evoModo:'n', evoPer:'d', evoDe:'', evoAte:'', evoFaixa:'', evoPagina:0,
  fMat:'', fSt:'', abertos:new Set(), ptsAbertos:new Set(), evocar:false, revelados:new Set(),
  rv:new Map(), cfg:new Map(), cartAbertos:new Set(), mapaFocus:null, mapaFocusCounter:0,
  pg:new Map(), fPgMat:'', fPgTipo:'',
  pl:[], plLoaded:false, cfgLoaded:false, // planejamento semanal e ciclos privados por concurso
  an:new Map(), mecQ:new Map(), pgModo:'mec', fMecMat:'', mecFoco:'todos', mecOpen:new Set()
};
const VIEWS=['portal','cartoes','mapa','simulado','painel','edital','revisao','pegadinhas','conteudo','treinar','caderno','analiseDia','historico','metodo','aprendizagem'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPct=x=>isFinite(x)?(Math.round(x*100)+'%'):'–';
const LETRA={C:'Certo',E:'Errado',B:'Em branco'};
function alternativasDe(q){return Array.isArray(q?.alternativas)&&q.alternativas.length>=4?q.alternativas:[]}
function brancoDe(q){return alternativasDe(q).length?'-':'B'}
function rotuloResposta(q,valor){return valor===brancoDe(q)?'Em branco':alternativasDe(q).length?'Alternativa '+valor:(LETRA[valor]||valor||'–')}
const CONF={1:'Chute',2:'Dúvida',3:'Certeza'};

/* ---------- método: revisão espaçada ---------- */
let PROVA='2027-01-17';      // data da prova
let LIMITE='2027-01-10';     // última semana: revisões diárias, nada agendado depois disso
const INT=[1,3,7,15,30];       // intervalos em dias por nível (proposta do Metodo_de_Estudo.md)
const ORIGENS={
  recuperacao:{t:'Não lembrei',d:'Recuperação: o conteúdo não veio à memória. Revise com flashcards e questões espaçadas, nunca relendo.'},
  interferencia:{t:'Confundi com outra regra',d:'Interferência: estude as duas regras lado a lado e treine em rodadas intercaladas.'},
  leitura:{t:'Li rápido demais',d:'Sistema 1: uma palavra de alcance passou batida. Releia o comando inteiro e marque as travas antes de julgar.'},
  compreensao:{t:'Não entendi o conceito',d:'Compreensão: explique com suas palavras e crie um exemplo próprio antes de voltar às questões.'}
};
const pad=n=>String(n).padStart(2,'0');
const dia=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function hoje(){return dia(new Date())}
function addDias(ds,n){const [y,m,d]=ds.split('-').map(Number);return dia(new Date(y,m-1,d+n))}
function difDias(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5)}
function diaDe(iso){const d=new Date(iso);return isNaN(d)?hoje():dia(d)}
function ddmm(ds){const p=ds.split('-');return p[2]+'/'+p[1]}
function nivelDe(r){return Number.isInteger(r.nivel)?r.nivel:(r.noCaderno?0:1)}
function proxDe(r){
  if(!r||!r.tentativas) return null;
  const base=diaDe(r.atualizadoEm||new Date().toISOString());
  const salvo=r.proxRevisao||addDias(base,r.noCaderno?1:3);
  if(r.noCaderno) return salvo;
  /* acertos fora do caderno: no mínimo 7 dias (certeza) ou 3 (dúvida) depois da última resposta.
     Vale também para respostas antigas, sem alterá-las no banco. */
  const min=agendarDias(base,r.conf===3?7:3);
  return min>salvo?min:salvo;
}
function agendarDias(d,n){
  if(LIMITE&&d>=LIMITE) return addDias(d,1);
  const p=addDias(d,Math.min(n,teto(d)));
  return LIMITE&&p>LIMITE?LIMITE:p;
}
const LIMITE_DIA=50;   // revisões de questões por dia (06/11/2026: 50, o mesmo teto dos cartões); erros primeiro
/* teto: nenhum intervalo passa de 20% dos dias que faltam para a prova (curva de Cepeda et al., 2008) */
function teto(d){return PROVA?Math.max(1,Math.floor(difDias(d,PROVA)*0.2)):Infinity}
function agendar(d,nivel){
  if(LIMITE&&d>=LIMITE) return addDias(d,1);
  const n=Math.min(INT[Math.max(0,Math.min(nivel,INT.length-1))],teto(d));
  const p=addDias(d,n);
  return LIMITE&&p>LIMITE?LIMITE:p;
}

/* palavras de alcance (treino do Sistema 2): destacadas só depois da resposta */
const TRAVAS=new RegExp('(?<![\\p{L}])(apenas|somente|só|sempre|nunca|jamais|exclusivamente|unicamente|necessariamente|obrigatoriamente|todos|todas|todo|toda|nenhum|nenhuma|qualquer|exceto|salvo|vedad[oa]s?|privativ[oa]s?|privativamente|independentemente|em regra|integralmente|totalmente|em nenhuma hipótese)(?![\\p{L}])','giu');
function marcarTravas(txt){return esc(txt).replace(TRAVAS,'<mark class="trava">$1</mark>')}
function temTravas(q){TRAVAS.lastIndex=0;const t=TRAVAS.test(String(q.enunciado||''));TRAVAS.lastIndex=0;return t}

/* ---------- escrita serial ---------- */
let chain=Promise.resolve();
function enqueue(fn){
  chain=chain.then(fn).catch(err=>{
    const code=err&&err.code;
    toast(code==='quota_exceeded'?'O espaço do caderno encheu. Peça ao Claude para arquivar rodadas antigas.':
      code==='invalid_argument'?'Esta conta não pode gravar neste caderno.':
      'Não foi possível salvar agora. Sua próxima resposta tentará de novo.');
  });
  return chain;
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}

/* ---------- dados derivados ---------- */
/* uma questão errada (ou deixada em branco) uma vez fica contada como erro: acertos posteriores não apagam o erro (regra do Lucas, 02/11/2026) */
function jaErrou(r){return (r.erros||0)>0||(r.brancos||0)>0||(r.hist||[]).some(h=>!h.ok)}
/* capítulos que repetem erros de simulado (SIM-…) ficam fora dos percentuais: os itens continuam no caderno de erros (pedido do Lucas, 05/11/2026) */
const foraCalc=cap=>/^SIM/i.test(String(cap||''));
/* itens marcados com foraNivel (acima do nível do edital do cargo 11) ficam fora de percentuais, revisão espaçada e simulado (06/11/2026) */
const foraQ=q=>!!q&&(foraCalc(q.cap)||!!q.foraNivel);
const foraQid=qid=>foraQ(S.q.get(qid));
function caps(){
  const m=new Map(), h=hoje();
  for(const q of S.q.values()){ if(!m.has(q.cap)) m.set(q.cap,{cap:q.cap,nome:q.capNome||'',total:0,resp:0,okUlt:0,cad:0,devidos:0}); }
  for(const q of S.q.values()){
    const c=m.get(q.cap); c.total++;
    const r=S.r.get(q.id);
    if(r&&r.tentativas){ c.resp++; if(r.ultimaMarcada===q.gabarito&&!jaErrou(r)) c.okUlt++; if(r.noCaderno) c.cad++; const p=proxDe(r); if(p&&p<=h) c.devidos++; }
  }
  return [...m.values()].sort((a,b)=>{const ta=topicoDoCap(a.cap),tb=topicoDoCap(b.cap);
    return (ta?ta.materiaOrdem||99:999)-(tb?tb.materiaOrdem||99:999)||(ta?ta.ordem||0:0)-(tb?tb.ordem||0:0)||a.cap.localeCompare(b.cap,'pt',{numeric:true});});
}
/* tópico do edital ligado a um capítulo do Caderno (o de menor ordem, se houver mais de um) */
function topicoDoCap(cap){let best=null;for(const t of S.ed.values()) if((t.caps||[]).includes(cap)&&(!best||(t.ordem||0)<(best.ordem||0))) best=t; return best}
/* Associação transparente por capítulo: toda questão aparece em Flashcards como cartão opcional de revisão,
 * sem alterar os 954 cartões autorais, o gabarito oficial ou o calendário original. */
function indiceQuestoes(){return window.QBQuestionLinks.build(S.q,S.ed,S.rv)}
function chaveQuestao(qid){return window.QBQuestionLinks.key(qid)}
function recursosQuestao(qid){return indiceQuestoes().byQuestion.get(qid)||null}
function atalhosQuestao(q,indice){
  const info=(indice?.byQuestion.get(q.id))||recursosQuestao(q.id);
  const mapped=[q.topico,...(info?.matchedIds||[])].some(id=>!!S.rv.get(id)?.mapa)
    ||[...S.rv.values()].some(rev=>rev?.mapa&&rev.questaoIds?.includes(q.id));
  return `<div class="qb-qsource-actions"><button type="button" class="btn ghost small" data-qcard="${esc(q.id)}">Revisar este item nos Flashcards</button>${mapped?`<button type="button" class="btn ghost small" data-qmap-question="${esc(q.id)}" aria-label="Localizar o conceito da questão no mapa mental">Localizar conceito no mapa ↗</button>`:''}</div>`;
}
function questoesEmMapa(qs,indice){
  if(!qs.length)return '';
  return `<details class="qb-qsource-list"><summary>Questões relacionadas ao capítulo · ${qs.length}</summary><p class="rule">Para cada questão, use “Localizar conceito no mapa”. A remissão busca o nó associado por ID ou conteúdo; quando só houver correspondência por capítulo, isso será informado sem inventar um subramo.</p>${qs.map(q=>`<details class="qb-qsource-item"><summary>${esc(q.enunciado)}</summary><div><p><b>Gabarito: ${esc(rotuloResposta(q,q.gabarito))}</b></p><p>${esc(q.comentario||'Comentário indisponível; confira a fonte.')}</p><small>${esc(q.ref||'Fonte não cadastrada')}</small>${atalhosQuestao(q,indice)}</div></details>`).join('')}</details>`;
}
function nomeTopicoIndice(id,idx){return S.ed.get(id)||idx.virtualTopics.get(id)||{id,titulo:id}}
function capNome(cap){for(const q of S.q.values()) if(q.cap===cap) return q.capNome||''; return ''}
function questoesDoCap(cap){return [...S.q.values()].filter(q=>q.cap===cap).sort((a,b)=>(a.ordem||0)-(b.ordem||0))}
function filaPara(cap,modo){
  let qs=questoesDoCap(cap);
  if(modo==='novos') qs=qs.filter(q=>!(S.r.get(q.id)?.tentativas));
  if(modo==='caderno') qs=qs.filter(q=>S.r.get(q.id)?.noCaderno);
  return qs.map(q=>q.id);
}
/* revisões vencidas, intercaladas: um item de cada capítulo por vez */
function devidas(){
  const h=hoje(), porCap=new Map();
  for(const r of S.r.values()){
    const q=S.q.get(r.qid); if(!q||q.foraNivel) continue;
    const p=proxDe(r); if(!p||p>h) continue;
    if(!porCap.has(q.cap)) porCap.set(q.cap,[]);
    porCap.get(q.cap).push({id:q.id,p,cad:!!r.noCaderno});
  }
  /* limite diário: erros do caderno primeiro, depois os acertos mais antigos; o que sobra fica para amanhã */
  const todas=[...porCap.values()].flat().sort((a,b)=>(b.cad-a.cad)||a.p.localeCompare(b.p));
  /* o limite é do dia: desconta o que já foi revisado hoje nas rodadas de revisão espaçada */
  const feitas=new Set(); for(const r of S.rodadas) if(r.modo==='revisao'&&diaDe(r.inicio)===h) for(const it of (r.itens||[])) feitas.add(it.qid);
  const lim=Math.max(0,LIMITE_DIA+(S.revExtra||0)-feitas.size);
  const escolhidas=new Set(todas.slice(0,lim).map(x=>x.id));
  const listas=[...porCap.values()].map(l=>l.filter(x=>escolhidas.has(x.id)).sort((a,b)=>(b.cad-a.cad)||a.p.localeCompare(b.p))).filter(l=>l.length);
  for(let i=listas.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[listas[i],listas[j]]=[listas[j],listas[i]]}
  const out=[]; let k=0, resto=true;
  while(resto){ resto=false; for(const l of listas){ if(k<l.length){ out.push(l[k].id); resto=true; } } k++; }
  const nCad=todas.filter(x=>x.cad&&escolhidas.has(x.id)).length;
  return {fila:out,caps:listas.length,atrasadas:todas.filter(x=>x.p<h&&escolhidas.has(x.id)).length,adiadas:Math.max(0,todas.length-lim),erros:nCad,feitasHoje:feitas.size};
}
function proximaData(){
  const h=hoje(); let min=null,n=0;
  for(const r of S.r.values()){ if(!S.q.has(r.qid)) continue; const p=proxDe(r); if(!p||p<=h) continue; if(!min||p<min){min=p;n=1} else if(p===min) n++; }
  return min?{d:min,n}:null;
}
function cadernoItens(){
  return [...S.r.values()].filter(r=>r.noCaderno&&S.q.has(r.qid))
    .map(r=>({r,q:S.q.get(r.qid)}))
    .sort((a,b)=>a.q.cap.localeCompare(b.q.cap,'pt',{numeric:true})||(a.q.ordem||0)-(b.q.ordem||0));
}
function textoHTML(q){
  const t=q&&q.textoId&&S.tx&&S.tx.get(q.textoId); if(!t) return '';
  return `<details class="why" open style="border-top:0;padding-top:0"><summary>Texto de apoio · ${esc(t.titulo||'')} <span class="ref">(${esc(t.itens||'')})</span></summary><div class="statement" style="font-size:16.5px;margin-top:8px">${String(t.texto||'').split(/\n\n+/).map(p=>`<p style="text-indent:1.5em">${esc(p)}</p>`).join('')}</div><p class="ref" style="text-align:right">${esc(t.fonte||'')}</p></details>`;
}
function statementHTML(q,travas){
  // "Situação hipotética: ... Assertiva: ..." vira dois blocos
  const f=travas?marcarTravas:esc;
  const t=String(q.enunciado||'');
  /* contexto antes da assertiva: situação hipotética, texto de apoio, dados de tabela ou proposição dada */
  const m=t.match(/^(Situação hipotética|Texto de apoio|Dados da tabela|Considere a proposição \S+):\s*([\s\S]*?)\s*Assertiva:\s*([\s\S]*)$/);
  if(m){ const lb=m[1].startsWith('Considere')?m[1].replace('Considere a ','').replace(/^p/,'P'):m[1];
    return `<span class="lbl">${esc(lb)}</span><p>${f(m[2])}</p><span class="lbl">Assertiva</span><p>${f(m[3])}</p>`; }
  return `<p>${f(t)}</p>`;
}
function rotuloCap(cap){return cap==='MIX'?'Revisão intercalada':cap==='PEG'?'Pegadinhas':'Cap. '+cap}
const multiCap=cap=>cap==='MIX'||cap==='PEG';

/* ---------- navegação ---------- */
/* Estudo reúne a prática e o acompanhamento pedagógico; Desempenho mantém a análise histórica. */
const PAI={cartoes:'estudo',mapa:'estudo',pegadinhas:'estudo',conteudo:'estudo',aprendizagem:'estudo',caderno:'treinar',metodo:'historico',analiseDia:'historico'};
const SUBS={estudo:[['mapa','Mapas mentais'],['cartoes','Flashcards'],['pegadinhas','Pegadinhas'],['conteudo','Materiais'],['aprendizagem','Aprendizagem']],treinar:[['treinar','Treinar'],['caderno','Caderno de erros']],historico:[['analiseDia','Análise diária'],['historico','Análise histórica'],['metodo','Método']]};
function subnav(){
  const pai=PAI[S.view]||S.view, l=SUBS[pai]; if(!l) return '';
  const cnt={caderno:cadernoItens().length,pegadinhas:S.pg.size};
  return `<div class="seg subnav qb-header-tabs" role="group" aria-label="Seções">${l.map(([v,t])=>`<button data-sub="${v}" aria-pressed="${S.view===v}">${t}${cnt[v]?` <span class="count${v==='caderno'?' hot':''}">${cnt[v]}</span>`:''}</button>`).join('')}</div>`;
}
const SECTION_INTROS={
  edital:['EDITAL VERTICALIZADO','Seu edital, em perspectiva','Acompanhe disciplinas e assuntos, visualize o progresso e identifique lacunas para estudar com precisão.'],
  treinar:['PRÁTICA ATIVA','Treine com estratégia','Escolha um assunto, ajuste a rodada e desenvolva precisão nas questões do CEBRASPE.'],
  caderno:['CADERNO DE ERROS','Erros que viram acertos','Reveja as questões que exigem atenção e transforme suas dificuldades em retenção.'],
  revisao:['REVISÃO ATIVA','Revisar é consolidar','Retome conceitos no momento certo, evoque antes de revelar e acompanhe sua memória.'],
  mapa:['MAPAS MENTAIS','Conceitos e questões em conexão','Explore relações entre os temas e as questões ligadas a cada tópico, sem duplicar o edital verticalizado.'],
  cartoes:['FLASHCARDS · REVISÃO ATIVA','Conhecimento e questões conectados','Revise os cartões originais, consulte as questões vinculadas e confira gabaritos e comentários depois de responder.'],
  pegadinhas:['INTELIGÊNCIA DE BANCA','Antecipe as armadilhas','Reconheça os mecanismos recorrentes do CEBRASPE e aprenda a escapar deles.'],
  conteudo:['BIBLIOTECA DE ESTUDOS','Conhecimento organizado','Acesse seus materiais, resumos e fontes por disciplina e assunto.'],
  simulado:['SIMULADOS · CEBRASPE','Pratique como na prova','Teste domínio, ritmo e estratégia com exercícios em condições de prova.'],
  analiseDia:['ANÁLISE DIÁRIA','Desempenho diário','Os resultados reais das suas rodadas e tarefas em cada dia.'],
  aprendizagem:['APRENDIZAGEM','Verifique o que permaneceu','Acompanhe recuperação, confiança e retenção sem duplicar Flashcards, Revisão ou Pegadinhas.'],
  metodo:['MÉTODO DE ESTUDO','Uma estratégia para evoluir','Entenda as regras de revisão, prática deliberada e análise de erros que orientam seus estudos.']
};
function sectionIntro(v){
  const info=SECTION_INTROS[v]; if(!info) return '';
  return '<section class="qb-section-intro qb-page-hero" aria-label="Cabeçalho da seção"><div class="qb-page-hero-copy"><span class="qb-section-kicker">'+info[0]+' · QUEBRANDO A BANCA</span><h2>'+info[1]+'</h2><p>'+info[2]+'</p></div></section>';
}
function syncNavigation(active){
  for(const id of ['portal','painel','edital','treinar','estudo','simulado','historico']){
    const button=$('#tab-'+id);
    if(!button)continue;
    if(id===active)button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
  const back=$('#qb-radial-return');
  if(back)back.hidden=S.view==='portal';
}
function openPortal(section=null,push=true,focus=true){
  S.areaHub=null;
  const available=['painel','edital','treinar','estudo',...($('#tab-simulado')?['simulado']:[]),'historico'];
  S.radialSection=available.includes(section)?section:null;
  S.view='portal';
  syncNavigation(S.radialSection||'portal');
  if(push){
    try{history.replaceState(null,'',location.href.split('#')[0]+'#menu'+(S.radialSection?'/'+S.radialSection:''));}catch(e){}
  }
  render(true);
  if(focus){
    $('#main .qb-radial-screen-title')?.focus({preventScroll:true});

function setView(v,push=true,radialArea=null){
  if(v==='portal'){openPortal(null,push);return;}
  S.areaHub=radialArea?{area:radialArea,level:'main',matter:null,tool:null,page:0}:null;
  if(v==='treinar'&&S.view==='portal'&&!S.round)S.trRadial=null;
  if(v==='estudo') v=S.ultEstudo||'mapa';
  if(v==='revisao') v='edital'; /* antigas URLs continuam úteis sem duplicar o edital em Estudo */

/* ---------- render ---------- */
let radialCleanup=null;
function render(force){
  const ae=document.activeElement;
  if(!force && ae && ae.dataset && (ae.dataset.nota||ae.dataset.cresp||ae.dataset.learnDraft||ae.id?.startsWith('learn-'))){ S.pendingRender=true; updateCounts(); return; }
  S.pendingRender=false;
  updateCounts();
  const main=$('#main');
  if(S.view==='portal'){
    const screen=S.radialSection||'menu';
    // Database updates must NOT restart the ambient ring or steal its focus.
    if(main.querySelector('.qb-radial-hub')?.dataset.radialScreen===screen)return;
    radialCleanup?.();
    radialCleanup=null;
    const available=['painel','edital','treinar','estudo',...($('#tab-simulado')?['simulado']:[]),'historico'];
    main.innerHTML=window.QBRadialDashboard?.render(S.radialSection,available)
      ||'<div class="notice">O menu radial não pôde ser carregado. Use as abas superiores.</div>';
    radialCleanup=window.QBRadialDashboard?.wire(main,{
      onModule:key=>openPortal(key),
      onBack:()=>openPortal(null),
      onOpen:target=>{setView(target);window.scrollTo({top:0,behavior:'instant'});}
    })||null;
    return;
  }
  if(S.areaHub&&S.qLoaded&&S.dbState==='ok'&&S.q.size>0 &&
     !(S.areaHub.area==='simulado'&&(S.studyAccount||simLS('obj')||simLS('disc')))){
    radialCleanup?.();radialCleanup=null;
    const config=configAreaRadial();
    main.innerHTML=window.QBAreaRadial?.render(config)||
      '<div class="notice">O menu radial está indisponível. Use as abas superiores.</div>';
    radialCleanup=window.QBAreaRadial?.wire(main,config,{
      onSelect:selecionarAreaRadial,
      onBack:voltarAreaRadial,
      onOriginal:()=>abrirAreaOriginal(),
      onPage:page=>{S.areaHub.page=page;render(true)}
    })||null;
    return;
  }
  if(S.view==='treinar'&&!S.round&&!S.trRadial?.setup&&!S.trRadial?.classic&&S.qLoaded&&S.dbState==='ok'&&S.q.size>0){
    radialCleanup?.();
    radialCleanup=null;
    const model=treinoRadialDados();
    if(!S.trRadial)S.trRadial={matter:null,page:0,setup:false,classic:false};
    if(S.trRadial.matter&&!model.matters.some(m=>m.id===S.trRadial.matter)){
      S.trRadial={matter:null,page:0,setup:false,classic:false};
    }
    main.innerHTML=window.QBTrainingRadial?.render(model,S.trRadial)
      ||'<div class="notice">A navegação radial está indisponível. Use as abas superiores.</div>';
    radialCleanup=window.QBTrainingRadial?.wire(main,{
      onMatter:id=>{S.trRadial={matter:id,page:0,setup:false,classic:false};render(true);},
      onTopic:id=>{
        const mat=model.matters.find(m=>m.id===S.trRadial?.matter);
        if(!mat?.topics.some(t=>t.id===id&&t.questionIds.length))return;
        S.trRadial={...S.trRadial,topic:id,setup:true,classic:false};
        S.modo='novos';render(true);
      },
      onPage:page=>{S.trRadial.page=page;render(true);},
      onBack:()=>{S.trRadial={matter:null,page:0,setup:false,classic:false};render(true);},
      onClassic:()=>{S.trRadial={...S.trRadial,setup:false,classic:true};render(true);},
      onReview:()=>{if(!devidas().fila.length){toast('Nenhuma revisão vencida neste momento.');return;}startRevisao();},
      onErrors:()=>setView('caderno'),
    })||null;
    return;
  }
  radialCleanup?.();
  radialCleanup=null;
  if(S.view==='metodo'){ main.innerHTML=`<div class="qb-tab-shell">${subnav()}</div>`+sectionIntro('metodo')+`<div class="wrap" style="gap:14px">${viewMetodo()}</div>`; wire(); return; }
  if(S.dbState==='loading'){ main.innerHTML=`<div class="notice">Abrindo o caderno…</div>`; return; }
  if(S.dbState==='missing'){ main.innerHTML=`<div class="notice"><strong>Não foi possível abrir o banco de respostas nesta visualização.</strong> Abra a página Estudar do Quebrando a Banca com a sua conta.</div>`; return; }
  if(!S.qLoaded){ main.innerHTML=`<div class="notice">Carregando as questões…</div>`; return; }
  if(S.studyAccount&&S.view==='treinar'&&S.q.size===0){ main.innerHTML='<div class="notice">As questões deste concurso ainda não foram carregadas.</div>'; return; }
  if(!S.studyAccount&&S.q.size===0){ main.innerHTML=`<div class="notice"><strong>Nenhuma questão carregada ainda.</strong> Peça ao Claude, na conversa, para adicionar os itens de um capítulo. Eles aparecem aqui automaticamente.</div>`; return; }
  if(S.view==='painel') main.innerHTML=viewPainel();
  else if(S.view==='edital') main.innerHTML=viewEdital();
  else if(S.view==='revisao') main.innerHTML=viewRevisao();
  else if(S.view==='mapa') main.innerHTML=viewMapa();
  else if(S.view==='cartoes') main.innerHTML=viewCartoes();
  else if(S.view==='pegadinhas') main.innerHTML=viewPegadinhas();
  else if(S.view==='conteudo') main.innerHTML=viewConteudo();
  else if(S.view==='aprendizagem') main.innerHTML=window.QBLearning.render(S,hoje());
  else if(S.view==='treinar') main.innerHTML=S.round?(S.round.fim?viewFim():viewItem()):S.trRadial?.setup?viewTreinoAssunto():viewSetup();
  else if(S.view==='caderno') main.innerHTML=viewCaderno();
  else if(S.view==='analiseDia') main.innerHTML=window.QBInsights ? window.QBInsights.render(S,hoje) : '<div class="notice">Análise diária indisponível.</div>';
  else if(S.view==='simulado'){ main.innerHTML=viewSimulado(); if(!simLS('obj')&&!simLS('disc')) main.insertAdjacentHTML('afterbegin',sectionIntro('simulado')); wireSim(); return; }
  else main.innerHTML=viewHistorico();
  if(S.view==='painel'&&window.QBLearning) main.insertAdjacentHTML('beforeend',window.QBLearning.weeklyHTML(S,hoje()));
  if(S.view!=='aprendizagem'&&window.QBLearning) main.insertAdjacentHTML('afterbegin',window.QBLearning.statusHTML());
  const sn=subnav();
  if(S.view!=='painel'&&S.view!=='analiseDia'&&!(S.view==='treinar'&&S.round)) main.insertAdjacentHTML('afterbegin',sectionIntro(S.view));
  if(sn&&!(S.view==='treinar'&&S.round)) main.insertAdjacentHTML('afterbegin',`<div class="qb-tab-shell">${sn}</div>`);
  wire();
}
function updateCounts(){
  const d=S.qLoaded?devidas().fila.length:0, eh=$('#cnt-hoje');
  eh.textContent=d; eh.classList.toggle('hot',d>0);
  const cd=$('#countdown');
  if(!PROVA){cd.textContent='';return;}
  const f=difDias(hoje(),PROVA), data=PROVA.split('-').reverse().join('/');
  cd.innerHTML=f>0?`Prova em ${data} · <b>${f}</b> ${f===1?'dia':'dias'}`:(f===0?'<b>Prova hoje</b>':'Prova realizada');
}

/* Menus AXON de todas as áreas que admitem seleção sem interromper
 * uma atividade. Cada folha retorna à TELA ORIGINAL e aos IDs do banco.
 * Somente a navegação superior cria um menu de entrada: remissões, questões,
 * revisão, botões internos e deep links continuam indo direto à ferramenta.
 */
function configAreaRadial(){
  const h=S.areaHub,area=h?.area||'painel',level=h?.level||'main';
  const ledger=treinoRadialDados(),index=indiceQuestoes(),list=porMateria();
  const areaNames={painel:'Hoje',edital:'Edital',estudo:'Estudo',historico:'Desempenho',simulado:'Simulado'};
  const option=(id,name,caption,stats=null,icon='◇')=>({id,name,caption,stats,icon});
  const title=areaNames[area]||'Quebrando a Banca';
  const base={area,level,page:h?.page||0,title,
    centerTitle:title,centerEyebrow:'AXON · '+title.toUpperCase(),
    subtitle:'Selecione uma função no anel para abrir a interface correspondente.',
    originalLabel:'Abrir tela completa',
    footer:'O anel é apenas navegação. Todas as telas, vínculos, filtros e dados originais continuam disponíveis.',
    items:[]};
  const matStats=sig=>ledger.matters.find(m=>m.id===sig)?.stats||null;
  const topicStats=t=>window.QBTrainingRadial.summary(
    [...S.q.values()].filter(q=>(t.caps||[]).includes(q.cap)).map(q=>q.id),S.q,S.r);
  if(area==='painel'){
    base.title='Hoje · central de estudo';
    base.centerTitle='Seu dia';
    base.subtitle='Escolha o que deseja acompanhar ou executar hoje.';
    const dv=devidas(),todayCards=[...S.rv.keys()].reduce((n,id)=>n+cartStats(id).hoje,0);
    base.items=[
      option('nav:planner','Planejamento','Agenda, tarefas e metas','', '◷'),
      option('nav:review','Revisões vencidas',dv.fila.length+' itens previstos',null,'↺'),
      option('nav:cards','Flashcards',todayCards+' cartões vencidos',null,'▧'),
      option('nav:train','Treinar','Questões e CEBRASPE',null,'◎'),
      option('nav:daily','Análise diária','Indicadores do dia',null,'↗'),
      option('nav:edital','Edital','Disciplinas e prioridades',null,'▦')
    ];
    return base;
  }
  if(area==='simulado'){
    base.title='Simulado · central de provas';
    base.centerTitle='Simulado';
    base.subtitle='A escolha abre a tela da prova; o cronômetro só começa ao confirmar o início.';
    base.items=[
      option('nav:objective','Objetiva','300 min · P1 + P2',null,'◈'),
      option('nav:discursive','Discursiva','180 min · redação',null,'▤'),
      option('nav:composition','Composição','Distribuição por matéria',null,'▦'),
      option('nav:history','Resultados','Histórico de simulados',null,'↗')
    ];
    return base;
  }
  if(area==='historico'&&level==='main'){
    base.title='Desempenho · central de análise';
    base.centerTitle='Desempenho consolidado';
    base.stats=ledger.stats;
    base.subtitle='O percentual do centro é o mesmo do Histórico: questões com erro anterior não contam como acerto consolidado.';
    base.items=[
      option('nav:daily','Análise diária','Precisão das rodadas',null,'◷'),
      option('nav:history','Análise histórica','Evolução e cobertura',ledger.stats,'↗'),
      option('nav:subjects','Por matéria','Indicadores por disciplina',null,'◎'),
      option('nav:method','Método','Estratégia e revisão',null,'◇'),
      option('nav:errors','Caderno de erros','Erros para consolidar',null,'↺')
    ];
    return base;
  }
  if(area==='estudo'&&level==='main'){
    base.title='Estudo · ferramentas';
    base.centerTitle='Estudo';
    base.subtitle='Escolha uma ferramenta. Mapas, flashcards, pegadinhas e materiais podem ser filtrados por matéria e assunto.';
    base.items=[
      option('tool:mapa','Mapa mental 3D','Navegação AXON',null,'◇'),
      option('tool:cartoes','Flashcards','Evocação e revisão ativa',null,'▧'),
      option('tool:pegadinhas','Pegadinhas','Armadilhas CEBRASPE',null,'⌁'),
      option('tool:conteudo','Materiais','Biblioteca e fontes',null,'▤'),
      option('nav:aprendizagem','Aprendizagem','Retenção e recuperação',null,'↗'),
      option('nav:study-review','Revisar hoje','Cartões vencidos',null,'↺')
    ];
    return base;
  }
  function toolHas(topic,tool){
    if(tool==='mapa')return !!S.rv.get(topic.id)?.mapa?.ramos?.length;
    if(tool==='cartoes')return !!(S.rv.get(topic.id)?.cartoes?.length||index.byTopic.get(topic.id)?.length);
    if(tool==='pegadinhas')return pgsDe(topic.id).length>0;
    if(tool==='conteudo')return matsDe(topic.id).some(m=>['material','cobertura','fonte','metodo'].includes(m.tipo));
    return true;
  }
  if(area==='edital'&&level==='main'){
    base.title='Edital · matérias';
    base.centerTitle='Cobertura do edital';
    base.stats=ledger.stats;
    base.subtitle='Primeiro selecione a disciplina. Depois, abra diretamente o assunto no edital completo.';
    base.items=list.map(g=>option('m:'+g.sigla,g.nome,
      g.ts.filter(x=>!x.t.foraEdital).length+' assuntos · '+g.prova,matStats(g.sigla),'▦'));
    return base;
  }
  if(area==='historico'&&level==='matters'){
    base.parent=true;base.title='Desempenho · matérias';base.centerTitle='Por matéria';
    base.stats=ledger.stats;
    base.subtitle='Selecione uma disciplina para abrir o Histórico filtrado, mantendo os gráficos e sessões.';
    base.items=ledger.matters.filter(m=>m.stats.total).map(m=>option('m:'+m.id,m.name,
      m.stats.respondidas+'/'+m.stats.total+' respondidas',m.stats,'↗'));
    return base;
  }
  if(area==='estudo'&&level==='matters'){
    base.parent=true;base.title='Estudo · '+({mapa:'Mapas 3D',cartoes:'Flashcards',pegadinhas:'Pegadinhas',conteudo:'Materiais'}[h.tool]||'Ferramenta');
    base.centerTitle='Escolha a matéria';
    base.subtitle='Selecione uma matéria com conteúdo cadastrado nesta ferramenta.';
    base.items=list.map(g=>{
      const available=g.ts.filter(x=>toolHas(x.t,h.tool));
      return option('m:'+g.sigla,g.nome,available.length+' assuntos disponíveis',null,'◇');
    }).filter(x=>!x.caption.startsWith('0 assuntos'));
    return base;
  }
  if(level==='topics'&&(area==='edital'||area==='estudo')){
    const group=list.find(g=>g.sigla===h.matter);
    base.parent=true;base.title=group?.nome||'Assuntos';
    base.centerTitle=group?.nome||'Assuntos';
    base.subtitle=area==='edital'?'Selecione o tópico para abrir sua ficha completa no Edital.':'Selecione o assunto para abrir a ferramenta com esse conteúdo.';
    const items=group?.ts.filter(x=>!x.t.foraEdital&&(area==='edital'||toolHas(x.t,h.tool)))||[];
    base.items=items.map(({t,s})=>option('t:'+t.id,(t.num?t.num+' · ':'')+t.titulo,
      area==='edital'?(s.resp+'/'+s.total+' respondidas · '+(s.ef||'')):'Abrir conteúdo do assunto',
      area==='edital'?topicStats(t):null,'◇'));
    base.quickSelect=base.items.length>6;
    base.stats=area==='edital'?matStats(h.matter):null;
    return base;
  }
  return base;
}
function alterarAreaRadial(state){
  S.areaHub={...S.areaHub,...state};
  render(true);
  $('#main .qb-radial-screen-title')?.focus({preventScroll:true});
}
function voltarAreaRadial(){
  const h=S.areaHub;if(!h)return;
  if(h.level==='topics')alterarAreaRadial({level:h.area==='edital'?'main':'matters',matter:null,page:0});
  else if(h.level==='matters')alterarAreaRadial({level:'main',matter:null,tool:null,page:0});
  else openPortal(null);
}
function abrirAreaOriginal(){
  const h=S.areaHub;if(!h)return;
  if(h.area==='edital'&&h.matter){S.fMat=h.matter;S.fSt='';S.abertos.add(h.matter);}
  const v=h.area==='estudo'?(h.tool||S.ultEstudo||'mapa'):h.area;
  setView(v);
}
function selecionarAreaRadial(item){
  const h=S.areaHub;if(!h||!item)return;
  const id=item.id,area=h.area;
  if(id.startsWith('tool:')){
    alterarAreaRadial({tool:id.slice(5),level:'matters',matter:null,page:0});return;
  }
  if(id.startsWith('m:')){
    const key=id.slice(2);
    if(area==='historico'){
      S.fEvo=key==='_outros'?'_':key;
      S.evoPagina=0;setView('historico');return;
    }
    alterarAreaRadial({level:'topics',matter:key,page:0});return;
  }
  if(id.startsWith('t:')){
    const topic=S.ed.get(id.slice(2));if(!topic)return;
    if(area==='edital'){
      S.fMat=topic.sigla;S.fSt='';
      S.abertos.add(topic.sigla);setView('edital');
      requestAnimationFrame(()=>{
        const el=document.getElementById('tp-'+topic.id);
        if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');
          setTimeout(()=>el.classList.remove('flash'),1800);}
      });
      return;
    }
    if(area==='estudo'){
      const tool=h.tool;
      if(tool==='mapa'){
        if(!S.rv.get(topic.id)?.mapa)return;
        S.mapaId=topic.id;S.mapaAb=null;S.mapaBack=null;S.mapaFocus=null;S.revelados.clear();
        setView('mapa');
      } else if(tool==='cartoes'){
        S.cartId=topic.id;S.cartPend=false;setView('cartoes');
      } else if(tool==='pegadinhas'){
        S.pgModo='top';S.fPgMat=topic.sigla;S.fPgTipo='';
        S.abertos.add('pg:'+topic.sigla);S.abertos.add('pgt:'+topic.id);setView('pegadinhas');
        requestAnimationFrame(()=>document.getElementById('pg-'+topic.id)?.scrollIntoView({behavior:'smooth',block:'center'}));
      } else if(tool==='conteudo'){
        S.abertos.add('ct:'+topic.materia);setView('conteudo');
        requestAnimationFrame(()=>{
          const card=[...document.querySelectorAll('[data-content-topics]')]
            .find(el=>el.dataset.contentTopics.split('|').includes(topic.id));
          card?.scrollIntoView({behavior:'smooth',block:'center'});
        });
      }
      return;
    }
  }
  if(!id.startsWith('nav:'))return;
  const target=id.slice(4);
  const open=v=>{setView(v);window.scrollTo({top:0,behavior:'instant'})};
  if(target==='planner'){open('painel');return;}
  if(target==='review'){if(!devidas().fila.length){toast('Nenhuma revisão pendente.');return;}startRevisao();return;}
  if(target==='cards'||target==='study-review'){open('cartoes');return;}
  if(target==='train'){S.trRadial=null;open('treinar');return;}
  if(target==='daily'){open('analiseDia');return;}
  if(target==='edital'){setView('edital',true,'edital');return;}
  if(target==='aprendizagem'){open('aprendizagem');return;}
  if(target==='history'){open(area==='simulado'?'simulado':'historico');
    if(area==='simulado')requestAnimationFrame(()=>document.getElementById('qb-sim-history')?.scrollIntoView({behavior:'smooth',block:'start'}));
    return;
  }
  if(target==='subjects'){alterarAreaRadial({level:'matters',page:0});return;}
  if(target==='method'){open('metodo');return;}
  if(target==='errors'){open('caderno');return;}
  if(['objective','discursive','composition'].includes(target)){
    open('simulado');
    const selector=target==='objective'?'#sim-obj':target==='discursive'?'#sim-disc':'#qb-sim-composition';
    requestAnimationFrame(()=>document.querySelector(selector)?.scrollIntoView({behavior:'smooth',block:'center'}));
  }
}

/* Radial de Treinar: as matérias e os assuntos usam IDs reais do edital.
 * A barra central usa uma única última resposta por questão, sem inventar
 * erros a partir de itens que ainda não foram respondidos. */
function treinoRadialDados(){
  return window.QBTrainingRadial.build({
    questions:S.q,topics:S.ed,responses:S.r,index:indiceQuestoes()
  });
}
function treinoAssuntoSelecionado(){
  const state=S.trRadial||{},data=treinoRadialDados();
  const mat=data.matters.find(m=>m.id===state.matter);
  return {data,mat,topic:mat?.topics.find(t=>t.id===state.topic)||null};
}
function filaTreinoAssunto(topic,modo){
  if(!topic)return [];
  const ids=topic.questionIds.filter(id=>S.q.has(id));
  if(modo==='novos')return ids.filter(id=>!S.r.get(id)?.tentativas);
  if(modo==='caderno')return ids.filter(id=>!!S.r.get(id)?.noCaderno);
  return ids;
}
function viewTreinoAssunto(){
  const {mat,topic}=treinoAssuntoSelecionado();
  if(!mat||!topic)return '<div class="notice">O assunto selecionado já não está no edital. Volte à aba Treinar para escolher outro.</div>';
  const nNew=filaTreinoAssunto(topic,'novos').length,
    nAll=filaTreinoAssunto(topic,'todos').length,
    nCad=filaTreinoAssunto(topic,'caderno').length;
  if(S.modo==='novos'&&!nNew)S.modo='todos';
  if(S.modo==='caderno'&&!nCad)S.modo='todos';
  const n=filaTreinoAssunto(topic,S.modo).length;
  const s=topic.stats,p=window.QBTrainingRadial.percentages(s);
  const bar='<div class="qb-train-core-bar" role="img" aria-label="'+esc(s.acertos+' acertos, '+s.erros+' erros, '+s.brancos+' brancos em '+s.respondidas+' respondidas')+'">'
    +'<span class="qb-train-bar-segment qb-train-bar-correct" style="width:'+p.acertos.toFixed(2)+'%"></span>'
    +'<span class="qb-train-bar-segment qb-train-bar-wrong" style="width:'+p.erros.toFixed(2)+'%"></span>'

  const mode=(id,title,desc,count)=>'<label class="mode'+(count?'':' disabled')+'">'
    +'<input type="radio" name="modo" id="modo-'+id+'" value="'+id+'" '+(S.modo===id?'checked':'')+' '+(count?'':'disabled')+'>'
    +'<div><b>'+title+'</b> <span class="mono">('+count+')</span><span>'+desc+'</span></div></label>';
  return '<section class="wrap qb-train-selection">'

    +'</div>'
    +'<button type="button" data-train-return="topics">← Voltar aos assuntos</button></header>'
    +'<div class="qb-train-selected-stats">'+bar
    +'<span><b>'+s.acertos+'</b> acertos · <b>'+s.erros+'</b> erros · <b>'+s.brancos+'</b> em branco</span>'
    +'<span>'+s.respondidas+' de '+s.total+' respondidas</span></div>'
    +'<div class="qb-train-explanation">A barra considera o resultado mais recente de cada questão respondida. '
    +'Questões ainda não realizadas não entram no percentual, e os registros anteriores continuam preservados para revisão.</div>'
    +'<h3 class="section-title">Escolha a rodada</h3>'
    +'<div class="modes">'
    +mode('novos','Questões novas','Itens deste assunto que ainda não foram respondidos.',nNew)
    +mode('todos','Todas as questões','Repetir todos os itens do assunto, inclusive os respondidos.',nAll)
    +mode('caderno','Somente erros','Itens deste assunto que permanecem no Caderno de erros.',nCad)
    +'</div><div class="row">'
    +'<button class="btn" id="start" '+(n?'':'disabled')+'>Começar rodada · '+n+' '+(n===1?'questão':'questões')+'</button>'
    +'<label class="check"><input type="checkbox" id="shuffle" '+(S.shuffle?'checked':'')+'> Embaralhar a ordem</label>'
    +'</div></section>';
}
function iniciarTreinoAssunto(){
  const {mat,topic}=treinoAssuntoSelecionado();
  if(!topic||!mat)return;
  const ids=filaTreinoAssunto(topic,S.modo).slice();
  if(!ids.length){toast('Ainda não há questões para este filtro do assunto.');return;}
  if(S.shuffle)for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  novaRodada('MIX',mat.name+' · '+topic.title,S.modo,ids);
}

function viewSetup(){
  const cs=caps();
  if(!S.cap||!S.capEscolhido||!cs.find(c=>c.cap===S.cap)) S.cap=cs[0].cap;
  const nNovos=filaPara(S.cap,'novos').length, nTodos=filaPara(S.cap,'todos').length, nCad=filaPara(S.cap,'caderno').length;
  if(S.modo==='novos'&&!nNovos) S.modo='todos';
  if(S.modo==='caderno'&&!nCad) S.modo='todos';
  const n=filaPara(S.cap,S.modo).length;
  const dv=devidas(), px=proximaData();
  const due=dv.fila.length?`<section class="due" aria-label="Revisão espaçada de hoje">
      <div class="due-body"><h2 class="section-title">Revisão espaçada de hoje</h2>
        <div class="due-n"><span class="mono">${dv.fila.length}</span> ${dv.fila.length===1?'item':'itens'} para hoje</div>
        <div class="due-meta">${dv.erros} do caderno de erros e ${dv.fila.length-dv.erros} ${dv.fila.length-dv.erros===1?'acerto':'acertos'} para confirmar · ${dv.caps} ${dv.caps===1?'capítulo':'capítulos'}, intercalados.${dv.feitasHoje?` Você já revisou ${dv.feitasHoje} hoje.`:''}${dv.adiadas?` Limite de ${LIMITE_DIA} por dia: ${dv.adiadas} ${dv.adiadas===1?'item fica':'itens ficam'} para os próximos dias.`:''}</div></div>
      <button class="btn" id="start-rev">Começar revisão</button></section>`
    :`<section class="due calm" aria-label="Revisão espaçada"><div class="due-body"><h2 class="section-title">Revisão espaçada</h2>
        <div class="due-meta">${dv.feitasHoje?`Meta de hoje cumprida: <b class="mono">${dv.feitasHoje}</b> revisadas.${dv.adiadas?` ${dv.adiadas} ${dv.adiadas===1?'item vencido fica':'itens vencidos ficam'} para os próximos dias.`:''}</div>${dv.adiadas?'<button class="btn ghost small" id="rev-mais" style="margin-top:6px;align-self:flex-start">Revisar mais 20 (opcional)</button>':''}<div class="due-meta" hidden>`:'Nada vence hoje.'}${px?` Próxima revisão em <b class="mono">${ddmm(px.d)}</b>: ${px.n} ${px.n===1?'item':'itens'}.`:' Responda itens para montar a agenda.'}</div></div></section>`;
  const card=c=>{
    const ok=c.total?c.okUlt/c.total*100:0, bad=c.total?(c.resp-c.okUlt)/c.total*100:0;
    const t=topicoDoCap(c.cap);
    const nome=t?String(c.nome||'').replace(/^[^·]*·\s*/,''):c.nome;
    return `<button class="cap" data-cap="${esc(c.cap)}" aria-pressed="${c.cap===S.cap}">
      <span class="cn">${t?`Edital ${esc(t.num)} · `:''}Capítulo ${esc(c.cap)}</span>
      <span class="ct">${esc(nome)}</span>
      <span class="bar" aria-hidden="true"><i style="width:${ok}%;background:var(--certo)"></i><i style="width:${bad}%;background:var(--errado)"></i></span>
      <span class="meta">${c.resp}/${c.total} feitas · ${c.cad} no caderno${c.devidos?` · ${c.devidos} hoje`:''}</span>
    </button>`};
  /* agrupa por matéria, como na aba Edital: P1 e P2, matérias e capítulos na ordem do edital */
  const grupos=new Map();
  for(const c of cs){
    const t=topicoDoCap(c.cap);
    const k=t?t.sigla:'_outros';
    if(!grupos.has(k)) grupos.set(k,{k,nome:t?t.materia:'Outros capítulos',prova:t?t.prova:'',cs:[]});
    grupos.get(k).cs.push(c);
  }
  const gSel=[...grupos.values()].find(g=>g.cs.some(c=>c.cap===S.cap));
  if(gSel&&S.edLoaded&&!S.trIni){ S.trIni=true; S.abertos.add('tr:'+gSel.k); }
  const grupoHTML=g=>{
    const tot=g.cs.reduce((a,c)=>a+c.total,0), resp=g.cs.reduce((a,c)=>a+c.resp,0), ok=g.cs.reduce((a,c)=>a+c.okUlt,0), dev=g.cs.reduce((a,c)=>a+c.devidos,0);
    const sel=g.cs.some(c=>c.cap===S.cap);
    return `<details class="mat-g" data-grupo="tr:${esc(g.k)}" ${S.abertos.has('tr:'+g.k)?'open':''}><summary><span class="gn">${esc(g.nome)}${sel?' <span class="mono" style="font-size:12px;color:var(--pen)">· selecionado</span>':''}</span><span class="sbar" aria-hidden="true">${tot?`<i style="width:${ok/tot*100}%;background:var(--certo)"></i><i style="width:${(resp-ok)/tot*100}%;background:var(--errado)"></i>`:''}</span><span class="mono" style="font-size:12.5px;color:var(--muted)">${g.cs.length} ${g.cs.length===1?'capítulo':'capítulos'} · ${resp}/${tot}${dev?` · ${dev} hoje`:''}</span></summary>
      <div class="caps" style="padding:0 16px 16px">${g.cs.map(card).join('')}</div></details>`};
  let capCards='';
  for(const p of ['P1','P2','']){
    const gp=[...grupos.values()].filter(g=>g.prova===p);
    if(!gp.length) continue;
    capCards+=`<h3 class="prova-h" style="margin:4px 0 0;background:none;border:0;padding:0">${esc(PROVAS[p]||'Sem tópico do edital')}</h3>${gp.map(grupoHTML).join('')}`;
  }
  const mode=(id,title,desc,count)=>`<label class="mode${count?'':' disabled'}">
      <input type="radio" name="modo" id="modo-${id}" value="${id}" ${S.modo===id?'checked':''} ${count?'':'disabled'}>
      <div><b>${title}</b> <span class="mono">(${count})</span><br><span>${desc}</span></div></label>`;
  return `<div class="wrap" style="gap:18px">
    ${S.trRadial?.classic?'<div class="row"><button type="button" class="btn ghost small" data-train-return="matters">← Voltar ao menu radial de matérias</button></div>':''}
    ${due}
    <h2 class="section-title">Capítulo · por matéria, na ordem do edital</h2>
    <div class="row"><button class="btn ghost small" id="tr-abrir">Abrir tudo</button><button class="btn ghost small" id="tr-fechar">Fechar tudo</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">${capCards}</div>
    <h2 class="section-title">O que treinar</h2>
    <div class="modes">
      ${mode('novos','Só as que ainda não fiz','Itens do capítulo que você nunca respondeu.',nNovos)}
      ${mode('todos','Todas do capítulo','Refaz o capítulo inteiro. Cada resposta atualiza o caderno e a agenda.',nTodos)}
      ${mode('caderno','Revisar o caderno de erros','Só os itens que você errou, deixou em branco ou acertou no chute. Dois acertos seguidos com segurança tiram o item do caderno.',nCad)}
    </div>
    <div class="row">
      <button class="btn" id="start" ${n?'':'disabled'}>Começar rodada · ${n} ${n===1?'item':'itens'}</button>
      <label class="check"><input type="checkbox" id="shuffle" ${S.shuffle?'checked':''}> Embaralhar a ordem</label>
    </div>
  </div>`;
}

function emRep(rd){return rd.rep.ini!==null&&rd.idx>=rd.rep.ini}
function placar(rd){
  const liq=rd.certos-rd.errados;
  const prog=emRep(rd)?`Repescagem ${rd.idx-rd.rep.ini+1} de ${rd.fila.length-rd.rep.ini} · não conta no placar`:`Item ${Math.min(rd.idx+1,rd.fila.length)} de ${rd.fila.length} · ${esc(rotuloCap(rd.cap))}`;
  return `<div class="scorebar">
    <span class="progress">${prog}</span>
    <span class="score"><span class="c">C ${rd.certos}</span><span class="e">E ${rd.errados}</span><span class="b">B ${rd.brancos}</span><span class="n">Nota líquida ${liq}</span></span>
  </div>`;
}
function chipsOrigem(qid,atual){
  const o=atual&&ORIGENS[atual];
  return `<div class="origem"><span class="origem-q">De onde veio o erro?</span>
    <div class="chips">${Object.entries(ORIGENS).map(([k,v])=>`<button class="chip" data-origem="${esc(qid)}" data-val="${k}" aria-pressed="${atual===k}">${v.t}</button>`).join('')}</div>
    ${o?`<p class="origem-hint">${esc(o.d)}</p>`:''}</div>`;
}
function viewItem(){
  const rd=S.round, q=S.q.get(rd.fila[rd.idx]);
  if(rd.learningShown?.idx!==rd.idx)rd.learningShown={idx:rd.idx,at:Date.now()};
  if(!q){ rd.idx++; if(rd.idx>=rd.fila.length){ finalizar(); return viewFim(); } return viewItem(); }
  const a=rd.atual, pend=rd.pend, alternativas=alternativasDe(q),branco=brancoDe(q),gabaritoTxt=rotuloResposta(q,q.gabarito);
  const bub=(L)=>{
    let cls='bubble'; if((a&&a.marcada===L)||(pend&&pend.marcada===L)) cls+=' picked'; if(a&&q.gabarito===L) cls+=' key';
    return `<button class="${cls}" data-ans="${L}" ${a?'disabled':''} aria-label="${rotuloResposta(q,L)}">${L}</button>`};
  let mid='';
  if(pend){
    mid=`<div class="conf" role="group" aria-label="Confiança"><span class="conf-q">Você marcou ${rotuloResposta(q,pend.marcada)}. Antes de ver o gabarito: qual a sua confiança?</span>
      ${!alternativas.length&&pend.marcada==='E'?`<div class="note"><label for="corr-txt">Como ficaria certo? (opcional) Reescreva a assertiva corrigida antes de ver o gabarito.</label><textarea id="corr-txt" style="min-height:48px" placeholder="Ex.: a competência é privativa, e não exclusiva…">${esc(rd.corr||'')}</textarea></div>`:''}
      <div class="conf-opts">${[1,2,3].map(c=>`<button data-conf="${c}"><span class="mono">${c}</span>${CONF[c]}</button>`).join('')}</div>
      <span class="kbd">teclas 1 · 2 · 3 · Esc troca a resposta</span></div>`;
  }
  if(a&&a.rep){
    const kind=a.marcada===branco?'dub':(a.acertou?'ok':'bad');
    const vt=a.marcada===branco?`Em branco. O gabarito é ${gabaritoTxt}.`:(a.acertou?`Acertou na repescagem. Gabarito: ${gabaritoTxt}.`:`Errou de novo. O gabarito é ${gabaritoTxt}.`);
    mid=`<div class="verdict ${kind}"><span class="vt">${vt}</span><p>${esc(q.comentario)}</p>
      <span class="ref">A repescagem fecha a sessão com uma recuperação correta e não muda a agenda: o item volta na revisão espaçada.</span></div>`;
  } else if(a){
    const r=S.r.get(q.id)||{};
    const kind=a.marcada===branco?'dub':(a.acertou?(a.conf===1?'dub':'ok'):'bad');
    const vt=a.marcada===branco?`Em branco. O gabarito é ${gabaritoTxt}.`:(a.acertou?`Acertou. Gabarito: ${gabaritoTxt}.`:`Errou. O gabarito é ${gabaritoTxt}.`);
    let calib='';
    if(a.marcada!==branco&&!a.acertou&&a.conf===3) calib=`<span class="calib alert">Erro com certeza: confira o trecho que sustentou sua escolha e compare com a regra do comentário.</span>`;
    else if(a.acertou&&a.conf===1) calib=`<span class="calib">Acerto no chute: o item foi para o caderno e só sai com dois acertos seguros.</span>`;
    else if(a.acertou&&a.conf===3) calib=`<span class="calib">Calibrado: certeza e acerto.</span>`;
    if(window.QBLearning&&!alternativas.length) calib=window.QBLearning.feedback(S,q,a)||calib;
    const foiCaderno=(kind!=='ok')?' Este item está no caderno de erros.':'';
    const prox=r.proxRevisao?` Próxima revisão em ${ddmm(r.proxRevisao)}.`:'';
    const precisaOrigem=exigeJust(a);
    const nj=(rd.just||'').trim().length;
    mid=`<div class="verdict ${kind}"><span class="vt">${vt}</span>${calib}${a.corr?`<span class="calib">Sua correção: <span style="font-weight:400;font-family:var(--read)">${esc(a.corr)}</span>${q.gabarito==='E'?' · Confira com o comentário se ela bate com a versão certa.':' · O item era Certo: a sua versão alterava o que já estava correto.'}</span>`:''}<p>${esc(q.comentario)}</p>
      ${temTravas(q)?`<span class="ref">Palavras de alcance destacadas no enunciado: confira se a assertiva generaliza ou restringe demais.</span>`:''}
      ${(()=>{const x=mecDe(q);return x&&MEC[x.m]?`<span class="calib">Mecanismo da banca: ${esc(x.m)} · ${esc(MEC[x.m].n)}.${x.v&&String(q.comentario||'').includes(x.v)?'':x.v?` Vacina: ${esc(x.v)}`:` ${esc(MEC[x.m].v)}`}</span>`:''})()}
      <span class="ref">${q.ref?('Ver '+esc(q.ref)+'.'):''}${esc(foiCaderno+prox)}</span>
      ${atalhosQuestao(q)}
      ${precisaOrigem?chipsOrigem(q.id,r.origem):''}
      ${precisaOrigem?`<div class="just"><label for="just-txt">${a.marcada!==branco&&!a.acertou&&a.conf===3?'Erro com certeza: o que te deu certeza? Escreva o que te levou a marcar e qual é a regra certa, com as suas palavras.':`Justifique para seguir: por que você ${a.marcada===branco?'deixou em branco':(a.acertou?'chutou':'errou')} e qual é a regra certa, com as suas palavras. Se puder, dê um exemplo seu.`}</label>
        <textarea id="just-txt" data-just="${esc(q.id)}" placeholder="Ex.: confundi competência exclusiva com privativa; a exclusiva não pode ser delegada porque…">${esc(rd.just||'')}</textarea>
        <span class="saved" id="just-cnt">${justMsg(nj,r.origem)}</span></div>`:''}</div>`;
  }
  const last=rd.idx===rd.fila.length-1;
  const vaiRep=last&&rd.rep.ini===null&&rd.rep.fila.length>0;
  const tag=(multiCap(rd.cap)||emRep(rd))?`Cap. ${q.cap} · ${q.tema||''}`:(q.tema||'');
  return `${placar(rd)}
  <article class="item" style="margin-top:16px">
    <div class="item-head"><span class="item-num">${emRep(rd)?'REPESCAGEM · ':''}ITEM ${String(q.ordem||'').padStart(2,'0')}</span><span class="tag">${esc(tag)}</span></div>
    ${q.statusEditorial==='aguardando-revisao-humana'?'<p class="qb-rf-pending" role="note"><strong>Questão autoral em revisão editorial.</strong> O gabarito é provisório e não corresponde a um item oficial do CEBRASPE. Use a explicação para estudo e confira a fonte quando necessário.</p>':''}
    ${textoHTML(q)}<div class="statement">${statementHTML(q,!!a)}</div>
    <div class="answers${alternativas.length?' qb-mc-answers':''}">${alternativas.length?alternativas.map(opt=>`<button type="button" class="qb-mc-choice${(a&&a.marcada===opt.letra)||(pend&&pend.marcada===opt.letra)?' picked':''}${a&&q.gabarito===opt.letra?' key':''}" data-ans="${esc(opt.letra)}" aria-label="Alternativa ${esc(opt.letra)}: ${esc(opt.texto)}" ${a?'disabled':''}><strong>${esc(opt.letra)})</strong><span>${esc(opt.texto)}</span></button>`).join(''):bub('C')+bub('E')}
      <button class="blank${a&&a.marcada===branco?' picked':''}" data-ans="${branco}" ${a?'disabled':''}>Deixar em branco</button>
      ${a||pend?'':`<span class="kbd">${alternativas.length?'teclas A · B · C · D · E · 0 para branco':'teclas C · E · B'}</span>`}</div>
    ${mid}
  </article>
  <div class="next-row" style="margin-top:14px">
    <button class="btn ghost small" id="quit">Encerrar rodada</button>
    ${a?`<button class="btn" id="next" ${a.rep||!exigeJust(a)||justOk(rd,q.id)?'':'disabled'}>${vaiRep?`Ir para a repescagem (${rd.rep.fila.length})`:(last?'Ver resultado':'Próximo item')} <span class="kbd" style="color:inherit;opacity:.75">Enter</span></button>`:''}
  </div>`;
}
function viewFim(){
  const rd=S.round, liq=rd.certos-rd.errados, resp=rd.certos+rd.errados+rd.brancos;
  const foram=rd.itens.filter(i=>i.marcada!==i.gabarito||i.conf===1);
  const excesso=rd.itens.filter(i=>i.marcada!==brancoDe(S.q.get(i.qid))&&i.marcada!==i.gabarito&&i.conf===3).length;
  const mix=multiCap(rd.cap);
  const lista=foram.length?`<div class="tbl-wrap"><table><thead><tr><th>Item</th>${mix?'<th>Cap.</th>':''}<th>Tema</th><th>Você marcou</th><th>Gabarito</th><th>Confiança</th></tr></thead><tbody>
    ${foram.map(i=>{const q=S.q.get(i.qid)||{};return `<tr><td class="mono">${String(q.ordem||'').padStart(2,'0')}</td>${mix?`<td class="mono">${esc(q.cap||'')}</td>`:''}<td>${esc(q.tema||'')}</td><td class="${i.marcada===brancoDe(q)?'':(i.marcada===i.gabarito?'pos':'neg')}">${esc(rotuloResposta(q,i.marcada))}</td><td>${esc(rotuloResposta(q,i.gabarito))}</td><td>${i.conf?CONF[i.conf]:'–'}</td></tr>`}).join('')}
    </tbody></table></div>`:`<div class="notice"><strong>Nenhum erro nem chute nesta rodada.</strong></div>`;
  return `<div class="wrap" style="gap:16px;margin-top:8px">
    <h2 class="section-title">Resultado da rodada · ${esc(rd.cap==='PEG'?rd.capNome:mix?'Revisão intercalada':'Capítulo '+rd.cap)}</h2>
    <div class="summary">
      <div class="stat c"><span class="v">${rd.certos}</span><span class="k">certos</span></div>
      <div class="stat e"><span class="v">${rd.errados}</span><span class="k">errados</span></div>
      <div class="stat b"><span class="v">${rd.brancos}</span><span class="k">em branco</span></div>
      <div class="stat"><span class="v ${liq<0?'neg':''}">${liq}</span><span class="k">nota líquida (C − E)</span></div>
    </div>
    <p class="rule">${resp} de ${rd.rep.ini===null?rd.fila.length:rd.rep.ini} itens respondidos. Aproveitamento líquido: ${resp?fmtPct(liq/resp):'–'}.${excesso?` ${excesso} ${excesso===1?'erro':'erros'} com certeza: leia esses comentários de novo e escreva a regra no caderno.`:''} Cada item já tem a próxima revisão marcada na agenda.</p>
    ${rd.rep.res.length?`<p class="rule">Repescagem: ${rd.rep.res.filter(x=>x.ok).length} de ${rd.rep.res.length} certos no fim da rodada. Ela não entra na nota nem muda a agenda.</p>`:''}
    <h2 class="section-title">Foram para o caderno</h2>
    ${lista}
    <div class="row">
      <button class="btn" id="go-caderno">Abrir o caderno de erros</button>
      <button class="btn ghost" id="again">Nova rodada</button>
    </div>
  </div>`;
}

function viewCaderno(){
  const its=cadernoItens();
  if(!its.length) return `<div class="notice" style="margin-top:4px"><strong>Seu caderno está vazio.</strong> Todo item que você errar, deixar em branco ou acertar no chute entra aqui, com o comentário e espaço para anotar por que errou. Ele sai depois de dois acertos seguros seguidos.</div>`;
  /* agrupado como o Edital: prova → matéria → assunto (tópico do edital) → itens (pedido do Lucas, 05/11/2026) */
  const mats=new Map();
  for(const it of its){
    const t=topicoDoCap(it.q.cap);
    const mk=t?t.sigla:'_outros';

      for(const tp of tops){
        const gk='cd:t:'+tp.k;
        html+=`<details class="rv-top" data-grupo="${esc(gk)}" ${S.abertos.has(gk)?'open':''}><summary><div class="t-h"><span class="t-num">${esc(tp.num||'')}</span><span class="t-tit">${esc(tp.tit||'')} <span class="mono" style="font-size:12px;color:var(--muted)">· ${tp.its.length} ${tp.its.length===1?'item':'itens'}</span></span></div></summary>
          <div class="acts">${[...tp.caps].map(c=>{const k=tp.its.filter(x=>x.q.cap===c).length;return `<button class="btn small" data-revisar="${esc(c)}">Revisar ${k} · cap. ${esc(c)}</button>`}).join('')}</div>`;

function estatisticas(){
  let eSendoC=0,cSendoE=0,brancos=0;
  const conf={1:[0,0],2:[0,0],3:[0,0]};
  for(const r of S.r.values()){
    const q=S.q.get(r.qid); if(!q||foraQ(q)||alternativasDe(q).length) continue;
    for(const h of (r.hist||[])){
      if(h.m==='B'){brancos++;continue}
      if(!h.ok){ if(h.m==='E') eSendoC++; else cSendoE++; }
      if(h.c&&conf[h.c]){ conf[h.c][0]++; if(h.ok) conf[h.c][1]++; }
    }
  }
  const origem={}; let semOrigem=0;
  for(const {r} of cadernoItens()){ if(r.motivo==='chute') continue; if(r.origem&&ORIGENS[r.origem]) origem[r.origem]=(origem[r.origem]||0)+1; else semOrigem++; }
  return {eSendoC,cSendoE,brancos,conf,origem,semOrigem};
}
/* período do gráfico: dia, semana (começa na segunda) ou mês */
function bucketEvo(d){
  if(S.evoPer==='s'){const [y,m,dd]=d.split('-').map(Number);const w=(new Date(y,m-1,dd).getDay()+6)%7;return addDias(d,-w)}
  if(S.evoPer==='m') return d.slice(0,8)+'01';
  return d;
}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function lblEvo(d){if(S.evoPer==='m') return MESES[+d.slice(5,7)-1]+'/'+d.slice(2,4); if(S.evoPer==='s') return 'sem. '+ddmm(d); return ddmm(d)}
function nomeMateria(sig){if(sig==='_') return 'Sem tópico do edital';const t=[...S.ed.values()].find(t=>t.sigla===sig);return t?t.materia:sig}
function materiaDoCap(cap){for(const t of S.ed.values()) if((t.caps||[]).includes(cap)) return t.sigla; return ''}
/* Interpolação cúbica suave para as curvas, sem alterar nenhum valor da série. */
function qbCurve(pts){
  if(!pts.length) return '';
  if(pts.length===1) return 'M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  let p='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],prev=pts[Math.max(0,i-2)],next=pts[Math.min(pts.length-1,i+1)];
    const dx=(b[0]-a[0])/3;
    const d1=(b[1]-prev[1])*dx/Math.max(1,b[0]-prev[0]);
    const d2=(next[1]-a[1])*dx/Math.max(1,next[0]-a[0]);
    p+=' C '+(a[0]+dx).toFixed(1)+' '+(a[1]+d1).toFixed(1)+', '+(b[0]-dx).toFixed(1)+' '+(b[1]-d2).toFixed(1)+', '+b[0].toFixed(1)+' '+b[1].toFixed(1);
  }
  return p;
}

function sessoesHistoricas(){
  const materias=new Map(), assuntos=new Map(), comparacao=new Map(), sessoes=[];
  for(const rodada of S.rodadas){
    if(!Number.isFinite(Date.parse(rodada.inicio))) continue;
    const dia=diaDe(rodada.inicio);
    const dentro=(!S.evoDe||dia>=S.evoDe)&&(!S.evoAte||dia<=S.evoAte);
    const contagem={c:0,e:0,b:0,n:0};
    const nomes=new Set();
    for(const item of rodada.itens||[]){
      const questao=S.q.get(item.qid);
      const multiple=alternativasDe(questao).length>0;
      if(multiple?!['A','B','C','D','E','-'].includes(item.marcada):(!['C','E','B'].includes(item.marcada)||!['C','E'].includes(item.gabarito)))continue;
      const cap=questao?.cap||(!multiCap(rodada.cap)?rodada.cap:'')||'';
      const topico=topicoDoCap(cap);
      const materia=topico?.sigla||(questao?materiaDaQuestao(questao):'')||'_';
      const nome=String(questao?.capNome||topico?.titulo||cap||'Sem assunto').split(' · ').at(-1);
      materias.set(materia,nomeMateria(materia));
      if(cap&&!assuntos.has(cap)) assuntos.set(cap,{materia,nome});
      if(!dentro||(S.fEvo&&S.fEvo!==materia)) continue;
      const resultado=item.marcada===brancoDe(questao)?'b':item.marcada===item.gabarito?'c':'e';
      if(cap&&S.evoGrafico==='assuntos'){
        const a=comparacao.get(cap)||{c:0,n:0};
        a.n++;
        if(resultado==='c') a.c++;
        comparacao.set(cap,a);
      }
      if(S.evoCap&&S.evoCap!==cap) continue;
      nomes.add(nome);
      contagem.n++;
      contagem[resultado]++;
    }
    if(contagem.n){
      sessoes.push({rodada,dia,periodo:bucketEvo(dia),nomes:[...nomes],...contagem});
    }
  }
  sessoes.sort((a,b)=>Date.parse(b.rodada.inicio)-Date.parse(a.rodada.inicio));
  return {materias,assuntos,comparacao,sessoes};
}

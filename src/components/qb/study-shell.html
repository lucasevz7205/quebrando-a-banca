function viewHistorico(){
  const cs=caps(), st=estatisticas(), h=hoje();
  // direção dos erros (Rápido e Devagar: qual impulso do Sistema 1 está pesando)
  const tot=st.eSendoC+st.cSendoE;
  let leitura='';
  if(tot>=4){
    if(st.eSendoC>=st.cSendoE*1.5) leitura=`<b>Você tende a desconfiar de itens corretos.</b> ${st.eSendoC} dos ${tot} erros foram marcar Errado num item Certo. Antes de marcar E, aponte a palavra ou o trecho exato que torna a assertiva falsa. Se não encontrar, a assertiva provavelmente está certa.`;
    else if(st.cSendoE>=st.eSendoC*1.5) leitura=`<b>Você tende a aceitar itens errados.</b> ${st.cSendoE} dos ${tot} erros foram marcar Certo num item Errado. A assertiva parece familiar e o Sistema 1 aprova. Procure a palavra que generaliza, restringe ou troca um conceito.`;
    else leitura=`<b>Seus erros se dividem entre os dois lados</b> (${st.eSendoC} marcando E num item C, ${st.cSendoE} marcando C num item E). O problema é mais de conteúdo do que de tendência na leitura.`;
  } else leitura='A leitura da tendência aparece depois de 4 erros registrados.';

  const confRows=[3,2,1].map(c=>{const [n,ok]=st.conf[c];const acc=n?ok/n:NaN;const ev=n?2*acc-1:NaN;
    const ganho=n?((ev>0?'+':ev<0?'−':'')+Math.abs(ev).toFixed(2).replace('.',',')):'–';
    const dec=!n?'–':(n<10?'Poucos dados (menos de 10)':(acc>0.5?'<span class="pos">Marcar</span>':'<span class="neg">Deixar em branco</span>'));
    return `<tr><td>${c} · ${CONF[c]}</td><td class="num">${n}</td><td class="num">${n?fmtPct(acc):'–'}</td><td class="num ${ev<0?'neg':''}">${ganho}</td><td>${dec}</td></tr>`}).join('');
  const temConf=[1,2,3].some(c=>st.conf[c][0]>0);

  const oRows=Object.entries(ORIGENS).map(([k,v])=>`<tr><td>${v.t}</td><td class="num">${st.origem[k]||0}</td></tr>`).join('')+`<tr><td>Sem marcação</td><td class="num">${st.semOrigem}</td></tr>`;

  // agenda dos próximos 14 dias (vencidas somadas a hoje)
  const dias=[...Array(14)].map((_,i)=>addDias(h,i)), cnt=dias.map(()=>0);
  for(const r of S.r.values()){ if(!S.q.has(r.qid)) continue; const p=proxDe(r); if(!p) continue; const i=p<=h?0:difDias(h,p); if(i>=0&&i<14) cnt[i]++; }
  const mx=Math.max(1,...cnt);
  const sem=['dom','seg','ter','qua','qui','sex','sáb'];
  const agenda=dias.map((d,i)=>{const [y,m,dd]=d.split('-').map(Number);const w=sem[new Date(y,m-1,dd).getDay()];
    return `<div class="day${i===0?' today':''}"><span class="n">${cnt[i]||''}</span><span class="col"><i style="height:${cnt[i]/mx*100}%"></i></span><span class="d">${i===0?'hoje':w}<br>${ddmm(d)}</span></div>`}).join('');

  /* ÚNICA fonte do percentual do histórico e do radial de Treinar.
   * Acerto consolidado: quem já errou ou marcou branco não é recontado
   * como acerto por uma tentativa posterior; SIM/foraNivel são excluídos.
   * A evolução por tentativa permanece uma métrica separada.
   */
  const ledger=treinoRadialDados(),gm=new Map();
  for(const mat of ledger.matters){
    const chapters=cs.filter(c=>!foraCalc(c.cap)&&
      ((topicoDoCap(c.cap)?.sigla||'_outros')===mat.id));
    const rows=chapters.map(c=>{
      const x=window.QBTrainingRadial.summary(questoesDoCap(c.cap).map(q=>q.id),S.q,S.r);
      return {...c,total:x.total,resp:x.respondidas,okUlt:x.acertos};
    }).filter(c=>c.total);

/* retenção: acerto (sem chute) em revisão feita RETENCAO+ dias após o primeiro contato */
const RETENCAO=7;
function retido(r){
  if(!r||!r.tentativas) return false; if(r.retidoEm) return true;
  const h=r.hist||[]; const p=r.primeiraEm||(h[0]&&h[0].em); if(!p) return false;
  return h.some(x=>x.ok&&x.c!==1&&x.em&&difDias(diaDe(p),diaDe(x.em))>=RETENCAO);
}
function statsTopico(t){
  const caps=new Set(t.caps||[]), h=hoje();
  const o={total:0,resp:0,ok:0,okN:0,cad:0,hoje:0,ret:0};
  if(!caps.size) return o;
  for(const q of S.q.values()){
    if(!caps.has(q.cap)||q.foraNivel) continue;
    o.total++;
    const r=S.r.get(q.id);
    if(r&&r.tentativas){ o.resp++; if(r.ultimaMarcada===q.gabarito) o.ok++; if(r.ultimaMarcada===q.gabarito&&!jaErrou(r)) o.okN++; if(r.noCaderno) o.cad++; if(retido(r)) o.ret++; const p=proxDe(r); if(p&&p<=h) o.hoje++; }
  }
  return o;
}
const RANK={nao:0,estudo:1,revisao:2,dominado:3};
function statusControle(t,s){
  const estudo=matsDe(t.id).some(m=>m.tipo==='mapa'||m.tipo==='material'||m.tipo==='cobertura')||((S.pt.get(t.id)||{}).itens||[]).length>0||((S.rv.get(t.id)||{}).itens||[]).length>0;
  if(!s.total) return estudo?'estudo':'nao';
  if(s.resp/s.total<0.8) return 'estudo';

}
/* Tutory (Meu Desempenho): estudo ou resumo = em estudo; revisão e exercício já iniciados = revisando. Nunca "dominado". */
function statusTutory(t){

/* sua memória por intervalo: acerto ao reencontrar um item, conforme os dias desde a resposta anterior (dados reais do histórico) */
function memoria(){
  const B=[[1,1,'1 d'],[2,3,'2–3 d'],[4,7,'4–7 d'],[8,15,'8–15 d'],[16,999,'16+ d']], acc=B.map(()=>[0,0]);
  for(const r of S.r.values()){ if(foraQid(r.qid)) continue; const hs=(r.hist||[]).filter(x=>x.em&&x.m!=='B'||x.em).slice().sort((a,b)=>String(a.em).localeCompare(String(b.em)));
    for(let i=1;i<hs.length;i++){const g=difDias(diaDe(hs[i-1].em),diaDe(hs[i].em)); if(g<1) continue; const k=B.findIndex(b=>g>=b[0]&&g<=b[1]); if(k<0) continue; acc[k][0]++; if(hs[i].ok) acc[k][1]++;}}
  const W=360,H=180,L=34,Rr=16,T=24,Bt=28, x=i=>L+i*(W-L-Rr)/(B.length-1), y=v=>T+(1-v)*(H-T-Bt);
  const pts=acc.map((a,i)=>a[0]>=5?[x(i),y(a[1]/a[0]),a]:null);
  const path=qbCurve(pts.filter(Boolean).map(p=>[p[0],p[1]]));
  const grid=[0.5,0.75,0.9,1].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0.9?'stroke-dasharray="4 3" stroke="var(--certo)"':''}/><text class="vx" x="${L-4}" y="${y(v)+3}" text-anchor="end">${v*100}%</text>`).join('');
  const n=acc.reduce((s,a)=>s+a[0],0);
  if(n<10) return `<section class="card-v"><h2 class="section-title">Sua memória por intervalo</h2><p class="rule">Ainda há poucas revisões registradas para desenhar a curva.</p></section>`;
  return `<section class="card-v" aria-label="Sua memória por intervalo"><h2 class="section-title">Sua memória por intervalo</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Acerto ao rever um item, por dias desde a resposta anterior">${grid}
    <path d="${path}" fill="none" stroke="var(--pen)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--pen)" stroke="var(--surface)" stroke-width="2"><title>${B[i][2]}: ${Math.round(p[2][1]/p[2][0]*100)}% (${p[2][1]} de ${p[2][0]})</title></circle><text class="vl" x="${p[0]}" y="${p[1]-9}" text-anchor="middle">${Math.round(p[2][1]/p[2][0]*100)}%</text>`:'').join('')}
    ${B.map((b,i)=>`<text class="vx" x="${x(i)}" y="${H-10}" text-anchor="middle">${b[2]}</text>`).join('')}</svg>
    <p class="rule">Quanto você acerta ao reencontrar um item, pelos dias desde a resposta anterior (${n} reencontros; pontos com menos de 5 ficam de fora). A linha tracejada é a meta de 90%. Se a curva cai muito nos intervalos longos, o espaçamento está largo demais para você.</p></section>`;
}
/* revisões até a prova: uma faixa por matéria, bolinhas nas datas agendadas, bandeira na prova (HTML, para o texto não escalar) */
function linhaProva(){
  if(!PROVA)return '';

  for(const r of S.r.values()){ const q=S.q.get(r.qid); if(!q||foraQ(q)) continue; const p=proxDe(r); if(!p) continue; const d=p<h?h:p; const sig=materiaDoCap(q.cap); if(!sig) continue;
    if(!m.has(sig)) m.set(sig,new Map()); const g=m.get(sig); g.set(d,(g.get(d)||0)+1); }
  if(!m.size) return '';
  const rows=[...m.entries()].sort((a,b)=>nomeMateria(a[0]).localeCompare(nomeMateria(b[0])));

/* revisão ativa (regra do Lucas, 05/11/2026): escrever a resposta, virar o cartão, comparar e só então marcar Lembrei, Parcial ou Não lembrei */
/* repetição espaçada dos cartões no estilo Anki (pedido do Lucas, 06/11/2026): Novamente, Difícil, Bom e Fácil.
   SM-2 com facilidade inicial 2,5 (mínimo 1,3), teto de 20% dos dias até a prova e revisão diária a partir de 10/01/2027.
   Marcações antigas (Lembrei, Parcial, Não lembrei) continuam valendo: Lembrei = Bom, Parcial = Difícil, Não lembrei = Novamente. */
const AVAL={n:'Novamente',d:'Difícil',b:'Bom',f:'Fácil'};
const AVAL_ANT={s:'b',p:'d'};
const avNorm=v=>AVAL_ANT[v]||v;
const avLbl=v=>({s:'Lembrei',p:'Parcial'})[v]||AVAL[v]||v;
const avCls=v=>({n:'e',d:'b',b:'c',f:'p'})[avNorm(v)]||'p';
const FIRME=7;
/* espaçamento dos cartões igual ao das questões (escada INT = 1, 3, 7, 15, 30 dias) (pedido do Lucas, 07/11/2026):
   Novamente volta ao início (1 dia); Difícil repete o degrau; Bom sobe um degrau; Fácil sobe dois. Continua com o teto de 20% dos dias até a prova. */
function cartNivel(a){ if(!a) return 0; if(typeof a.nivel==='number') return a.nivel; const i=a.intervalo||0; let n=0; INT.forEach((x,j)=>{if(x<=i) n=j}); return n }
function srsCalc(prev,v,d){
  d=d||hoje();
  const nv=cartNivel(prev); let nn;
  if(v==='n') nn=0;
  else if(v==='d') nn=nv;
  else if(v==='b') nn=Math.min(INT.length-1,nv+1);
  else nn=Math.min(INT.length-1,nv+2);
  let n=INT[nn]; const fac=prev&&typeof prev.facil==='number'?prev.facil:2.5;
  let prox;
  if(LIMITE&&d>=LIMITE){ n=1; prox=addDias(d,1); }
  else { n=Math.min(n,teto(d)); prox=addDias(d,n); if(LIMITE&&prox>LIMITE){prox=LIMITE;n=difDias(d,LIMITE);} }
  return {facil:fac,intervalo:n,prox,nivel:nn};
}
function srsFmt(n){return n<=1?'1 dia':n<30?n+' dias':Math.round(n/30)+' mês'}
/* novos por dia: 50 cartões nunca vistos (07/11/2026); revisões de cartões por dia: 50, por prioridade */
const NOVOS_DIA=50, CART_REV_DIA=50;
function cartRevHoje(){let n=0;const h=hoje();for(const a of (S.cav||new Map()).values()){for(const x of (a.hist||[])) if(x.rev&&diaDe(x.em)===h) n++}return n}
const cartNovo=a=>!a||!(a.hist||[]).length;
function novosHoje(){let n=0;const h=hoje();for(const a of (S.cav||new Map()).values()){const x=(a.hist||[])[0];if(x&&diaDe(x.em)===h)n++}return n}
/* vencido: data passou, avaliado antes do sistema novo (sem data), ou marcado "Novamente" nesta sessão */
function cartVence(k){const a=(S.cav||new Map()).get(k); if(S.cartDeNovo&&S.cartDeNovo.has(k)) return true; if(cartNovo(a)) return false; if(!a.prox) return true; return a.prox<=hoje()}
function cartFirme(a){return !!a&&a.prox&&(a.intervalo||0)>=FIRME&&(avNorm(a.ult)==='b'||avNorm(a.ult)==='f')}
function cartStats(id){const rv=S.rv.get(id), cav=S.cav||new Map(), o={tot:0,hoje:0,novos:0,firmes:0};
  ((rv&&rv.cartoes)||[]).forEach((c,i)=>{const k=id+'@'+i,a=cav.get(k);o.tot++; if(cartNovo(a)) o.novos++; else if(cartVence(k)) o.hoje++; if(cartFirme(a)) o.firmes++;});

S.cartDeNovo=new Set();
/* sessão intercalada (pedido do Lucas, 06/11/2026, a partir de Fixe o Conhecimento: o rebatedor treinado com arremessos
   aleatórios rende mais). Todos os tópicos misturados, um cartão por vez, sem dois seguidos do mesmo tópico quando possível.
   Intercalar ajuda a distinguir conceitos parecidos (Rohrer e Taylor, 2007). */
function filaMix(){
  const porTop=new Map(), cav=S.cav||new Map(),qIdx=indiceQuestoes();

  let vagas=Math.max(0,NOVOS_DIA-novosHoje());

  const due=[];
  const ids=[...S.rv.entries()].filter(([k,v])=>v&&(v.cartoes||[]).length).map(([k])=>k).sort((a,b)=>((S.ed.get(a)||{}).ordem||0)-((S.ed.get(b)||{}).ordem||0));
  const novos=new Map();
  for(const id of ids){ (S.rv.get(id).cartoes||[]).forEach((c,i)=>{const k=id+'@'+i,a=cav.get(k);
    if(cartVence(k)){ due.push({k,id,pr:(S.cartDeNovo&&S.cartDeNovo.has(k)?-1:cartNivel(a)),p:(a&&a.prox)||'0000'}); }

function mecDe(q){if(!q) return null; if(q.mecanismo) return {m:q.mecanismo,v:q.vacina||'',e:q.evidencia||''}; return S.mecQ.get(q.id)||null}

/* Estratégia histórica como metáfora pedagógica, nunca como citação direta. */
function estrategiaMec(code){return window.QBStrategy?.[code]||null}
function maximaMec(code){return estrategiaMec(code)?.maxima||MEC_MEMORIA[code]?.lema||''}
function mecanStats(code,ids){
  const out={total:ids.length,respondidos:0,acertos:0,erros:0,confErros:0,caderno:0,errosHistoricos:0,reincidentes:0};
  for(const id of ids){
    const r=S.r.get(id),q=S.q.get(id);
    if(!r||!q||!Number(r.tentativas))continue;
    const historico=(r.hist||[]).filter(h=>(h.m==='C'||h.m==='E')&&typeof h.ok==='boolean');
    const anteriores=historico.filter(h=>h.ok===false).length;
    out.errosHistoricos+=anteriores;
    if(anteriores>=2)out.reincidentes++;
    const marca=r.ultimaMarcada;
    if(marca!=='C'&&marca!=='E')continue;
    out.respondidos++;
    const bom=marca===q.gabarito;
    if(bom)out.acertos++;
    else{
      out.erros++;
      const h=(r.hist||[]).filter(h=>h.m==='C'||h.m==='E').at(-1);
      if((h?Number(h.c):Number(r.conf))===3)out.confErros++;
    }
    if(r.noCaderno)out.caderno++;
  }
  return out;
}
function trapSubject(code){
  return S.studyAccount ? nomeMateria(code) : (SIG_MAT[code]||code);
}
function trapScore(acertos,erros){
  return `<span class="qb-trap-score"><span class="qb-trap-score-correct"><strong>${acertos}</strong> Acertos</span><span class="qb-trap-score-wrong"><strong>${erros}</strong> Erros</span></span>`;
}

function treinarPg(id){
  let ps=[...S.pg.values()].filter(p=>(!S.fPgTipo||p.tipo===S.fPgTipo));
  if(id==='*') ps=ps.filter(p=>{const t=S.ed.get(p.topico);return !S.fPgMat||(t&&t.sigla===S.fPgMat)});
  else ps=ps.filter(p=>p.topico===id);
  const fila=qidsPg(ps); if(!fila.length) return;
  if(id==='*'||S.shuffle){ for(let i=fila.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fila[i],fila[j]]=[fila[j],fila[i]]} }
  const t=S.ed.get(id);
  setView('treinar');
  novaRodada('PEG',t?`Pegadinhas · ${lblT(t)} ${t.titulo}`:'Pegadinhas intercaladas','pegadinhas',fila);
}

  return `<div class="wrap" style="gap:14px">

function viewMetodo(){
  return `<div class="wrap metodo">
    <p class="rule">Resumo do documento Metodo_de_Estudo.md do projeto. É o mesmo método que o Claude aplica nos chats de cada matéria.</p>
    <h2 class="section-title">Como usar este caderno</h2>
    <ol>
      <li><b>Comece pela revisão de hoje.</b> Ela mistura capítulos de propósito: escolher qual regra se aplica faz parte do treino. <span class="src">Fixe o Conhecimento · intercalação</span></li>
      <li><b>Marque a confiança antes do gabarito.</b> Errar com certeza é o sinal mais importante do caderno. <span class="src">Fixe o Conhecimento · calibração</span></li>
      <li><b>Depois do erro, marque de onde ele veio.</b> Cada origem pede um remédio diferente.</li>
      <li><b>Justifique todo erro antes de seguir.</b> Errou, deixou em branco ou chutou: o Caderno só libera o próximo item depois que você marca de onde veio o erro e escreve, com as suas palavras, por que errou e qual é a regra certa. A justificativa fica guardada no caderno de erros. <span class="src">Geração e elaboração · Fixe o Conhecimento</span></li>
      <li><b>Escreva a regra com as suas palavras.</b> Copiar o comentário não conta; explicar e dar um exemplo próprio, sim. <span class="src">Você Sabe Estudar? · estudo ativo</span></li>
      <li><b>Não releia o PDF para revisar.</b> Reler e grifar dão a sensação de domínio sem fixar. Volte às questões. <span class="src">Otimize seu Aprendizado</span></li>
      <li><b>Treine as pegadinhas de memória.</b> Na aba Pegadinhas, com "Evocar antes de ler", explique por que a armadilha engana antes de abrir a regra, e depois responda o item ligado. Distinguir regras parecidas lado a lado é o remédio para os erros de interferência. <span class="src">Fixe o Conhecimento · intercalação e discriminação</span></li>
      <li><b>Leia devagar o que parece óbvio.</b> As palavras de alcance aparecem destacadas depois da resposta para treinar o olho. <span class="src">Rápido e Devagar · Sistema 2</span></li>
      <li><b>Itens Errados: corrija antes do gabarito.</b> Ao marcar E, reescreva a assertiva certa no campo opcional. Corrigir a afirmação falsa melhora a retenção quando há feedback depois. <span class="src">Uner, Tekin e Roediger, 2022</span></li>
      <li><b>Certeza só quando souber dizer por quê.</b> A aba Hoje mostra o seu acerto com certeza nos últimos 14 dias; a meta é 90% ou mais. <span class="src">Fixe o Conhecimento · calibração</span></li>
      <li><b>Videoaulas: pausa de evocação.</b> A cada bloco de 15 a 20 minutos, pare e responda de memória 3 a 5 perguntas sobre o que acabou de ver. Isso reduziu a divagação de cerca de 40% para 19% e elevou o teste final de 68% para 90%. <span class="src">Szpunar, Khan e Schacter, 2013</span></li>
      <li><b>Celular em outro cômodo.</b> A simples presença do celular sobre a mesa reduziu a capacidade cognitiva disponível. <span class="src">Ward et al., 2017 · Otimize seu Aprendizado</span></li>
      <li><b>Próximo passo no formato "quando/onde → farei".</b> Ex.: "amanhã, às 7h, na mesa: revisão de hoje e DC 1.4". Intenções de implementação aumentam a chance de cumprir o plano. <span class="src">Gollwitzer e Sheeran, 2006</span></li>
      <li><b>No simulado, reconsidere e troque quando tiver motivo.</b> Trocas costumam ir mais de errado para certo do que o contrário; o resultado mostra o seu saldo. <span class="src">Kruger, Wirtz e Miller, 2005</span></li>
      <li><b>Na prova, marque só acima de 50%.</b> Com +1, −1 e 0, o ganho esperado é 2 × acerto − 1. A aba Desempenho mostra o seu acerto real em cada nível de confiança. <span class="src">Critério do edital</span></li>
    </ol>
    <h2 class="section-title">Status dos tópicos</h2>
    <ul>
      <li>Vale o maior entre o Controle e o Tutory. Em estudo: há material, mapa, questões ou estudo/resumo marcado no Tutory. Revisando: 80% das questões feitas, ou revisão e exercício iniciados no Tutory.</li>
      <li>Dominado, só pelo Controle: 80% das questões feitas, 85% de acerto na última resposta, nada no caderno de erros e cada questão acertada (sem chute) numa revisão feita 7 dias ou mais depois do primeiro contato.</li>
      <li>Você pode fixar o status à mão em Edital → Detalhes.</li>

    <ul>
      <li>Erro, branco ou chute: o item volta amanhã e fica no caderno.</li>

      <li>Acerto com certeza: volta em 7 dias no mínimo, depois 15 e 30.</li>
      <li>Acerto com dúvida: volta em 3 dias no mínimo.</li>

      <li>Nenhum intervalo passa de 20% dos dias que faltam para a prova. Quanto mais perto da prova, mais curtos ficam.</li>
      <li>Saída do caderno: dois acertos seguidos sem chute, em dias diferentes. O item continua na agenda.</li>
      <li>A partir de 10/01/2027, tudo que estiver na agenda vira revisão diária até a prova.</li>
      <li>Cartões de revisão ativa (07/11/2026): depois de responder e virar, marque Novamente (volta no fim da sessão e amanhã), Difícil, Bom ou Fácil. O espaçamento segue a mesma escada das questões (1, 3, 7, 15 e 30 dias, com o teto de 20% dos dias até a prova): Bom sobe um degrau, Fácil sobe dois, Difícil repete o degrau e Novamente volta ao início. Por dia: até 50 revisões de cartões, priorizando os Novamente e os mais atrasados, e até 50 cartões novos. As questões também passam a 50 revisões por dia. Os cartões que excederem o limite ficam para o dia seguinte.</li>
    </ul>
    <h2 class="section-title">O que a pesquisa mostra</h2>
    <ul>
      <li><b>Testar fixa mais que reler.</b> Uma semana depois, 56% de recordação para quem fez teste contra 42% para quem releu. Cinco minutos depois, reler parecia melhor (81% contra 75%). <span class="src">Roediger e Karpicke, 2006</span></li>
      <li><b>O feedback quase dobra o efeito.</b> Testes com correção: g = 0,73; sem correção: g = 0,39. Por isso todo item tem comentário. <span class="src">Rowland, 2014 · meta-análise</span></li>
      <li><b>Erro com certeza é o que mais se corrige</b> depois de ver o gabarito, porque a surpresa prende a atenção. <span class="src">Butterfield e Metcalfe, 2001</span></li>
      <li><b>O melhor intervalo encolhe com a proximidade da prova.</b> Com 70 dias até a prova, cerca de 12; com 35 dias, cerca de 8. Errar para mais custa menos que errar para menos. <span class="src">Cepeda et al., 2008</span></li>
      <li><b>Acertar em várias sessões vale mais que repetir na mesma.</b> 68% contra 26% de retenção depois de uma semana. <span class="src">Rawson et al., 2018</span></li>
      <li><b>Misturar ajuda a distinguir o que se parece.</b> Uma semana depois, 63% contra 20%, embora a prática misturada pareça pior na hora. O efeito vale para conceitos parecidos, não para texto novo. <span class="src">Rohrer e Taylor, 2007 · Brunmair e Richter, 2019</span></li>
      <li><b>Mapa mental só ajuda se for feito de memória.</b> Mapas montados de memória rendem como escrever de memória, e mais do que estudar com o texto aberto. <span class="src">Blunt e Karpicke, 2014</span></li>
      <li><b>A sensação de "já sei" engana.</b> Quem releu quatro vezes previa lembrar mais e lembrou menos (40% contra 61%). <span class="src">Roediger e Karpicke, 2006</span></li>
    </ul>

function novaRodada(cap,capNome,modo,fila){
  S.round={id:'r-'+crypto.randomUUID(),cap,capNome,modo,fila,idx:0,atual:null,pend:null,itens:[],certos:0,errados:0,brancos:0,inicio:new Date().toISOString(),fim:null,rep:{fila:[],ini:null,res:[]}};
  render(true); window.scrollTo({top:0});
}
function startRound(cap,modo){
  let fila=filaPara(cap,modo);
  if(!fila.length) return;
  if(S.shuffle){ for(let i=fila.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fila[i],fila[j]]=[fila[j],fila[i]]} }
  novaRodada(cap,capNome(cap),modo,fila);
}
function startRevisao(){
  const {fila}=devidas(); if(!fila.length) return;
  if(S.view!=='treinar') setView('treinar');
  novaRodada('MIX','Revisão intercalada','revisao',fila);
}
function marcar(L){
  const rd=S.round; if(!rd||rd.atual||rd.fim) return;
  if(emRep(rd)){ registrarRep(L); return; }
  const q=S.q.get(rd.fila[rd.idx]),blank=brancoDe(q);
  if(L===blank){registrar(blank,null);return;}
  if(alternativasDe(q).length&&!alternativasDe(q).some(opt=>opt.letra===L))return;
  rd.pend={marcada:L,focus:true};
  render(true);
}
function confirmar(c){
  const rd=S.round; if(!rd||!rd.pend||rd.atual) return;
  registrar(rd.pend.marcada,c);
}
function registrar(L,conf){
  const rd=S.round; if(!rd||rd.atual||rd.fim) return;
  const q=S.q.get(rd.fila[rd.idx]); if(!q) return;
  const acertou=L===q.gabarito,blank=brancoDe(q),isBlank=L===blank,choice=alternativasDe(q).length>0;
  const corr=(!choice&&L==='E'&&rd.corr||'').trim(); rd.corr='';
  rd.pend=null; rd.just='';
  rd.atual={marcada:L,acertou,conf,corr};
  if(isBlank) rd.brancos++; else if(acertou) rd.certos++; else rd.errados++;
  const learning=!choice?window.QBLearning?.metadata(S,q,L,conf,rd):null;
  if(learning) rd.atual.pilotFeedback=learning.feedback;
  rd.itens.push(Object.assign({qid:q.id,ordem:q.ordem||0,marcada:L,gabarito:q.gabarito,conf:conf||null},corr?{corr}:{},learning?{learning}:{}));
  if((isBlank||!acertou||conf===1)&&!rd.rep.fila.includes(q.id)) rd.rep.fila.push(q.id);
  // estado do item
  const prev=S.r.get(q.id)||{};
  const now=new Date().toISOString(), d=hoje();
  const r=Object.assign({},prev,{qid:q.id,cap:q.cap,ordem:q.ordem||0,ultimaMarcada:L,atualizadoEm:now,
    tentativas:(prev.tentativas||0)+1,conf:conf||null});
  const hist=Array.isArray(prev.hist)?prev.hist.slice(-7):[];
  hist.push({m:L,ok:acertou,em:now,c:conf||null}); r.hist=hist;
  r.primeiraEm=prev.primeiraEm||(Array.isArray(prev.hist)&&prev.hist[0]&&prev.hist[0].em)||now;
  if(acertou&&conf!==1&&!prev.retidoEm&&difDias(diaDe(r.primeiraEm),d)>=RETENCAO) r.retidoEm=now;
  const nPrev=prev.tentativas?nivelDe(prev):0;
  if(acertou&&conf===1){
    // acerto no chute não conta como domínio
    r.acertos=(prev.acertos||0)+1;
    if(!prev.noCaderno){ r.noCaderno=true; r.entrouEm=now; r.motivo='chute'; r.acertosSeguidos=0; }
    r.nivel=0;
  } else if(acertou){
    r.acertos=(prev.acertos||0)+1; r.acertosSeguidos=(prev.acertosSeguidos||0)+1;
    if(prev.noCaderno && r.acertosSeguidos>=2){ r.noCaderno=false; r.saiuEm=now; r.motivoSaida='dois acertos seguidos'; }
    // certeza: pelo menos 7 dias; dúvida: pelo menos 3. Enquanto o item estiver no caderno, volta em 3 dias.
    r.nivel=conf===3?Math.min(Math.max(nPrev+1,2),INT.length-1):Math.max(nPrev,1);
    if(r.noCaderno) r.nivel=Math.min(r.nivel,1);
  } else {
    if(isBlank) r.brancos=(prev.brancos||0)+1; else r.erros=(prev.erros||0)+1;
    r.acertosSeguidos=0;
    if(!prev.noCaderno){ r.entrouEm=now; }
    r.noCaderno=true; r.motivo=(isBlank&&!(prev.noCaderno&&prev.motivo==='erro'))?'branco':'erro';
    r.nivel=0;
  }
  r.proxRevisao=agendar(d,r.nivel);
  r.calib=isBlank||!conf?null:(!acertou&&conf===3?'excesso':(acertou&&conf===1?'sub':'ok'));
  if(typeof r.nota!=='string') r.nota='';
  if(corr) r.correcoes=(Array.isArray(prev.correcoes)?prev.correcoes:[]).concat([{em:now,texto:corr}]).slice(-5);
  S.r.set(q.id,r);
  const rdoc=rodadaDoc(rd);
  enqueue(()=>S.db.doc('respostas/'+q.id).set(r));
  enqueue(()=>S.db.doc('rodadas/'+rd.id).set(rdoc));
  window.QBLearning?.recordPrimary(learning);
  render(true);
}

  ${hist.length?`<div class="tbl-wrap"><table class="narrow"><thead><tr><th>Data</th><th>Tipo</th><th class="num">P1</th><th class="num">P2</th><th class="num">Total</th></tr></thead><tbody>${hist.map(h=>`<tr><td class="mono">${esc(h.data)}</td><td>${h.tipo==='obj'?'Objetiva':'Discursiva'}</td><td class="num">${h.tipo==='obj'?h.p1:'–'}</td><td class="num">${h.tipo==='obj'?h.p2:'–'}</td><td class="num">${h.tipo==='obj'?h.p1+h.p2:(h.nota??'–')+' / 60'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="notice">Nenhum simulado registrado ainda.</div>`}
  </div>`;
}
function viewSimObj(so){
  const rest=so.inicio+so.min*6e4-Date.now(), i=so.pos||0, it=so.itens[i], q=S.q.get(it.qid)||{};
  const resp=so.itens.filter(x=>x.marcada).length;
  return `<div class="wrap"><div class="scorebar"><span class="score"><span class="n" id="sim-relogio">${simFmt(rest)}</span><span>${resp}/${so.itens.length} marcadas</span></span><span class="progress">${it.prova} · item ${i+1} de ${so.itens.length}</span></div>
  <div class="item"><div class="item-head"><span class="item-num">ITEM ${i+1}</span><span class="tag">${esc(it.prova)} · ${esc(it.mat.toUpperCase())}</span></div>
  ${textoHTML(q)}<div class="statement">${q.enunciado?statementHTML(q,false):'(item indisponível)'}</div>
  <div class="answers">${['C','E'].map(l=>`<button class="bubble${it.marcada===l?' picked':''}" data-sim-m="${l}">${l}</button>`).join('')}<button class="blank${it.marcada==='B'?' picked':''}" data-sim-m="B">Deixar em branco</button></div>
  ${(it.marcada==='C'||it.marcada==='E')?`<div class="conf"><span class="conf-q">Qual a sua confiança?</span><div class="conf-opts">${[[1,'Chute'],[2,'Dúvida'],[3,'Certeza']].map(([v,t])=>`<button data-sim-conf="${v}" style="${it.conf===v?'border-color:var(--pen);font-weight:700':''}"><span class="mono">${v}</span>${t}</button>`).join('')}</div><span class="ref">Sem correção agora: o gabarito só aparece ao entregar a prova.</span></div>`:''}
  <div class="next-row"><button class="btn ghost small" data-sim-ir="${i-1}" ${i?'':'disabled'}>← Anterior</button><button class="btn small" data-sim-ir="${i+1}" ${i<so.itens.length-1?'':'disabled'}>Próximo →</button></div></div>
  <details class="why"><summary>Folha de respostas</summary><div class="chips" style="margin-top:8px">${so.itens.map((x,k)=>`<button class="chip" aria-pressed="${k===i}" data-sim-ir="${k}" style="min-width:44px">${k+1}${x.marcada?' '+x.marcada+(x.conf?'·'+x.conf:''):''}</button>`).join('')}</div></details>
  <div class="row"><button class="btn" id="sim-entregar">Entregar prova</button><button class="btn ghost small" id="sim-cancelar">Cancelar simulado</button></div></div>`;
}
function simPontos(so){const p={P1:0,P2:0},mat=new Map();for(const it of so.itens){const q=S.q.get(it.qid);if(!q)continue;const v=!it.marcada||it.marcada==='B'?0:(it.marcada===q.gabarito?1:-1);p[it.prova]+=v;const k=it.prova+'|'+it.mat,o=mat.get(k)||{c:0,e:0,b:0,n:0};o.n++;if(v>0)o.c++;else if(v<0)o.e++;else o.b++;mat.set(k,o)}return {p,mat}}
function viewSimObjRes(so){
  const {p,mat}=simPontos(so),bp=simBlueprint();
  const erros=so.itens.filter(it=>{const q=S.q.get(it.qid);return q&&it.marcada&&it.marcada!=='B'&&it.marcada!==q.gabarito});
  return `<div class="wrap"><h2 class="section-title">Resultado da objetiva · ${esc(so.data)}</h2>
  <div class="summary"><div class="stat"><span class="v">${p.P1}</span><span class="k">P1 (corte 18)</span></div><div class="stat"><span class="v">${p.P2}</span><span class="k">P2 (corte 27)</span></div><div class="stat ${p.P1+p.P2>=45?'c':'e'}"><span class="v">${p.P1+p.P2}</span><span class="k">Total líquido</span></div><div class="stat"><span class="v">${simFmt(so.fimEm-so.inicio)}</span><span class="k">Tempo usado</span></div></div>
  <p class="insight">${p.P1>=18&&p.P2>=27?'<b>Acima dos dois cortes.</b>':'<b>Abaixo de pelo menos um corte.</b>'} O corte do edital elimina quem fica abaixo de 18 na P1 ou de 27 na P2.</p>
  <div class="tbl-wrap"><table class="narrow"><thead><tr><th>Matéria</th><th class="num">C</th><th class="num">E</th><th class="num">Br</th><th class="num">Líquido</th></tr></thead><tbody>${[...mat].map(([k,o])=>`<tr><td>${esc(k.replace('|',' · ').toUpperCase())}</td><td class="num pos">${o.c}</td><td class="num neg">${o.e}</td><td class="num">${o.b}</td><td class="num">${o.c-o.e}</td></tr>`).join('')}</tbody></table></div>
  <h2 class="section-title">Acerto por confiança</h2>
  <div class="tbl-wrap"><table class="narrow"><thead><tr><th>Confiança</th><th class="num">Itens</th><th class="num">Acerto</th><th class="num">Líquido</th></tr></thead><tbody>${[[1,'Chute'],[2,'Dúvida'],[3,'Certeza'],[0,'Sem confiança']].map(([v,t])=>{const xs=so.itens.filter(x=>(x.marcada==='C'||x.marcada==='E')&&(x.conf||0)===v);if(!xs.length)return '';const c=xs.filter(x=>{const q=S.q.get(x.qid);return q&&q.gabarito===x.marcada}).length;return `<tr><td>${t}</td><td class="num">${xs.length}</td><td class="num">${fmtPct(c/xs.length)}</td><td class="num ${2*c-xs.length<0?'neg':'pos'}">${2*c-xs.length}</td></tr>`}).join('')}</tbody></table></div>
  <p class="rule">Se o acerto no chute ficar abaixo de 50%, o líquido é negativo: nesses casos, vale deixar em branco na prova.</p>
  ${(()=>{const tr=so.itens.filter(x=>x.prim&&x.prim!==(x.marcada||'B'));if(!tr.length)return `<p class="rule">Trocas de resposta: nenhuma neste simulado. Trocar após reconsiderar costuma ajudar: em Kruger, Wirtz e Miller (2005), 51% das trocas foram de errado para certo e 25% de certo para errado.</p>`;let ec=0,ce=0,ee=0;for(const x of tr){const q=S.q.get(x.qid);if(!q)continue;const a=x.prim===q.gabarito,b=(x.marcada||'B')===q.gabarito;if(!a&&b)ec++;else if(a&&!b)ce++;else ee++}return `<h2 class="section-title">Trocas de resposta (${tr.length})</h2><div class="summary"><div class="stat c"><span class="v">${ec}</span><span class="k">errado → certo</span></div><div class="stat e"><span class="v">${ce}</span><span class="k">certo → errado</span></div><div class="stat"><span class="v">${ee}</span><span class="k">sem efeito</span></div><div class="stat"><span class="v">${ec-ce>=0?'+':''}${ec-ce}</span><span class="k">saldo das trocas</span></div></div><p class="rule">Estudo de referência: 51% das trocas foram de errado para certo e 25% de certo para errado (Kruger, Wirtz e Miller, 2005). O que vale é o seu saldo: acompanhe aqui a cada simulado.</p>`})()}
  <h2 class="section-title">Itens errados (${erros.length})</h2>
  <p class="rule">Classifique cada erro: o padrão dos erros diz o que treinar na semana (Willingham, dica 56). ${(()=>{const c={};for(const x of erros)if(x.origem)c[x.origem]=(c[x.origem]||0)+1;const k=Object.keys(c);return k.length?'Até agora: '+k.map(o=>ORIGENS[o].t+' '+c[o]).join(' · ')+'.':''})()}</p>
  ${erros.map(it=>{const q=S.q.get(it.qid);const ix=so.itens.indexOf(it);return `<div class="entry"><div class="chips">${Object.entries(ORIGENS).map(([k,v])=>`<button class="chip" data-sim-or="${ix}" data-val="${k}" aria-pressed="${it.origem===k}">${v.t}</button>`).join('')}</div><div class="pills"><span class="pill">${esc(q.cap)}</span><span class="pill e">marcou ${it.marcada}</span>${it.conf?`<span class="pill b">${['','chute','dúvida','certeza'][it.conf]}</span>`:''}<span class="pill c">gabarito ${q.gabarito}</span></div><div class="statement">${esc(q.enunciado)}</div><details class="why"><summary>Por quê</summary><p>${esc(q.comentario)}</p><p class="ref">${esc(q.ref||'')} · ${esc(q.origem||'')}</p></details></div>`}).join('')||'<div class="notice">Nenhum erro.</div>'}
  <button class="btn" id="sim-fechar">Fechar e voltar</button></div>`;
}
function viewSimDisc(sd){
  const rest=sd.inicio+sd.min*6e4-Date.now();
  return `<div class="wrap"><div class="scorebar"><span class="score"><span class="n" id="sim-relogio">${simFmt(rest)}</span></span><span class="progress">Discursiva · escreva de memória</span></div>
  ${sd.itens.map((d,k)=>`<div class="item"><div class="item-head"><span class="item-num">${d.tipo==='peca'?'PEÇA TÉCNICA':'QUESTÃO '+(k+1)}</span><span class="tag">até ${d.linhas} linhas · ${d.tipo==='peca'?30:15} pts</span></div><div class="statement">${esc(d.enunciado)}</div>
  <div class="note"><textarea data-sim-txt="${k}" style="min-height:${d.linhas*14}px">${esc(d.texto||'')}</textarea><span class="saved" id="sim-ln-${k}">${linhas(d.texto)} de ${d.linhas} linhas (≈72 caracteres por linha)</span></div></div>`).join('')}
  <div class="row"><button class="btn" id="sim-dentregar">Entregar discursiva</button><button class="btn ghost small" id="sim-dcancelar">Cancelar</button></div></div>`;
}
function simNota(d){const tl=Math.max(1,linhas(d.texto)),nc=+d.nc||0,ne=+d.ne||0;const v=d.tipo==='peca'?nc-6*ne/tl:nc-3*ne/tl;return Math.max(0,Math.round(v*100)/100)}
function viewSimDiscRes(sd){
  const tot=sd.itens.reduce((a,d)=>a+simNota(d),0);
  return `<div class="wrap"><h2 class="section-title">Correção da discursiva · ${esc(sd.data)}</h2>
  <p class="rule">Compare seu texto com o espelho, dê a nota de conteúdo (NC) e conte os erros de grafia, morfossintaxe e vocabulário (NE). Fórmulas do edital (9.8.5): questão NQ = NC − 3×NE÷TL; peça NPT = NC − 6×NE÷TL. Aprovação na P3: 30 de 60. Espelhos e enunciados são inéditos Claude.</p>
  ${sd.itens.map((d,k)=>`<div class="item"><div class="item-head"><span class="item-num">${d.tipo==='peca'?'PEÇA':'QUESTÃO '+(k+1)}</span><span class="tag">${linhas(d.texto)} linhas escritas</span></div><div class="statement">${esc(d.enunciado)}</div>
  <details class="why"><summary>Seu texto</summary><p>${esc(d.texto||'(em branco)').replace(/\n/g,'<br>')}</p></details>
  <div class="verdict dub"><span class="vt">Espelho</span>${d.espelho.map(e=>`<p>• ${esc(e)}</p>`).join('')}</div>
  <div class="row"><label class="check">NC (0–${d.tipo==='peca'?30:15}) <input type="number" min="0" max="${d.tipo==='peca'?30:15}" step="0.5" data-sim-nc="${k}" value="${d.nc??''}" style="width:70px"></label><label class="check">NE <input type="number" min="0" data-sim-ne="${k}" value="${d.ne??''}" style="width:60px"></label><b class="mono">${simNota(d)} pts</b></div></div>`).join('')}
  <div class="summary two"><div class="stat ${tot>=30?'c':'e'}"><span class="v">${Math.round(tot*100)/100}</span><span class="k">Nota P3 (de 60; aprova com 30)</span></div><div class="stat"><span class="v">${simFmt(sd.fimEm-sd.inicio)}</span><span class="k">Tempo usado</span></div></div>
  <button class="btn" id="sim-dsalvar">Salvar correção e voltar</button></div>`;
}
function simSorteioDisc(){
  const est=new Set();for(const q of S.q.values())est.add(simSigla(q.cap));
  const ok=d=>est.has(d.mat), n=(S.sims||[]).filter(h=>h.tipo==='disc').length;
  const qs=SIM_DISC.filter(d=>d.tipo==='questao'&&ok(d)), ps=SIM_DISC.filter(d=>d.tipo==='peca'&&ok(d));
  const Q=qs.length?qs:SIM_DISC.filter(d=>d.tipo==='questao'), P=ps.length?ps:SIM_DISC.filter(d=>d.tipo==='peca');
  return [Q[(2*n)%Q.length],Q[(2*n+1)%Q.length],P[n%P.length]].map(d=>Object.assign({},d,{texto:''}));
}
let simTimer=null;
function simTick(){clearInterval(simTimer);simTimer=setInterval(()=>{const el=$('#sim-relogio');if(!el||S.view!=='simulado'){clearInterval(simTimer);return}const s=simLS('obj')&&!simLS('obj').fim?simLS('obj'):simLS('disc');if(!s)return;const r=s.inicio+s.min*6e4-Date.now();el.textContent=simFmt(r);if(r<=0){clearInterval(simTimer);toastSim('Tempo esgotado. Entregue a prova.')}},1000)}
function toastSim(t){const el=$('#toast');if(!el)return;el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,3500)}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wireSim(){
  const go=(k,v)=>{simLS(k,v);render(true)};
  const o=$('#sim-obj');if(o)o.addEventListener('click',()=>{const {itens,falta}=simMontar();if(falta.length)toastSim('Faltam itens em: '+falta.map(f=>f.s.toUpperCase()+' ('+f.tem+'/'+f.pedido+')').join(', '));go('obj',{inicio:Date.now(),min:SIM_DEF.obj.min,itens,pos:0,data:hojeISO()})});
  const d=$('#sim-disc');if(d)d.addEventListener('click',()=>go('disc',{inicio:Date.now(),min:SIM_DEF.disc.min,itens:simSorteioDisc(),data:hojeISO()}));
  document.querySelectorAll('[data-sim-m]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const it=s.itens[s.pos||0];const m=b.dataset.simM;if(it.marcada&&!it.prim)it.prim=it.marcada;if(it.marcada===m){it.marcada=null;it.conf=null;go('obj',s);return}if(it.prim&&it.prim!==m)it.trocas=(it.trocas||0)+1;it.marcada=m;it.conf=null;if(m==='B'&&(s.pos||0)<s.itens.length-1)s.pos=(s.pos||0)+1;go('obj',s)}));
  document.querySelectorAll('[data-sim-conf]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const it=s.itens[s.pos||0];it.conf=+b.dataset.simConf;if((s.pos||0)<s.itens.length-1)s.pos=(s.pos||0)+1;go('obj',s);window.scrollTo({top:0})}));
  document.querySelectorAll('[data-sim-ir]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const k=+b.dataset.simIr;if(k<0||k>=s.itens.length)return;s.pos=k;go('obj',s);window.scrollTo({top:0})}));
  const e=$('#sim-entregar');if(e)e.addEventListener('click',()=>{const s=simLS('obj');const br=s.itens.filter(x=>!x.marcada).length;if(br&&!confirm(br+' itens sem marcação contarão como branco. Entregar?'))return;s.fim=true;s.fimEm=Date.now();const {p}=simPontos(s);const id=s.data+'-obj-'+s.inicio;if(S.db)enqueue(()=>S.db.doc('simulados/'+id).set({tipo:'obj',data:s.data,inicio:new Date(s.inicio).toISOString(),minutos:Math.round((s.fimEm-s.inicio)/6e4),p1:p.P1,p2:p.P2,itens:s.itens.map(x=>Object.assign({qid:x.qid,prova:x.prova,mat:x.mat,marcada:x.marcada||'B',conf:x.conf||null},x.prim&&x.prim!==(x.marcada||'B')?{prim:x.prim}:{}))}));go('obj',s)});
  const c=$('#sim-cancelar');if(c)c.addEventListener('click',()=>{if(confirm('Cancelar o simulado em andamento? As marcações serão perdidas.'))go('obj',null)});
  document.querySelectorAll('[data-sim-or]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const it=s.itens[+b.dataset.simOr];if(!it)return;it.origem=it.origem===b.dataset.val?null:b.dataset.val;go('obj',s)}));
  const f=$('#sim-fechar');if(f)f.addEventListener('click',()=>{const s=simLS('obj');if(s&&S.db&&s.itens.some(x=>x.origem)){const id=s.data+'-obj-'+s.inicio;const origens=s.itens.map((x,k)=>x.origem?{i:k,qid:x.qid,origem:x.origem}:null).filter(Boolean);enqueue(()=>S.db.doc('simulados/'+id).update({origensErros:origens}))}go('obj',null)});
  document.querySelectorAll('[data-sim-txt]').forEach(t=>t.addEventListener('input',()=>{const s=simLS('disc');const k=+t.dataset.simTxt;s.itens[k].texto=t.value;simLS('disc',s);const l=$('#sim-ln-'+k);if(l){const n=linhas(t.value),m=s.itens[k].linhas;l.textContent=n+' de '+m+' linhas (≈72 caracteres por linha)'+(n>m?' — acima do limite: o excedente é desconsiderado':'')}}));
  const de=$('#sim-dentregar');if(de)de.addEventListener('click',()=>{const s=simLS('disc');s.fim=true;s.fimEm=Date.now();go('disc',s)});
  const dc=$('#sim-dcancelar');if(dc)dc.addEventListener('click',()=>{if(confirm('Cancelar a discursiva? O texto será perdido.'))go('disc',null)});
  const upd=(sel,campo)=>document.querySelectorAll(sel).forEach(i=>i.addEventListener('change',()=>{const s=simLS('disc');s.itens[+i.dataset[campo==='nc'?'simNc':'simNe']][campo]=i.value;go('disc',s)}));
  upd('[data-sim-nc]','nc');upd('[data-sim-ne]','ne');
  const ds=$('#sim-dsalvar');if(ds)ds.addEventListener('click',()=>{const s=simLS('disc');const nota=Math.round(s.itens.reduce((a,d)=>a+simNota(d),0)*100)/100;const id=s.data+'-disc-'+s.inicio;if(S.db)enqueue(()=>S.db.doc('simulados/'+id).set({tipo:'disc',data:s.data,inicio:new Date(s.inicio).toISOString(),minutos:Math.round((s.fimEm-s.inicio)/6e4),nota,itens:s.itens.map(d=>({id:d.id,tipo:d.tipo,tema:d.tema,texto:d.texto,linhas:linhas(d.texto),nc:+d.nc||0,ne:+d.ne||0,nota:simNota(d)}))}));go('disc',null)});
  if($('#sim-relogio'))simTick();
}

function init(){
  $('#qb-logout').addEventListener('click',()=>{window.QBBridge.ask('logout').catch(()=>{});});
  let v='portal',entrySection=null;
  try{
    const h=(location.hash||'').slice(1);
    if(h.startsWith('menu/')){entrySection=h.slice(5);v='portal';}
    else if(h==='menu'||h==='portal')v='portal';
    else if(VIEWS.includes(h))v=h==='revisao'?'edital':h;
  }catch(e){}
  window.QBBridge.ask('account').then(account=>{
    if(!account.legacy){
      S.studyAccount=true;
      if(account.preview) document.documentElement.classList.add('qb-study-preview');
      S.studyAccountName=account.name;
      PROVAS.P1='Trilha de estudo';
      PROVAS.P2='Conhecimentos específicos';
      PROVA=account.date||null;
      LIMITE=PROVA?addDias(PROVA,-7):null;
      $('.qb-header-kicker').textContent=account.name;
      $('.qb-utility-lab').remove();
      $('#tab-simulado').remove();
    }
    if(v==='portal')openPortal(entrySection,false,false);
    else setView(v,false);
    if(!account.preview&&window.QBAssistant)window.QBAssistant.mount(S);
    return window.claude.use('db');
  }).then(db=>{
    if(!db){ S.dbState='missing'; render(true); return; }
    S.db=db; S.dbState='ok'; render(true); subscribe();
    window.QBLearning?.mount(S,{render,hoje,setView,startSource:(ids,title)=>{setView('treinar');novaRodada('MIX',title,'aprendizagem',ids)}});
  },()=>{S.dbState='missing';render(true)});
}
init();
})();

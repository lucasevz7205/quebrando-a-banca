</head><body><div id="root"></div>
<script type="text/babel">
const DS = window.QuebrandoABancaDesignSystem_3e4054;

const st='A matéria constante de proposta de emenda à Constituição rejeitada ou havida por prejudicada não pode ser objeto de nova proposta na mesma sessão legislativa.';
function App(){const [ans,setAns]=React.useState('C');const [conf,setConf]=React.useState('media');return(<div style={{display:'grid',gridTemplateColumns:'minmax(0,1.25fr) minmax(0,1fr)',gap:20,alignItems:'start'}}>

<div style={{borderRadius:14,overflow:'hidden',border:'var(--border-hairline)'}}><AnswerActionBar state="ready" onConfirm={()=>{}} onSkip={()=>{}} onReview={()=>{}}/></div>
<QuestionCard code="Q 0413" year={2022} tags={['Emendas']} statement="Durante a vigência de estado de defesa, a Constituição poderá ser emendada desde que por iniciativa do Presidente da República." answer="C" answerKey="E" confidence="alta" conceptLink={{label:'Ver no mapa: Limites circunstanciais'}}/>
</div>
<FeedbackDrawer mode="inline" result="incorrect" answerKey="E" explanation="A Constituição não pode ser emendada na vigência de intervenção federal, estado de defesa ou estado de sítio — independentemente de quem proponha." legalBasis="CF/88, art. 60, § 1º" trap={{name:'Exceção inventada',description:'O item cria uma condição (“desde que por iniciativa do Presidente”) que não existe. Limite circunstancial não admite exceção.'}} concept={{path:['Processo legislativo','Emendas','Limites circunstanciais']}} onOpenConcept={()=>{}} onFlashcards={()=>{}}/>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

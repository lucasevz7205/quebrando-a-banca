<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}</style>
</head><body><div class="row"><div style="flex:1;min-width:96px;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:#0A1E34;border:1px solid rgba(241,232,213,.12)"></div><div class="lbl">Navy deep</div><div class="hex">#0A1E34</div><div class="role">Canvas</div></div><div style="flex:1;min-width:96px;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:#173653;border:1px solid rgba(241,232,213,.12)"></div><div class="lbl">Navy raised</div><div class="hex">#173653</div><div class="role">Surfaces</div></div><div style="flex:1;min-width:96px;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:#A58A67;border:1px solid rgba(241,232,213,.12)"></div><div class="lbl">Bronze</div><div class="hex">#A58A67</div><div class="role">Borders, ornament</div></div><div style="flex:1;min-width:96px;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:#D0B386;border:1px solid rgba(241,232,213,.12)"></div><div class="lbl">Gold</div><div class="hex">#D0B386</div><div class="role">Accent, selected</div></div><div style="flex:1;min-width:96px;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:#F1E8D5;border:1px solid rgba(241,232,213,.12)"></div><div class="lbl">Ivory</div><div class="hex">#F1E8D5</div><div class="role">Primary text</div></div><div style="flex:1;min-width:96px;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:#A92E3A;border:1px solid rgba(241,232,213,.12)"></div><div class="lbl">Crimson</div><div class="hex">#A92E3A</div><div class="role">Alert, red accent</div></div></div></body></html>

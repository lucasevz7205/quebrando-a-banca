<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}</style>
</head><body><div class="row" style="gap:18px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><div class="qb-img qb-emblem-soldado" style="width:132px;height:110px;border-radius:18%"></div><span style="font:600 13px/1.2 var(--font-display);letter-spacing:.12em;color:var(--qb-ivory)">O SOLDADO</span><span style="font:italic 500 15px/1.25 var(--font-serif);color:var(--text-secondary)">Disciplina e ação</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><div class="qb-img qb-emblem-sabio" style="width:132px;height:110px;border-radius:18%"></div><span style="font:600 13px/1.2 var(--font-display);letter-spacing:.12em;color:var(--qb-ivory)">O SÁBIO</span><span style="font:italic 500 15px/1.25 var(--font-serif);color:var(--text-secondary)">Conhecimento e reflexão</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><div class="qb-img qb-emblem-estrategista" style="width:132px;height:110px;border-radius:18%"></div><span style="font:600 13px/1.2 var(--font-display);letter-spacing:.12em;color:var(--qb-ivory)">O ESTRATEGISTA</span><span style="font:italic 500 15px/1.25 var(--font-serif);color:var(--text-secondary)">Visão e decisão</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><div class="qb-img qb-emblem-ascensao" style="width:132px;height:110px;border-radius:18%"></div><span style="font:600 13px/1.2 var(--font-display);letter-spacing:.12em;color:var(--qb-ivory)">A ASCENSÃO</span><span style="font:italic 500 15px/1.25 var(--font-serif);color:var(--text-secondary)">A união das virtudes na conquista</span></div></div></body></html>

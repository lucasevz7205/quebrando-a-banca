<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}</style>
</head><body><div class="row"><div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:10px;background:#173653;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-body);color:#D0B386;border:1px solid rgba(241,232,213,.1)">Gold em surface</div><div style="display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font-body);color:#7CC4A4"><span class="ic" style="--m:url(../assets/icons/circle-check.svg);color:currentColor"></span>6.2:1 AA</div><div class="role">Texto e ícones OK</div></div><div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:10px;background:#173653;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-body);color:#A58A67;border:1px solid rgba(241,232,213,.1)">Bronze em surface</div><div style="display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font-body);color:#F2C76E"><span class="ic" style="--m:url(../assets/icons/triangle-alert.svg);color:currentColor"></span>3.8:1 só texto grande</div><div class="role">Use para bordas, não para corpo</div></div><div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:10px;background:#0A1E34;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-body);color:#A92E3A;border:1px solid rgba(241,232,213,.1)">Crimson como texto</div><div style="display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font-body);color:#EE8A7C"><span class="ic" style="--m:url(../assets/icons/circle-x.svg);color:currentColor"></span>2.5:1 falha</div><div class="role">Nunca crimson como texto</div></div><div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:10px;background:#A92E3A;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-body);color:#F1E8D5;border:1px solid rgba(241,232,213,.1)">Ivory em crimson</div><div style="display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font-body);color:#7CC4A4"><span class="ic" style="--m:url(../assets/icons/circle-check.svg);color:currentColor"></span>5.5:1 AA</div><div class="role">Crimson como preenchimento</div></div></div></body></html>

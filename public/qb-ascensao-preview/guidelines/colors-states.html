<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}</style>
</head><body><div class="row"><div style="flex:1;min-width:120px;border-radius:12px;padding:12px;background:rgba(124,196,164,.1);border:1px solid #7CC4A455;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:#7CC4A4;font:600 13px/1.2 var(--font-body)"><span class="ic" style="--m:url(../assets/icons/circle-check.svg);color:#7CC4A4"></span>Acerto</div><div class="hex">patina #7CC4A4</div><div class="role">6.1:1 sobre surface</div></div><div style="flex:1;min-width:120px;border-radius:12px;padding:12px;background:rgba(238,138,124,.1);border:1px solid #EE8A7C55;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:#EE8A7C;font:600 13px/1.2 var(--font-body)"><span class="ic" style="--m:url(../assets/icons/circle-x.svg);color:#EE8A7C"></span>Erro</div><div class="hex">ember #EE8A7C</div><div class="role">5.1:1 · não é o vermelho da marca</div></div><div style="flex:1;min-width:120px;border-radius:12px;padding:12px;background:rgba(171,162,152,.1);border:1px solid #ABA29855;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:#ABA298;font:600 13px/1.2 var(--font-body)"><span class="ic" style="--m:url(../assets/icons/circle-dashed.svg);color:#ABA298"></span>Sem evidência</div><div class="hex">ash #ABA298</div><div class="role">4.9:1 sobre surface</div></div><div style="flex:1;min-width:120px;border-radius:12px;padding:12px;background:rgba(242,199,110,.1);border:1px solid #F2C76E55;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:#F2C76E;font:600 13px/1.2 var(--font-body)"><span class="ic" style="--m:url(../assets/icons/loader-circle.svg);color:#F2C76E"></span>Progresso</div><div class="hex">gold bright #F2C76E</div><div class="role">também foco/atenção</div></div></div></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}</style>
</head><body><div class="row" style="gap:20px"><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:72px;height:72px;border-radius:6px;background:var(--surface);border:1px solid rgba(208,179,134,.55)"></div><span class="lbl">xs</span><span class="hex">6px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:72px;height:72px;border-radius:8px;background:var(--surface);border:1px solid rgba(208,179,134,.55)"></div><span class="lbl">sm</span><span class="hex">8px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:72px;height:72px;border-radius:12px;background:var(--surface);border:1px solid rgba(208,179,134,.55)"></div><span class="lbl">control</span><span class="hex">12px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:72px;height:72px;border-radius:18px;background:var(--surface);border:1px solid rgba(208,179,134,.55)"></div><span class="lbl">card</span><span class="hex">18px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:72px;height:72px;border-radius:22%;background:var(--surface);border:1px solid rgba(208,179,134,.55)"></div><span class="lbl">emblem</span><span class="hex">22%</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:110px;height:40px;border-radius:999px;background:var(--surface);border:1px solid rgba(208,179,134,.55)"></div><span class="lbl">pill</span><span class="hex">999px</span></div></div></body></html>

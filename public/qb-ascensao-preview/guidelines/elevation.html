<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}.e{flex:1;min-width:120px;height:92px;border-radius:16px;background:var(--surface);display:flex;align-items:flex-end;padding:10px}</style>
</head><body><div class="row" style="gap:18px;padding:8px 4px"><div class="e" style="border:var(--border-hairline);box-shadow:var(--shadow-card)"><span class="hex">shadow-card</span></div><div class="e" style="border:var(--border-ornament);box-shadow:var(--shadow-raised)"><span class="hex">raised · ornate</span></div><div class="e" style="box-shadow:var(--glow-gold)"><span class="hex">glow-gold · selected</span></div><div class="e" style="box-shadow:var(--ring-focus)"><span class="hex">ring-focus</span></div></div></body></html>

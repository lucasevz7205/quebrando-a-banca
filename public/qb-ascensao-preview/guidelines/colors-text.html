<!-- @dsCard group="Colors" viewport="700x210" name="Text on surfaces" subtitle="Semantic text tokens with measured contrast" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}.box{flex:1;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;border:var(--border-hairline)}.t{display:flex;justify-content:space-between;gap:8px;font:400 15px/1.3 var(--font-body)}.t span:last-child{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}</style>
</head><body><div class="row"><div class="box" style="background:var(--canvas)"><div class="hex">--canvas #0A1E34</div><div class="t"><span style="color:var(--text-primary)">Texto primário · ivory</span><span>13.8:1</span></div><div class="t"><span style="color:var(--text-secondary)">Texto secundário · parchment</span><span>12.5:1</span></div><div class="t"><span style="color:var(--text-muted)">Texto atenuado · ivory muted</span><span>8.0:1</span></div><div class="t"><span style="color:var(--text-accent)">Destaque · gold</span><span>8.4:1</span></div></div><div class="box" style="background:var(--surface)"><div class="hex">--surface #173653</div><div class="t"><span style="color:var(--text-primary)">Texto primário · ivory</span><span>10.2:1</span></div><div class="t"><span style="color:var(--text-secondary)">Texto secundário · parchment</span><span>9.3:1</span></div><div class="t"><span style="color:var(--text-muted)">Texto atenuado · ivory muted</span><span>5.9:1</span></div><div class="t"><span style="color:var(--text-accent)">Destaque · gold</span><span>6.2:1</span></div></div></div></body></html>

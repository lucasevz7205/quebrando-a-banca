<!-- @dsCard group="Spacing" viewport="700x120" name="Motion" subtitle="Calm, ceremonial easing; no bounce; reduced-motion = instant" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--canvas)}.row{display:flex;gap:12px;flex-wrap:wrap}.lbl{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}.role{font:400 11px/1.3 var(--font-body);color:var(--text-muted)}.ic{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}</style>
</head><body><div class="row" style="gap:28px"><div style="display:flex;flex-direction:column;gap:4px"><span class="lbl">--dur-fast</span><span class="hex">120ms</span><span class="role">hover, press</span></div><div style="display:flex;flex-direction:column;gap:4px"><span class="lbl">--dur-base</span><span class="hex">200ms</span><span class="role">state changes</span></div><div style="display:flex;flex-direction:column;gap:4px"><span class="lbl">--dur-slow</span><span class="hex">360ms</span><span class="role">drawer, flip</span></div><div style="display:flex;flex-direction:column;gap:4px"><span class="lbl">--dur-scene</span><span class="hex">900ms</span><span class="role">progress seal, banners</span></div><div style="display:flex;flex-direction:column;gap:4px"><span class="lbl">--ease-enter</span><span class="hex">cubic-bezier(.16,1,.3,1)</span><span class="role">entradas</span></div></div></body></html>

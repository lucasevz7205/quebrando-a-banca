<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quebrando a banca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: uma coluna de leitura, como uma folha de respostas; abas no topo, placar fixo durante a rodada */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --ink:#13201D; --muted:#5A6965; --line:#D3DDDA;
  --pen:#1E4FD2; --pen-soft:#E3EAFC;
  --certo:#17784A; --certo-soft:#E1F3E9; --errado:#B4261D; --errado-soft:#FBE6E4; --duvida:#8A6A12; --duvida-soft:#F7EFD6;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1028; --surface:#111A3A; --ink:#E6EAF7; --muted:#97A1C4; --line:#253159;
  --pen:#7C9BFF; --pen-soft:#1B2A5E;
  --certo:#5CCB8E; --certo-soft:#13291E; --errado:#FF8E84; --errado-soft:#33181A; --duvida:#E2C268; --duvida-soft:#2C2512;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1028; --surface:#111A3A; --ink:#E6EAF7; --muted:#97A1C4; --line:#253159;
  --pen:#7C9BFF; --pen-soft:#1B2A5E;
  --certo:#5CCB8E; --certo-soft:#13291E; --errado:#FF8E84; --errado-soft:#33181A; --duvida:#E2C268; --duvida-soft:#2C2512;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.countdown{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.countdown b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-weight:600;font-stretch:90%;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pen)}
.count{font-family:var(--mono);font-size:12px;background:var(--line);color:var(--ink);border-radius:999px;padding:0 7px;line-height:18px}
.count.hot{background:var(--errado);color:var(--surface)}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px;color:var(--muted)}
.notice strong{color:var(--ink)}

/* setup */
.section-title{font-weight:700;font-stretch:88%;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.due{background:var(--surface);border:1.5px solid var(--pen);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.due-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.due-n{font-weight:800;font-stretch:85%;font-size:22px;line-height:1.15}
.due-n .mono{font-weight:600}
.due-meta{font-size:13.5px;color:var(--muted)}
.due.calm{border-color:var(--line)}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cap{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cap[aria-pressed="true"]{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.cap .cn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cap .ct{font-weight:700;font-stretch:90%;font-size:16px;line-height:1.25}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.cap .meta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mode input{margin-top:4px;accent-color:var(--pen)}
.mode b{font-weight:600}
.mode span{color:var(--muted);font-size:13.5px}
.mode.disabled{opacity:.55;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.check input{accent-color:var(--pen)}
tr.qr-m{cursor:pointer;background:var(--paper)} tr.qr-m:hover{background:var(--pen-soft)} tr.qr-a td:first-child{padding-left:28px;white-space:normal}
.check input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:700;font-stretch:90%;background:var(--pen);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13.5px}
.rule{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0}

/* placar */
.scorebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.score{display:flex;gap:14px;font-family:var(--mono);font-size:13.5px;flex-wrap:wrap}
.score .c{color:var(--certo)} .score .e{color:var(--errado)} .score .b{color:var(--duvida)}
.score .n{font-weight:600}
.progress{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* item */
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:18px}
.item-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.item-num{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.06em}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.statement{font-family:var(--read);font-size:18px;line-height:1.6;margin:0;max-width:65ch;text-wrap:pretty}
.statement .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.statement p{margin:0 0 10px}
mark.trava{background:var(--duvida-soft);color:inherit;border-bottom:2px solid var(--duvida);padding:0 2px;border-radius:2px}
.answers{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bubble{width:54px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-family:var(--mono);font-weight:600;font-size:17px;display:grid;place-items:center;transition:background .12s}
.bubble:hover:not(:disabled){background:var(--pen-soft)}
.bubble:disabled{cursor:default}
.bubble.picked{background:var(--ink);color:var(--surface)}
.bubble.key{border-color:var(--certo);box-shadow:0 0 0 3px var(--certo-soft)}
.blank{background:none;border:1.5px dashed var(--muted);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:14px}
.blank.picked{border-style:solid;border-color:var(--duvida);color:var(--duvida);background:var(--duvida-soft)}
.blank:disabled{cursor:default}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}

.conf{border:1.5px solid var(--pen);background:var(--pen-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.conf-q{font-weight:700;font-stretch:90%}
.conf-opts{display:flex;gap:8px;flex-wrap:wrap}
.conf-opts button{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;font-stretch:92%;display:flex;gap:8px;align-items:baseline}
.conf-opts button:hover{border-color:var(--pen)}
.conf-opts .mono{color:var(--muted);font-size:12.5px}

.verdict{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--certo-soft)} .verdict.bad{background:var(--errado-soft)} .verdict.dub{background:var(--duvida-soft)}
.verdict .vt{font-weight:800;font-stretch:88%;font-size:16px}
.verdict.ok .vt{color:var(--certo)} .verdict.bad .vt{color:var(--errado)} .verdict.dub .vt{color:var(--duvida)}
.verdict p{margin:0;font-family:var(--read);font-size:16px;line-height:1.55;max-width:65ch}
.calib{font-size:14px;font-weight:600}
.calib.alert{color:var(--errado)}
.ref{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.origem{display:flex;flex-direction:column;gap:8px}
.origem-q{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--ink);font-weight:600}
.origem-hint{font-size:13.5px;color:var(--muted);margin:0;max-width:65ch}

/* resumo */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.summary.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat.c .v{color:var(--certo)} .stat.e .v{color:var(--errado)} .stat.b .v{color:var(--duvida)}
@media (max-width:520px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* caderno */
.entry{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--errado);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.entry.dub{border-left-color:var(--duvida)}
.entry .statement{font-size:16.5px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.e{color:var(--errado);border-color:currentColor}
.pill.c{color:var(--certo);border-color:currentColor}
.pill.b{color:var(--duvida);border-color:currentColor}
.pill.p{color:var(--pen);border-color:currentColor}
details.why{border-top:1px dashed var(--line);padding-top:10px}
details.why summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--pen)}
details.why p{font-family:var(--read);font-size:15.5px;line-height:1.55;margin:8px 0 0;max-width:65ch}
.note label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.note textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:15px/1.45 var(--read);padding:8px 10px}
.saved{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.group-h h2{margin:0;font-size:17px;font-weight:700;font-stretch:88%}

/* desempenho */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.narrow{min-width:360px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.neg{color:var(--errado)} .pos{color:var(--certo)}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--read);font-size:16px;line-height:1.55;margin:0}
.insight b{font-family:var(--display);font-stretch:90%}
.agenda-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 12px 10px}
.agenda{display:grid;grid-template-columns:repeat(14,minmax(34px,1fr));gap:6px;align-items:end;min-width:520px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px}
.day .n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.day .col{width:100%;height:84px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.day .col i{display:block;width:100%;background:var(--pen);border-radius:3px 3px 0 0;min-height:0}
.day.today .col i{background:var(--errado)}
.day .d{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.day.today .d{color:var(--ink);font-weight:600}

/* método */
.metodo{display:flex;flex-direction:column;gap:16px}
.metodo ol,.metodo ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-family:var(--read);font-size:16px;line-height:1.55;max-width:65ch}
.metodo li b{font-family:var(--display);font-stretch:90%}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.book .bt{font-weight:700;font-stretch:90%;line-height:1.25}
.book .ba{font-size:13px;color:var(--muted)}
.book .bu{font-family:var(--read);font-size:14.5px;line-height:1.45}

/* central: painel e edital */
.st{display:inline-block;font-family:var(--mono);font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.st-nao{color:var(--muted)} .st-estudo{color:var(--duvida)} .st-revisao{color:var(--pen)} .st-dominado{color:var(--certo)}
.sbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;min-width:80px}
.sbar i{display:block;height:100%}
.sbar .b-dominado{background:var(--certo)} .sbar .b-revisao{background:var(--pen)} .sbar .b-estudo{background:var(--duvida)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.prog{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prog-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.prog-row:last-child{border-bottom:0}
.prog-row:hover{background:var(--paper)}
.prog-row .pn{font-weight:600;font-stretch:92%;min-width:0}
.prog-row .pm{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.prova-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 14px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
.feed{display:flex;flex-direction:column;gap:10px}
.log{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.log-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.log-h b{font-stretch:90%}
.log p{margin:0;font-family:var(--read);font-size:15.5px;line-height:1.5;max-width:70ch}
.log .nx{font-family:var(--display);font-size:13.5px;color:var(--muted)}
.log .nx b{color:var(--ink)}
.chips-t{display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--paper)}
a{color:var(--pen)}
.mat-l{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mat{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.mat:last-child{border-bottom:0}
.mat .mt{font-weight:600;font-stretch:92%;min-width:0}
.mtype{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select,.st-sel{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.st-sel{font-size:12.5px;padding:3px 6px;max-width:150px}
details.mat-g{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.mat-g>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,160px) auto;gap:12px;align-items:center;padding:12px 16px}
details.mat-g>summary::-webkit-details-marker{display:none}
details.mat-g>summary .gn{font-weight:700;font-stretch:88%;font-size:16px}
details.mat-g>summary .gn::before{content:"▸ ";color:var(--muted)}
details.mat-g[open]>summary .gn::before{content:"▾ "}
.topic{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.topic.fora{background:var(--paper)}
.t-h{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:baseline}
.t-num{font-family:var(--mono);font-size:13px;font-weight:600}
.t-tit{font-family:var(--read);font-size:15.5px;line-height:1.45}
.t-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-left:62px}
.t-meta .mono{font-size:12.5px;color:var(--muted)}
.lnk{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--paper)}
.lnk:hover{border-color:var(--pen)}
.pts{padding-left:62px;display:flex;flex-direction:column;gap:10px}
.pts-g{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pt{border-left:3px solid var(--line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px}
.pt .pk{font-weight:700;font-stretch:92%;text-align:left;background:none;border:0;padding:0;color:var(--ink)}
.pt .pk.ev{border-bottom:1px dashed var(--pen);color:var(--pen)}

const dia=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function hoje(){return dia(new Date())}
function addDias(ds,n){const [y,m,d]=ds.split('-').map(Number);return dia(new Date(y,m-1,d+n))}
function difDias(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5)}
function diaDe(iso){const d=new Date(iso);return isNaN(d)?hoje():dia(d)}
function ddmm(ds){const p=ds.split('-');return p[2]+'/'+p[1]}
function nivelDe(r){return Number.isInteger(r.nivel)?r.nivel:(r.noCaderno?0:1)}
function proxDe(r){
  if(!r||!r.tentativas) return null;
  const base=diaDe(r.atualizadoEm||new Date().toISOString());
  const salvo=r.proxRevisao||addDias(base,r.noCaderno?1:3);
  if(r.noCaderno) return salvo;
  /* acertos fora do caderno: no mínimo 7 dias (certeza) ou 3 (dúvida) depois da última resposta.
     Vale também para respostas antigas, sem alterá-las no banco. */
  const min=agendarDias(base,r.conf===3?7:3);
  return min>salvo?min:salvo;
}
function agendarDias(d,n){
  if(d>=LIMITE) return addDias(d,1);
  const p=addDias(d,Math.min(n,teto(d)));
  return p>LIMITE?LIMITE:p;
}
const LIMITE_DIA=50;   // revisões de questões por dia (06/11/2026: 50, o mesmo teto dos cartões); erros primeiro
/* teto: nenhum intervalo passa de 20% dos dias que faltam para a prova (curva de Cepeda et al., 2008) */
function teto(d){return Math.max(1,Math.floor(difDias(d,PROVA)*0.2))}
function agendar(d,nivel){
  if(d>=LIMITE) return addDias(d,1);
  const n=Math.min(INT[Math.max(0,Math.min(nivel,INT.length-1))],teto(d));
  const p=addDias(d,n);
  return p>LIMITE?LIMITE:p;
}

/* palavras de alcance (treino do Sistema 2): destacadas só depois da resposta */
const TRAVAS=new RegExp('(?<![\\p{L}])(apenas|somente|só|sempre|nunca|jamais|exclusivamente|unicamente|necessariamente|obrigatoriamente|todos|todas|todo|toda|nenhum|nenhuma|qualquer|exceto|salvo|vedad[oa]s?|privativ[oa]s?|privativamente|independentemente|em regra|integralmente|totalmente|em nenhuma hipótese)(?![\\p{L}])','giu');
function marcarTravas(txt){return esc(txt).replace(TRAVAS,'<mark class="trava">$1</mark>')}
function temTravas(q){TRAVAS.lastIndex=0;const t=TRAVAS.test(String(q.enunciado||''));TRAVAS.lastIndex=0;return t}

/* ---------- escrita serial ---------- */
let chain=Promise.resolve();
function enqueue(fn){
  chain=chain.then(fn).catch(err=>{
    const code=err&&err.code;
    toast(code==='quota_exceeded'?'O espaço do caderno encheu. Peça ao Claude para arquivar rodadas antigas.':
      code==='invalid_argument'?'Esta conta não pode gravar neste caderno.':
      'Não foi possível salvar agora. Sua próxima resposta tentará de novo.');
  });
  return chain;
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}

/* ---------- dados derivados ---------- */
/* uma questão errada (ou deixada em branco) uma vez fica contada como erro: acertos posteriores não apagam o erro (regra do Lucas, 02/11/2026) */
function jaErrou(r){return (r.erros||0)>0||(r.brancos||0)>0||(r.hist||[]).some(h=>!h.ok)}
/* capítulos que repetem erros de simulado (SIM-…) ficam fora dos percentuais: os itens continuam no caderno de erros (pedido do Lucas, 05/11/2026) */
const foraCalc=cap=>/^SIM/i.test(String(cap||''));
/* itens marcados com foraNivel (acima do nível do edital do cargo 11) ficam fora de percentuais, revisão espaçada e simulado (06/11/2026) */
const foraQ=q=>!!q&&(foraCalc(q.cap)||!!q.foraNivel);
const foraQid=qid=>foraQ(S.q.get(qid));
function caps(){
  const m=new Map(), h=hoje();
  for(const q of S.q.values()){ if(!m.has(q.cap)) m.set(q.cap,{cap:q.cap,nome:q.capNome||'',total:0,resp:0,okUlt:0,cad:0,devidos:0}); }
  for(const q of S.q.values()){
    const c=m.get(q.cap); c.total++;
    const r=S.r.get(q.id);
    if(r&&r.tentativas){ c.resp++; if(r.ultimaMarcada===q.gabarito&&!jaErrou(r)) c.okUlt++; if(r.noCaderno) c.cad++; const p=proxDe(r); if(p&&p<=h) c.devidos++; }
  }
  return [...m.values()].sort((a,b)=>{const ta=topicoDoCap(a.cap),tb=topicoDoCap(b.cap);
    return (ta?ta.materiaOrdem||99:999)-(tb?tb.materiaOrdem||99:999)||(ta?ta.ordem||0:0)-(tb?tb.ordem||0:0)||a.cap.localeCompare(b.cap,'pt',{numeric:true});});
}
/* tópico do edital ligado a um capítulo do Caderno (o de menor ordem, se houver mais de um) */
function topicoDoCap(cap){let best=null;for(const t of S.ed.values()) if((t.caps||[]).includes(cap)&&(!best||(t.ordem||0)<(best.ordem||0))) best=t; return best}
function capNome(cap){for(const q of S.q.values()) if(q.cap===cap) return q.capNome||''; return ''}
function questoesDoCap(cap){return [...S.q.values()].filter(q=>q.cap===cap).sort((a,b)=>(a.ordem||0)-(b.ordem||0))}
function filaPara(cap,modo){
  let qs=questoesDoCap(cap);
  if(modo==='novos') qs=qs.filter(q=>!(S.r.get(q.id)?.tentativas));
  if(modo==='caderno') qs=qs.filter(q=>S.r.get(q.id)?.noCaderno);
  return qs.map(q=>q.id);
}
/* revisões vencidas, intercaladas: um item de cada capítulo por vez */
function devidas(){
  const h=hoje(), porCap=new Map();
  for(const r of S.r.values()){
    const q=S.q.get(r.qid); if(!q||q.foraNivel) continue;
    const p=proxDe(r); if(!p||p>h) continue;
    if(!porCap.has(q.cap)) porCap.set(q.cap,[]);
    porCap.get(q.cap).push({id:q.id,p,cad:!!r.noCaderno});
  }
  /* limite diário: erros do caderno primeiro, depois os acertos mais antigos; o que sobra fica para amanhã */
  const todas=[...porCap.values()].flat().sort((a,b)=>(b.cad-a.cad)||a.p.localeCompare(b.p));
  /* o limite é do dia: desconta o que já foi revisado hoje nas rodadas de revisão espaçada */
  const feitas=new Set(); for(const r of S.rodadas) if(r.modo==='revisao'&&diaDe(r.inicio)===h) for(const it of (r.itens||[])) feitas.add(it.qid);
  const lim=Math.max(0,LIMITE_DIA+(S.revExtra||0)-feitas.size);
  const escolhidas=new Set(todas.slice(0,lim).map(x=>x.id));
  const listas=[...porCap.values()].map(l=>l.filter(x=>escolhidas.has(x.id)).sort((a,b)=>(b.cad-a.cad)||a.p.localeCompare(b.p))).filter(l=>l.length);
  for(let i=listas.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[listas[i],listas[j]]=[listas[j],listas[i]]}
  const out=[]; let k=0, resto=true;
  while(resto){ resto=false; for(const l of listas){ if(k<l.length){ out.push(l[k].id); resto=true; } } k++; }
  const nCad=todas.filter(x=>x.cad&&escolhidas.has(x.id)).length;
  return {fila:out,caps:listas.length,atrasadas:todas.filter(x=>x.p<h&&escolhidas.has(x.id)).length,adiadas:Math.max(0,todas.length-lim),erros:nCad,feitasHoje:feitas.size};
}
function proximaData(){
  const h=hoje(); let min=null,n=0;
  for(const r of S.r.values()){ if(!S.q.has(r.qid)) continue; const p=proxDe(r); if(!p||p<=h) continue; if(!min||p<min){min=p;n=1} else if(p===min) n++; }
  return min?{d:min,n}:null;
}
function cadernoItens(){
  return [...S.r.values()].filter(r=>r.noCaderno&&S.q.has(r.qid))
    .map(r=>({r,q:S.q.get(r.qid)}))
    .sort((a,b)=>a.q.cap.localeCompare(b.q.cap,'pt',{numeric:true})||(a.q.ordem||0)-(b.q.ordem||0));
}
function textoHTML(q){
  const t=q&&q.textoId&&S.tx&&S.tx.get(q.textoId); if(!t) return '';
  return `<details class="why" open style="border-top:0;padding-top:0"><summary>Texto de apoio · ${esc(t.titulo||'')} <span class="ref">(${esc(t.itens||'')})</span></summary><div class="statement" style="font-size:16.5px;margin-top:8px">${String(t.texto||'').split(/\n\n+/).map(p=>`<p style="text-indent:1.5em">${esc(p)}</p>`).join('')}</div><p class="ref" style="text-align:right">${esc(t.fonte||'')}</p></details>`;
}
function statementHTML(q,travas){
  // "Situação hipotética: ... Assertiva: ..." vira dois blocos
  const f=travas?marcarTravas:esc;
  const t=String(q.enunciado||'');
  /* contexto antes da assertiva: situação hipotética, texto de apoio, dados de tabela ou proposição dada */
  const m=t.match(/^(Situação hipotética|Texto de apoio|Dados da tabela|Considere a proposição \S+):\s*([\s\S]*?)\s*Assertiva:\s*([\s\S]*)$/);
  if(m){ const lb=m[1].startsWith('Considere')?m[1].replace('Considere a ','').replace(/^p/,'P'):m[1];
    return `<span class="lbl">${esc(lb)}</span><p>${f(m[2])}</p><span class="lbl">Assertiva</span><p>${f(m[3])}</p>`; }
  return `<p>${f(t)}</p>`;
}

function render(force){
  const ae=document.activeElement;
  if(!force && ae && ae.dataset && (ae.dataset.nota||ae.dataset.cresp)){ S.pendingRender=true; updateCounts(); return; }
  S.pendingRender=false;
  updateCounts();
  const main=$('#main');
  if(S.view==='metodo'){ main.innerHTML=`<div class="qb-tab-shell">${subnav()}</div>`+sectionIntro('metodo')+`<div class="wrap" style="gap:14px">${viewMetodo()}</div>`; wire(); return; }
  if(S.dbState==='loading'){ main.innerHTML=`<div class="notice">Abrindo o caderno…</div>`; return; }
  if(S.dbState==='missing'){ main.innerHTML=`<div class="notice"><strong>Não foi possível abrir o banco de respostas nesta visualização.</strong> Abra este caderno pelo claude.ai com a sua conta para treinar e guardar as respostas.</div>`; return; }
  if(!S.qLoaded){ main.innerHTML=`<div class="notice">Carregando as questões…</div>`; return; }
  if(S.q.size===0){ main.innerHTML=`<div class="notice"><strong>Nenhuma questão carregada ainda.</strong> Peça ao Claude, na conversa, para adicionar os itens de um capítulo. Eles aparecem aqui automaticamente.</div>`; return; }
  if(S.view==='painel') main.innerHTML=viewPainel();
  else if(S.view==='edital') main.innerHTML=viewEdital();
  else if(S.view==='revisao') main.innerHTML=viewRevisao();
  else if(S.view==='mapa') main.innerHTML=viewMapa();
  else if(S.view==='cartoes') main.innerHTML=viewCartoes();
  else if(S.view==='pegadinhas') main.innerHTML=viewPegadinhas();
  else if(S.view==='conteudo') main.innerHTML=viewConteudo();
  else if(S.view==='treinar') main.innerHTML=S.round?(S.round.fim?viewFim():viewItem()):viewSetup();
  else if(S.view==='caderno') main.innerHTML=viewCaderno();
  else if(S.view==='analiseDia') main.innerHTML=window.QBInsights ? window.QBInsights.render(S,hoje) : '<div class="notice">Análise diária indisponível.</div>';
  else if(S.view==='simulado'){ main.innerHTML=viewSimulado(); if(!simLS('obj')&&!simLS('disc')) main.insertAdjacentHTML('afterbegin',sectionIntro('simulado')); wireSim(); return; }
  else main.innerHTML=viewHistorico();

  wire();
}

function viewSetup(){
  const cs=caps();
  if(!S.cap||!S.capEscolhido||!cs.find(c=>c.cap===S.cap)) S.cap=cs[0].cap;
  const nNovos=filaPara(S.cap,'novos').length, nTodos=filaPara(S.cap,'todos').length, nCad=filaPara(S.cap,'caderno').length;
  if(S.modo==='novos'&&!nNovos) S.modo='todos';
  if(S.modo==='caderno'&&!nCad) S.modo='todos';
  const n=filaPara(S.cap,S.modo).length;
  const dv=devidas(), px=proximaData();
  const due=dv.fila.length?`<section class="due" aria-label="Revisão espaçada de hoje">
      <div class="due-body"><h2 class="section-title">Revisão espaçada de hoje</h2>
        <div class="due-n"><span class="mono">${dv.fila.length}</span> ${dv.fila.length===1?'item':'itens'} para hoje</div>
        <div class="due-meta">${dv.erros} do caderno de erros e ${dv.fila.length-dv.erros} ${dv.fila.length-dv.erros===1?'acerto':'acertos'} para confirmar · ${dv.caps} ${dv.caps===1?'capítulo':'capítulos'}, intercalados.${dv.feitasHoje?` Você já revisou ${dv.feitasHoje} hoje.`:''}${dv.adiadas?` Limite de ${LIMITE_DIA} por dia: ${dv.adiadas} ${dv.adiadas===1?'item fica':'itens ficam'} para os próximos dias.`:''}</div></div>
      <button class="btn" id="start-rev">Começar revisão</button></section>`
    :`<section class="due calm" aria-label="Revisão espaçada"><div class="due-body"><h2 class="section-title">Revisão espaçada</h2>
        <div class="due-meta">${dv.feitasHoje?`Meta de hoje cumprida: <b class="mono">${dv.feitasHoje}</b> revisadas.${dv.adiadas?` ${dv.adiadas} ${dv.adiadas===1?'item vencido fica':'itens vencidos ficam'} para os próximos dias.`:''}</div>${dv.adiadas?'<button class="btn ghost small" id="rev-mais" style="margin-top:6px;align-self:flex-start">Revisar mais 20 (opcional)</button>':''}<div class="due-meta" hidden>`:'Nada vence hoje.'}${px?` Próxima revisão em <b class="mono">${ddmm(px.d)}</b>: ${px.n} ${px.n===1?'item':'itens'}.`:' Responda itens para montar a agenda.'}</div></div></section>`;
  const card=c=>{
    const ok=c.total?c.okUlt/c.total*100:0, bad=c.total?(c.resp-c.okUlt)/c.total*100:0;
    const t=topicoDoCap(c.cap);
    const nome=t?String(c.nome||'').replace(/^[^·]*·\s*/,''):c.nome;
    return `<button class="cap" data-cap="${esc(c.cap)}" aria-pressed="${c.cap===S.cap}">
      <span class="cn">${t?`Edital ${esc(t.num)} · `:''}Capítulo ${esc(c.cap)}</span>
      <span class="ct">${esc(nome)}</span>
      <span class="bar" aria-hidden="true"><i style="width:${ok}%;background:var(--certo)"></i><i style="width:${bad}%;background:var(--errado)"></i></span>
      <span class="meta">${c.resp}/${c.total} feitas · ${c.cad} no caderno${c.devidos?` · ${c.devidos} hoje`:''}</span>
    </button>`};
  /* agrupa por matéria, como na aba Edital: P1 e P2, matérias e capítulos na ordem do edital */
  const grupos=new Map();
  for(const c of cs){
    const t=topicoDoCap(c.cap);
    const k=t?t.sigla:'_outros';
    if(!grupos.has(k)) grupos.set(k,{k,nome:t?t.materia:'Outros capítulos',prova:t?t.prova:'',cs:[]});
    grupos.get(k).cs.push(c);
  }
  const gSel=[...grupos.values()].find(g=>g.cs.some(c=>c.cap===S.cap));
  if(gSel&&S.edLoaded&&!S.trIni){ S.trIni=true; S.abertos.add('tr:'+gSel.k); }
  const grupoHTML=g=>{
    const tot=g.cs.reduce((a,c)=>a+c.total,0), resp=g.cs.reduce((a,c)=>a+c.resp,0), ok=g.cs.reduce((a,c)=>a+c.okUlt,0), dev=g.cs.reduce((a,c)=>a+c.devidos,0);
    const sel=g.cs.some(c=>c.cap===S.cap);

      ${mode('caderno','Revisar o caderno de erros','Só os itens que você errou, deixou em branco ou acertou no chute. Dois acertos seguidos com segurança tiram o item do caderno.',nCad)}
    </div>

      <button class="btn" id="start" ${n?'':'disabled'}>Começar rodada · ${n} ${n===1?'item':'itens'}</button>

}

}

function viewCaderno(){
  const its=cadernoItens();
  if(!its.length) return `<div class="notice" style="margin-top:4px"><strong>Seu caderno está vazio.</strong> Todo item que você errar, deixar em branco ou acertar no chute entra aqui, com o comentário e espaço para anotar por que errou. Ele sai depois de dois acertos seguros seguidos.</div>`;
  /* agrupado como o Edital: prova → matéria → assunto (tópico do edital) → itens (pedido do Lucas, 05/11/2026) */
  const mats=new Map();
  for(const it of its){
    const t=topicoDoCap(it.q.cap);
    const mk=t?t.sigla:'_outros';
    if(!mats.has(mk)) mats.set(mk,{k:mk,nome:t?t.materia:'Outros capítulos',prova:t?t.prova:'',ord:t?(t.materiaOrdem||99):999,tops:new Map()});
    const tk=t?t.id:'cap:'+it.q.cap;
    const m=mats.get(mk);
    if(!m.tops.has(tk)) m.tops.set(tk,{k:tk,num:t?t.num:'',tit:t?t.titulo:(it.q.capNome||it.q.cap),ord:t?(t.ordem||0):9999,caps:new Set(),its:[]});
    const g=m.tops.get(tk); g.caps.add(it.q.cap); g.its.push(it);
  }
  const hj=hoje();
  const cntHoje=l=>l.filter(({r})=>{const p=proxDe(r);return p&&p<=hj}).length;
  let html=`<p class="rule">${its.length} ${its.length===1?'item':'itens'} no caderno, agrupados por matéria e assunto do edital. Abra a matéria e depois o assunto; "Revisar" faz uma rodada só com os erros daquele capítulo.</p>`;
  for(const pv of ['P1','P2','']){
    const ms=[...mats.values()].filter(m=>m.prova===pv).sort((x,y)=>x.ord-y.ord||x.nome.localeCompare(y.nome));
    if(!ms.length) continue;
    html+=`<h3 class="prova-h" style="margin:4px 0 0;background:none;border:0;padding:0">${esc(PROVAS[pv]||'Sem tópico do edital')}</h3>`;
    for(const m of ms){
      const tops=[...m.tops.values()].sort((x,y)=>x.ord-y.ord||String(x.num).localeCompare(String(y.num),'pt',{numeric:true}));
      const n=tops.reduce((a,t)=>a+t.its.length,0), nh=tops.reduce((a,t)=>a+cntHoje(t.its),0);
      html+=`<details class="mat-g" data-grupo="cd:${esc(m.k)}" ${S.abertos.has('cd:'+m.k)?'open':''}><summary><span class="gn">${esc(m.nome)}</span><span></span><span class="mono" style="font-size:12.5px;color:var(--muted)">${n} ${n===1?'item':'itens'} · ${tops.length} ${tops.length===1?'assunto':'assuntos'}${nh?` · ${nh} hoje`:''}</span></summary>`;
      for(const tp of tops){
        const gk='cd:t:'+tp.k;
        html+=`<details class="rv-top" data-grupo="${esc(gk)}" ${S.abertos.has(gk)?'open':''}><summary><div class="t-h"><span class="t-num">${esc(tp.num||'')}</span><span class="t-tit">${esc(tp.tit||'')} <span class="mono" style="font-size:12px;color:var(--muted)">· ${tp.its.length} ${tp.its.length===1?'item':'itens'}</span></span></div></summary>
          <div class="acts">${[...tp.caps].map(c=>{const k=tp.its.filter(x=>x.q.cap===c).length;return `<button class="btn small" data-revisar="${esc(c)}">Revisar ${k} · cap. ${esc(c)}</button>`}).join('')}</div>`;
        html+=entradasCaderno(tp.its);
        html+=`</details>`;
      }
      html+=`</details>`;
    }
  }
  return `<div class="wrap" style="gap:14px">${html}</div>`;
}
function entradasCaderno(lista){
  let html='';
  {
    for(const {q,r} of lista){
      const dub=r.motivo==='branco'||r.motivo==='chute';
      const seq=r.acertosSeguidos||0;
      const prox=proxDe(r);
      const ult=r.motivo==='chute'?'<span class="pill b">Acertou no chute</span>':`<span class="pill ${r.ultimaMarcada==='B'?'b':(r.ultimaMarcada===q.gabarito?'c':'e')}">Última: ${LETRA[r.ultimaMarcada]||'–'}</span>`;
      html+=`<article class="entry${dub?' dub':''}">
        <div class="item-head"><span class="item-num">ITEM ${String(q.ordem||'').padStart(2,'0')}</span><span class="tag">${esc(q.tema||'')}</span></div>
        <div class="statement">${statementHTML(q,true)}</div>
        <div class="pills">
          ${ult}
          <span class="pill c">Gabarito: ${LETRA[q.gabarito]}</span>
          ${r.conf?`<span class="pill">Confiança: ${CONF[r.conf]}</span>`:''}
          <span class="pill">${r.erros||0} ${r.erros===1?'erro':'erros'} · ${r.brancos||0} em branco</span>
          <span class="pill">${seq}/2 acertos para sair</span>
          ${prox?`<span class="pill p">Revisão ${prox<=hoje()?'hoje':'em '+ddmm(prox)}</span>`:''}
        </div>
        ${chipsOrigem(q.id,r.origem)}
        <details class="why"><summary>Ver o gabarito comentado</summary><p>${esc(q.comentario)}</p>${q.ref?`<p class="ref">Ver ${esc(q.ref)}</p>`:''}</details>
        <div class="note"><label for="nota-${esc(q.id)}">Por que errei / o que lembrar</label>
          <textarea id="nota-${esc(q.id)}" data-nota="${esc(q.id)}" placeholder="Escreva a regra com as suas palavras e um exemplo próprio.">${esc(r.nota||'')}</textarea>
          <span class="saved" id="saved-${esc(q.id)}"></span></div>

    }

function estatisticas(){
  let eSendoC=0,cSendoE=0,brancos=0;
  const conf={1:[0,0],2:[0,0],3:[0,0]};
  for(const r of S.r.values()){
    const q=S.q.get(r.qid); if(!q||foraQ(q)) continue;
    for(const h of (r.hist||[])){
      if(h.m==='B'){brancos++;continue}
      if(!h.ok){ if(h.m==='E') eSendoC++; else cSendoE++; }
      if(h.c&&conf[h.c]){ conf[h.c][0]++; if(h.ok) conf[h.c][1]++; }
    }
  }
  const origem={}; let semOrigem=0;
  for(const {r} of cadernoItens()){ if(r.motivo==='chute') continue; if(r.origem&&ORIGENS[r.origem]) origem[r.origem]=(origem[r.origem]||0)+1; else semOrigem++; }
  return {eSendoC,cSendoE,brancos,conf,origem,semOrigem};
}
/* evolução dos acertos por assunto (capítulo do Caderno), por dia, a partir dos itens de cada rodada */
function dadosEvolucao(){
  const m=new Map();
  for(const r of S.rodadas){
    const d0=diaDe(r.inicio);
    if((S.evoDe&&d0<S.evoDe)||(S.evoAte&&d0>S.evoAte)) continue;
    const d=bucketEvo(d0);
    for(const it of (r.itens||[])){
      const q=S.q.get(it.qid); const c0=q?q.cap:(!multiCap(r.cap)?r.cap:null); if(!c0||foraCalc(c0)||(q&&q.foraNivel)) continue;
      /* sem filtro: uma linha por matéria; com matéria escolhida: uma linha por assunto dela */
      const sig=materiaDoCap(c0)||'_';
      if(S.fEvo&&sig!==S.fEvo) continue;
      const cap=S.fEvo?c0:sig;
      const nome=S.fEvo?(q?q.capNome:(r.capNome||'')):(nomeMateria(sig));
      if(!m.has(cap)) m.set(cap,{cap,nome,dias:new Map()});
      const o=m.get(cap).dias.get(d)||{c:0,n:0}; o.n++; if(it.marcada===it.gabarito) o.c++; m.get(cap).dias.set(d,o);
    }
  }
  const ser=[...m.values()].map(s=>({...s,pts:[...s.dias.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([d,o])=>({d,c:o.c,n:o.n}))}));
  ser.sort((a,b)=>a.pts[0].d.localeCompare(b.pts[0].d)||a.cap.localeCompare(b.cap,'pt',{numeric:true}));
  ser.forEach((s,i)=>{s.slot=i<8?i+1:0;});
  return ser;
}
/* período do gráfico: dia, semana (começa na segunda) ou mês */
function bucketEvo(d){
  if(S.evoPer==='s'){const [y,m,dd]=d.split('-').map(Number);const w=(new Date(y,m-1,dd).getDay()+6)%7;return addDias(d,-w)}
  if(S.evoPer==='m') return d.slice(0,8)+'01';
  return d;
}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function lblEvo(d){if(S.evoPer==='m') return MESES[+d.slice(5,7)-1]+'/'+d.slice(2,4); if(S.evoPer==='s') return 'sem. '+ddmm(d); return ddmm(d)}
function nomeMateria(sig){if(sig==='_') return 'Sem tópico do edital';const t=[...S.ed.values()].find(t=>t.sigla===sig);return t?t.materia:sig}
function materiasComRodadas(){const set=new Set();for(const r of S.rodadas)for(const it of (r.itens||[])){const q=S.q.get(it.qid);const c=q?q.cap:null;if(c){const s=materiaDoCap(c);if(s)set.add(s)}}return [...set]}
function materiaDoCap(cap){for(const t of S.ed.values()) if((t.caps||[]).includes(cap)) return t.sigla; return ''}
/* Interpolação cúbica suave para as curvas, sem alterar nenhum valor da série. */
function qbCurve(pts){
  if(!pts.length) return '';
  if(pts.length===1) return 'M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  let p='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],prev=pts[Math.max(0,i-2)],next=pts[Math.min(pts.length-1,i+1)];
    const dx=(b[0]-a[0])/3;
    const d1=(b[1]-prev[1])*dx/Math.max(1,b[0]-prev[0]);
    const d2=(next[1]-a[1])*dx/Math.max(1,next[0]-a[0]);
    p+=' C '+(a[0]+dx).toFixed(1)+' '+(a[1]+d1).toFixed(1)+', '+(b[0]-dx).toFixed(1)+' '+(b[1]-d2).toFixed(1)+', '+b[0].toFixed(1)+' '+b[1].toFixed(1);
  }
  return p;
}

  const W=window.innerWidth<600?400:720,H=window.innerWidth<600?260:280,L=44,R=vis.length&&vis.length<=4?90:20,T=14,B=38;

  const span=Math.max(1,difDias(d0,d1));

      <div class="seg" role="group" aria-label="Medida"><button data-evomodo="n" aria-pressed="${!pct}">Nº de acertos</button><button data-evomodo="p" aria-pressed="${pct}">% de acerto</button></div>

/* ---------- central do projeto: edital, materiais, pontos-chave, diário ---------- */
const ST={nao:'Não iniciado',estudo:'Em estudo',revisao:'Revisando',dominado:'Dominado'};
const ST_ORD=['dominado','revisao','estudo','nao'];
const MTIPO={mapa:'Mapa mental',material:'Material de estudo',cobertura:'Cobertura das fontes',fonte:'Fonte do projeto',metodo:'Método'};
const PROVAS={P1:'P1 · Conhecimentos básicos · 90 itens',P2:'P2 · Conhecimentos específicos · 90 itens'};
function topicos(){return [...S.ed.values()].sort((a,b)=>(a.ordem||0)-(b.ordem||0))}
function lblT(t){return t?`${t.sigla} ${t.num}`:''}
function matsDe(id){return [...S.mat.values()].filter(m=>(m.topicos||[]).includes(id))}
/* retenção: acerto (sem chute) em revisão feita RETENCAO+ dias após o primeiro contato */
const RETENCAO=7;
function retido(r){
  if(!r||!r.tentativas) return false; if(r.retidoEm) return true;
  const h=r.hist||[]; const p=r.primeiraEm||(h[0]&&h[0].em); if(!p) return false;
  return h.some(x=>x.ok&&x.c!==1&&x.em&&difDias(diaDe(p),diaDe(x.em))>=RETENCAO);
}
function statsTopico(t){
  const caps=new Set(t.caps||[]), h=hoje();
  const o={total:0,resp:0,ok:0,okN:0,cad:0,hoje:0,ret:0};
  if(!caps.size) return o;
  for(const q of S.q.values()){
    if(!caps.has(q.cap)||q.foraNivel) continue;
    o.total++;
    const r=S.r.get(q.id);
    if(r&&r.tentativas){ o.resp++; if(r.ultimaMarcada===q.gabarito) o.ok++; if(r.ultimaMarcada===q.gabarito&&!jaErrou(r)) o.okN++; if(r.noCaderno) o.cad++; if(retido(r)) o.ret++; const p=proxDe(r); if(p&&p<=h) o.hoje++; }
  }
  return o;
}
const RANK={nao:0,estudo:1,revisao:2,dominado:3};
function statusControle(t,s){
  const estudo=matsDe(t.id).some(m=>m.tipo==='mapa'||m.tipo==='material'||m.tipo==='cobertura')||((S.pt.get(t.id)||{}).itens||[]).length>0||((S.rv.get(t.id)||{}).itens||[]).length>0;
  if(!s.total) return estudo?'estudo':'nao';
  if(s.resp/s.total<0.8) return 'estudo';
  if(s.ok/s.resp>=0.85&&s.cad===0&&s.ret>=s.resp) return 'dominado';
  return 'revisao';
}
/* Tutory (Meu Desempenho): estudo ou resumo = em estudo; revisão e exercício já iniciados = revisando. Nunca "dominado". */
function statusTutory(t){
  const u=t.tutory; if(!u||t.tutoryIgnorar) return 'nao';
  const v=k=>u[k]||0;
  if(!(v('estudo')||v('resumo')||v('revisao')||v('exercicio'))) return 'nao';
  if(v('revisao')>0&&v('exercicio')>0) return 'revisao';
  return 'estudo';
}
function statusAuto(t,s){const a=statusControle(t,s),b=statusTutory(t);return RANK[b]>RANK[a]?b:a}
const pctT=v=>v==null?'–':v+'%';
function tutoryChip(t){
  const u=t.tutory; if(!u) return '';
  return `<span class="tchip" title="${esc((u.itens||[]).join('\n'))}">Tutory${t.tutoryIgnorar?' (desconsiderado)':''}: estudo ${pctT(u.estudo)} · resumo ${pctT(u.resumo)} · revisão ${pctT(u.revisao)} · exercício ${pctT(u.exercicio)}</span>`;
}
function nRev(id){return ((S.rv.get(id)||{}).itens||[]).length+((S.rv.get(id)||{}).cartoes||[]).length+(S.rv.has(id)?0:((S.pt.get(id)||{}).itens||[]).length)}
function statusDe(t){const s=statsTopico(t);return {s,auto:statusAuto(t,s),ef:(t.status&&ST[t.status])?t.status:statusAuto(t,s)}}
function porMateria(){
  const m=new Map();

/* sua memória por intervalo: acerto ao reencontrar um item, conforme os dias desde a resposta anterior (dados reais do histórico) */
function memoria(){
  const B=[[1,1,'1 d'],[2,3,'2–3 d'],[4,7,'4–7 d'],[8,15,'8–15 d'],[16,999,'16+ d']], acc=B.map(()=>[0,0]);
  for(const r of S.r.values()){ if(foraQid(r.qid)) continue; const hs=(r.hist||[]).filter(x=>x.em&&x.m!=='B'||x.em).slice().sort((a,b)=>String(a.em).localeCompare(String(b.em)));
    for(let i=1;i<hs.length;i++){const g=difDias(diaDe(hs[i-1].em),diaDe(hs[i].em)); if(g<1) continue; const k=B.findIndex(b=>g>=b[0]&&g<=b[1]); if(k<0) continue; acc[k][0]++; if(hs[i].ok) acc[k][1]++;}}
  const W=360,H=180,L=34,Rr=16,T=24,Bt=28, x=i=>L+i*(W-L-Rr)/(B.length-1), y=v=>T+(1-v)*(H-T-Bt);
  const pts=acc.map((a,i)=>a[0]>=5?[x(i),y(a[1]/a[0]),a]:null);
  const path=qbCurve(pts.filter(Boolean).map(p=>[p[0],p[1]]));
  const grid=[0.5,0.75,0.9,1].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0.9?'stroke-dasharray="4 3" stroke="var(--certo)"':''}/><text class="vx" x="${L-4}" y="${y(v)+3}" text-anchor="end">${v*100}%</text>`).join('');
  const n=acc.reduce((s,a)=>s+a[0],0);
  if(n<10) return `<section class="card-v"><h2 class="section-title">Sua memória por intervalo</h2><p class="rule">Ainda há poucas revisões registradas para desenhar a curva.</p></section>`;
  return `<section class="card-v" aria-label="Sua memória por intervalo"><h2 class="section-title">Sua memória por intervalo</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Acerto ao rever um item, por dias desde a resposta anterior">${grid}
    <path d="${path}" fill="none" stroke="var(--pen)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--pen)" stroke="var(--surface)" stroke-width="2"><title>${B[i][2]}: ${Math.round(p[2][1]/p[2][0]*100)}% (${p[2][1]} de ${p[2][0]})</title></circle><text class="vl" x="${p[0]}" y="${p[1]-9}" text-anchor="middle">${Math.round(p[2][1]/p[2][0]*100)}%</text>`:'').join('')}
    ${B.map((b,i)=>`<text class="vx" x="${x(i)}" y="${H-10}" text-anchor="middle">${b[2]}</text>`).join('')}</svg>
    <p class="rule">Quanto você acerta ao reencontrar um item, pelos dias desde a resposta anterior (${n} reencontros; pontos com menos de 5 ficam de fora). A linha tracejada é a meta de 90%. Se a curva cai muito nos intervalos longos, o espaçamento está largo demais para você.</p></section>`;
}

function mecDe(q){if(!q) return null; if(q.mecanismo) return {m:q.mecanismo,v:q.vacina||'',e:q.evidencia||''}; return S.mecQ.get(q.id)||null}
function idsDoMec(code){return [...S.q.values()].filter(q=>{const x=mecDe(q);return x&&x.m===code&&(!S.fMecMat||materiaDaQuestao(q)===S.fMecMat)}).map(q=>q.id)}
function materiaDaQuestao(q){const m=String(q.cap||'').match(/^BANCA-(\w+)/); if(m) return m[1]; const t=topicoDoCap(q.cap); return t?t.sigla:''}
function taxaPessoal(code){let n=0,ok=0;for(const id of idsDoMec(code)){const r=S.r.get(id),q=S.q.get(id);if(r&&r.tentativas&&r.ultimaMarcada!=='B'){n++;if(r.ultimaMarcada===q.gabarito)ok++;}}return {n,ok}}

function estrategiaMec(code){return window.QBStrategy?.[code]||null}
function maximaMec(code){return estrategiaMec(code)?.maxima||MEC_MEMORIA[code]?.lema||''}
function mecanStats(code,ids){
  const out={total:ids.length,respondidos:0,acertos:0,erros:0,confErros:0,caderno:0,errosHistoricos:0,reincidentes:0};
  for(const id of ids){
    const r=S.r.get(id),q=S.q.get(id);
    if(!r||!q||!Number(r.tentativas))continue;
    const historico=(r.hist||[]).filter(h=>(h.m==='C'||h.m==='E')&&typeof h.ok==='boolean');
    const anteriores=historico.filter(h=>h.ok===false).length;
    out.errosHistoricos+=anteriores;
    if(anteriores>=2)out.reincidentes++;
    const marca=r.ultimaMarcada;
    if(marca!=='C'&&marca!=='E')continue;
    out.respondidos++;
    const bom=marca===q.gabarito;
    if(bom)out.acertos++;
    else{
      out.erros++;
      const h=(r.hist||[]).filter(h=>h.m==='C'||h.m==='E').at(-1);
      if((h?Number(h.c):Number(r.conf))===3)out.confErros++;
    }
    if(r.noCaderno)out.caderno++;
  }
  return out;
}

function treinarPg(id){
  let ps=[...S.pg.values()].filter(p=>(!S.fPgTipo||p.tipo===S.fPgTipo));

  else ps=ps.filter(p=>p.topico===id);
  const fila=qidsPg(ps); if(!fila.length) return;
  if(id==='*'||S.shuffle){ for(let i=fila.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fila[i],fila[j]]=[fila[j],fila[i]]} }
  const t=S.ed.get(id);
  setView('treinar');
  novaRodada('PEG',t?`Pegadinhas · ${lblT(t)} ${t.titulo}`:'Pegadinhas intercaladas','pegadinhas',fila);
}

function viewMetodo(){
  return `<div class="wrap metodo">
    <p class="rule">Resumo do documento Metodo_de_Estudo.md do projeto. É o mesmo método que o Claude aplica nos chats de cada matéria.</p>
    <h2 class="section-title">Como usar este caderno</h2>
    <ol>
      <li><b>Comece pela revisão de hoje.</b> Ela mistura capítulos de propósito: escolher qual regra se aplica faz parte do treino. <span class="src">Fixe o Conhecimento · intercalação</span></li>
      <li><b>Marque a confiança antes do gabarito.</b> Errar com certeza é o sinal mais importante do caderno. <span class="src">Fixe o Conhecimento · calibração</span></li>
      <li><b>Depois do erro, marque de onde ele veio.</b> Cada origem pede um remédio diferente.</li>
      <li><b>Justifique todo erro antes de seguir.</b> Errou, deixou em branco ou chutou: o Caderno só libera o próximo item depois que você marca de onde veio o erro e escreve, com as suas palavras, por que errou e qual é a regra certa. A justificativa fica guardada no caderno de erros. <span class="src">Geração e elaboração · Fixe o Conhecimento</span></li>
      <li><b>Escreva a regra com as suas palavras.</b> Copiar o comentário não conta; explicar e dar um exemplo próprio, sim. <span class="src">Você Sabe Estudar? · estudo ativo</span></li>
      <li><b>Não releia o PDF para revisar.</b> Reler e grifar dão a sensação de domínio sem fixar. Volte às questões. <span class="src">Otimize seu Aprendizado</span></li>
      <li><b>Treine as pegadinhas de memória.</b> Na aba Pegadinhas, com "Evocar antes de ler", explique por que a armadilha engana antes de abrir a regra, e depois responda o item ligado. Distinguir regras parecidas lado a lado é o remédio para os erros de interferência. <span class="src">Fixe o Conhecimento · intercalação e discriminação</span></li>
      <li><b>Leia devagar o que parece óbvio.</b> As palavras de alcance aparecem destacadas depois da resposta para treinar o olho. <span class="src">Rápido e Devagar · Sistema 2</span></li>
      <li><b>Itens Errados: corrija antes do gabarito.</b> Ao marcar E, reescreva a assertiva certa no campo opcional. Corrigir a afirmação falsa melhora a retenção quando há feedback depois. <span class="src">Uner, Tekin e Roediger, 2022</span></li>
      <li><b>Certeza só quando souber dizer por quê.</b> A aba Hoje mostra o seu acerto com certeza nos últimos 14 dias; a meta é 90% ou mais. <span class="src">Fixe o Conhecimento · calibração</span></li>
      <li><b>Videoaulas: pausa de evocação.</b> A cada bloco de 15 a 20 minutos, pare e responda de memória 3 a 5 perguntas sobre o que acabou de ver. Isso reduziu a divagação de cerca de 40% para 19% e elevou o teste final de 68% para 90%. <span class="src">Szpunar, Khan e Schacter, 2013</span></li>
      <li><b>Celular em outro cômodo.</b> A simples presença do celular sobre a mesa reduziu a capacidade cognitiva disponível. <span class="src">Ward et al., 2017 · Otimize seu Aprendizado</span></li>
      <li><b>Próximo passo no formato "quando/onde → farei".</b> Ex.: "amanhã, às 7h, na mesa: revisão de hoje e DC 1.4". Intenções de implementação aumentam a chance de cumprir o plano. <span class="src">Gollwitzer e Sheeran, 2006</span></li>
      <li><b>No simulado, reconsidere e troque quando tiver motivo.</b> Trocas costumam ir mais de errado para certo do que o contrário; o resultado mostra o seu saldo. <span class="src">Kruger, Wirtz e Miller, 2005</span></li>
      <li><b>Na prova, marque só acima de 50%.</b> Com +1, −1 e 0, o ganho esperado é 2 × acerto − 1. A aba Desempenho mostra o seu acerto real em cada nível de confiança. <span class="src">Critério do edital</span></li>
    </ol>
    <h2 class="section-title">Status dos tópicos</h2>
    <ul>
      <li>Vale o maior entre o Controle e o Tutory. Em estudo: há material, mapa, questões ou estudo/resumo marcado no Tutory. Revisando: 80% das questões feitas, ou revisão e exercício iniciados no Tutory.</li>
      <li>Dominado, só pelo Controle: 80% das questões feitas, 85% de acerto na última resposta, nada no caderno de erros e cada questão acertada (sem chute) numa revisão feita 7 dias ou mais depois do primeiro contato.</li>
      <li>Você pode fixar o status à mão em Edital → Detalhes.</li>
    </ul>
    <h2 class="section-title">Regras da agenda</h2>
    <ul>
      <li>Erro, branco ou chute: o item volta amanhã e fica no caderno.</li>
      <li>Repescagem: no fim de cada rodada, os itens errados, em branco ou acertados no chute aparecem mais uma vez. Não contam no placar.</li>
      <li>Acerto com certeza: volta em 7 dias no mínimo, depois 15 e 30.</li>
      <li>Acerto com dúvida: volta em 3 dias no mínimo.</li>
      <li>No máximo 40 revisões por dia. Os erros do caderno entram primeiro; os acertos que sobrarem passam para os dias seguintes.</li>
      <li>Nenhum intervalo passa de 20% dos dias que faltam para a prova. Quanto mais perto da prova, mais curtos ficam.</li>
      <li>Saída do caderno: dois acertos seguidos sem chute, em dias diferentes. O item continua na agenda.</li>
      <li>A partir de 10/01/2027, tudo que estiver na agenda vira revisão diária até a prova.</li>
      <li>Cartões de revisão ativa (07/11/2026): depois de responder e virar, marque Novamente (volta no fim da sessão e amanhã), Difícil, Bom ou Fácil. O espaçamento segue a mesma escada das questões (1, 3, 7, 15 e 30 dias, com o teto de 20% dos dias até a prova): Bom sobe um degrau, Fácil sobe dois, Difícil repete o degrau e Novamente volta ao início. Por dia: até 50 revisões de cartões, priorizando os Novamente e os mais atrasados, e até 50 cartões novos. As questões também passam a 50 revisões por dia. Os cartões que excederem o limite ficam para o dia seguinte.</li>
    </ul>
    <h2 class="section-title">O que a pesquisa mostra</h2>
    <ul>
      <li><b>Testar fixa mais que reler.</b> Uma semana depois, 56% de recordação para quem fez teste contra 42% para quem releu. Cinco minutos depois, reler parecia melhor (81% contra 75%). <span class="src">Roediger e Karpicke, 2006</span></li>
      <li><b>O feedback quase dobra o efeito.</b> Testes com correção: g = 0,73; sem correção: g = 0,39. Por isso todo item tem comentário. <span class="src">Rowland, 2014 · meta-análise</span></li>
      <li><b>Erro com certeza é o que mais se corrige</b> depois de ver o gabarito, porque a surpresa prende a atenção. <span class="src">Butterfield e Metcalfe, 2001</span></li>
      <li><b>O melhor intervalo encolhe com a proximidade da prova.</b> Com 70 dias até a prova, cerca de 12; com 35 dias, cerca de 8. Errar para mais custa menos que errar para menos. <span class="src">Cepeda et al., 2008</span></li>
      <li><b>Acertar em várias sessões vale mais que repetir na mesma.</b> 68% contra 26% de retenção depois de uma semana. <span class="src">Rawson et al., 2018</span></li>
      <li><b>Misturar ajuda a distinguir o que se parece.</b> Uma semana depois, 63% contra 20%, embora a prática misturada pareça pior na hora. O efeito vale para conceitos parecidos, não para texto novo. <span class="src">Rohrer e Taylor, 2007 · Brunmair e Richter, 2019</span></li>
      <li><b>Mapa mental só ajuda se for feito de memória.</b> Mapas montados de memória rendem como escrever de memória, e mais do que estudar com o texto aberto. <span class="src">Blunt e Karpicke, 2014</span></li>
      <li><b>A sensação de "já sei" engana.</b> Quem releu quatro vezes previa lembrar mais e lembrou menos (40% contra 61%). <span class="src">Roediger e Karpicke, 2006</span></li>
    </ul>
    <p class="rule">Referências completas no documento Metodo_de_Estudo.md do projeto, seção 12.</p>
    <h2 class="section-title">As quatro obras</h2>
    <div class="books">
      <div class="book"><span class="bt">Fixe o Conhecimento</span><span class="ba">Brown, Roediger e McDaniel</span><span class="bu">Autoteste, espaçamento, intercalação e dificuldades desejáveis.</span></div>
      <div class="book"><span class="bt">Otimize seu Aprendizado</span><span class="ba">Daniel T. Willingham</span><span class="bu">O que o cérebro faz por padrão ao estudar e como contornar.</span></div>
      <div class="book"><span class="bt">Você Sabe Estudar?</span><span class="ba">Claudio de Moura Castro</span><span class="bu">Estudo ativo, hábito, leitura com perguntas e anotações próprias.</span></div>
      <div class="book"><span class="bt">Rápido e Devagar</span><span class="ba">Daniel Kahneman</span><span class="bu">Sistema 1 e Sistema 2: por que a resposta óbvia engana na prova.</span></div>
    </div>

function novaRodada(cap,capNome,modo,fila){
  S.round={id:'r-'+Date.now().toString(36),cap,capNome,modo,fila,idx:0,atual:null,pend:null,itens:[],certos:0,errados:0,brancos:0,inicio:new Date().toISOString(),fim:null,rep:{fila:[],ini:null,res:[]}};
  render(true); window.scrollTo({top:0});
}
function startRound(cap,modo){
  let fila=filaPara(cap,modo);
  if(!fila.length) return;
  if(S.shuffle){ for(let i=fila.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fila[i],fila[j]]=[fila[j],fila[i]]} }
  novaRodada(cap,capNome(cap),modo,fila);
}
function startRevisao(){
  const {fila}=devidas(); if(!fila.length) return;
  if(S.view!=='treinar') setView('treinar');
  novaRodada('MIX','Revisão intercalada','revisao',fila);
}
function marcar(L){
  const rd=S.round; if(!rd||rd.atual||rd.fim) return;
  if(emRep(rd)){ registrarRep(L); return; }
  if(L==='B'){ registrar('B',null); return; }
  rd.pend={marcada:L,focus:true};
  render(true);
}
function confirmar(c){
  const rd=S.round; if(!rd||!rd.pend||rd.atual) return;
  registrar(rd.pend.marcada,c);
}
function registrar(L,conf){
  const rd=S.round; if(!rd||rd.atual||rd.fim) return;
  const q=S.q.get(rd.fila[rd.idx]); if(!q) return;
  const acertou=L===q.gabarito;
  const corr=(L==='E'&&rd.corr||'').trim(); rd.corr='';
  rd.pend=null; rd.just='';
  rd.atual={marcada:L,acertou,conf,corr};
  if(L==='B') rd.brancos++; else if(acertou) rd.certos++; else rd.errados++;
  rd.itens.push(Object.assign({qid:q.id,ordem:q.ordem||0,marcada:L,gabarito:q.gabarito,conf:conf||null},corr?{corr}:{}));
  if((L==='B'||!acertou||conf===1)&&!rd.rep.fila.includes(q.id)) rd.rep.fila.push(q.id);
  // estado do item
  const prev=S.r.get(q.id)||{};
  const now=new Date().toISOString(), d=hoje();
  const r=Object.assign({},prev,{qid:q.id,cap:q.cap,ordem:q.ordem||0,ultimaMarcada:L,atualizadoEm:now,
    tentativas:(prev.tentativas||0)+1,conf:conf||null});
  const hist=Array.isArray(prev.hist)?prev.hist.slice(-7):[];
  hist.push({m:L,ok:acertou,em:now,c:conf||null}); r.hist=hist;
  r.primeiraEm=prev.primeiraEm||(Array.isArray(prev.hist)&&prev.hist[0]&&prev.hist[0].em)||now;
  if(acertou&&conf!==1&&!prev.retidoEm&&difDias(diaDe(r.primeiraEm),d)>=RETENCAO) r.retidoEm=now;
  const nPrev=prev.tentativas?nivelDe(prev):0;
  if(acertou&&conf===1){
    // acerto no chute não conta como domínio
    r.acertos=(prev.acertos||0)+1;
    if(!prev.noCaderno){ r.noCaderno=true; r.entrouEm=now; r.motivo='chute'; r.acertosSeguidos=0; }
    r.nivel=0;
  } else if(acertou){
    r.acertos=(prev.acertos||0)+1; r.acertosSeguidos=(prev.acertosSeguidos||0)+1;
    if(prev.noCaderno && r.acertosSeguidos>=2){ r.noCaderno=false; r.saiuEm=now; r.motivoSaida='dois acertos seguidos'; }
    // certeza: pelo menos 7 dias; dúvida: pelo menos 3. Enquanto o item estiver no caderno, volta em 3 dias.
    r.nivel=conf===3?Math.min(Math.max(nPrev+1,2),INT.length-1):Math.max(nPrev,1);
    if(r.noCaderno) r.nivel=Math.min(r.nivel,1);
  } else {
    if(L==='B') r.brancos=(prev.brancos||0)+1; else r.erros=(prev.erros||0)+1;
    r.acertosSeguidos=0;
    if(!prev.noCaderno){ r.entrouEm=now; }
    r.noCaderno=true; r.motivo=(L==='B'&&!(prev.noCaderno&&prev.motivo==='erro'))?'branco':'erro';
    r.nivel=0;
  }
  r.proxRevisao=agendar(d,r.nivel);
  r.calib=L==='B'||!conf?null:(!acertou&&conf===3?'excesso':(acertou&&conf===1?'sub':'ok'));
  if(typeof r.nota!=='string') r.nota='';
  if(corr) r.correcoes=(Array.isArray(prev.correcoes)?prev.correcoes:[]).concat([{em:now,texto:corr}]).slice(-5);
  S.r.set(q.id,r);
  const rdoc=rodadaDoc(rd);
  enqueue(()=>S.db.doc('respostas/'+q.id).set(r));
  enqueue(()=>S.db.doc('rodadas/'+rd.id).set(rdoc));
  render(true);
}
/* repescagem: não altera respostas nem agenda; só fica registrada na rodada */
function registrarRep(L){
  const rd=S.round; const q=S.q.get(rd.fila[rd.idx]); if(!q) return;
  const acertou=L===q.gabarito;
  rd.atual={marcada:L,acertou,conf:null,rep:true};
  rd.rep.res.push({qid:q.id,m:L,ok:acertou});
  const rdoc=rodadaDoc(rd);
  enqueue(()=>S.db.doc('rodadas/'+rd.id).set(rdoc));
  render(true);
}
function rodadaDoc(rd){
  const total=rd.rep.ini===null?rd.fila.length:rd.rep.ini;
  return {cap:rd.cap,capNome:rd.capNome,modo:rd.modo,inicio:rd.inicio,fim:rd.fim,total,
    certos:rd.certos,errados:rd.errados,brancos:rd.brancos,itens:rd.itens,repescagem:rd.rep.res};
}
/* superaprendizagem: erro, branco ou chute exigem origem marcada e justificativa escrita antes de seguir */
const JUST_MIN=1;   // sem mínimo de caracteres (pedido do Lucas, 29/10/2026); basta escrever algo
function exigeJust(a){return !!a&&!a.rep&&(a.marcada==='B'||!a.acertou||a.conf===1)}
function justOk(rd,qid){const r=S.r.get(qid)||{};return !!r.origem&&(rd.just||'').trim().length>=JUST_MIN}
function justMsg(n,origem){const f=[];if(!origem)f.push('marque de onde veio o erro');if(n<JUST_MIN)f.push('escreva a justificativa');return f.length?'Falta: '+f.join(' e ')+'.':'Pronto. A justificativa vai para o caderno de erros.'}
function next(){
  const rd=S.round; if(!rd||!rd.atual) return;
  const qid=rd.fila[rd.idx];
  if(exigeJust(rd.atual)){
    if(!justOk(rd,qid)){ toast('Antes de seguir, marque de onde veio o erro e escreva a justificativa com as suas palavras.'); const ta=$('#just-txt'); if(ta) ta.focus(); return; }
    const prev=S.r.get(qid)||{}, now=new Date().toISOString(), texto=rd.just.trim();
    const js=(Array.isArray(prev.justificativas)?prev.justificativas:[]).concat([{em:now,texto,origem:prev.origem||null,marcada:rd.atual.marcada}]).slice(-8);
    const nota=(prev.nota||'').trim()?prev.nota:texto;
    S.r.set(qid,Object.assign({},prev,{justificativas:js,nota}));
    enqueue(()=>S.db.doc('respostas/'+qid).update({justificativas:js,nota}));
  }
  rd.just='';
  rd.atual=null; rd.idx++;
  if(rd.idx>=rd.fila.length){
    if(rd.rep.ini===null&&rd.rep.fila.length){ rd.rep.ini=rd.fila.length; rd.fila=rd.fila.concat(rd.rep.fila); }
    else finalizar();
  }
  render(true); window.scrollTo({top:0});
}
function finalizar(){
  const rd=S.round; if(!rd||rd.fim) return;
  rd.fim=new Date().toISOString(); rd.pend=null;
  if(rd.itens.length){ const d=rodadaDoc(rd); enqueue(()=>S.db.doc('rodadas/'+rd.id).set(d)); }
  else { S.round=null; }
}
function tirar(id){
  const prev=S.r.get(id); if(!prev) return;
  const now=new Date().toISOString();
  const r=Object.assign({},prev,{noCaderno:false,saiuEm:now,atualizadoEm:now,motivoSaida:'manual',acertosSeguidos:0});
  S.r.set(id,r); render(true);
  enqueue(()=>S.db.doc('respostas/'+id).set(r));
  toast('Item retirado do caderno. Ele continua na agenda de revisões.');
}
function salvarOrigem(id,val){
  const prev=S.r.get(id); if(!prev||!ORIGENS[val]) return;
  const v=prev.origem===val?null:val;
  S.r.set(id,Object.assign({},prev,{origem:v}));
  render(true);
  enqueue(()=>S.db.doc('respostas/'+id).update({origem:v}));
}
const lastNota=new Map();
function salvarNota(id,val){
  const prev=S.r.get(id); if(!prev) return;
  if((prev.nota||'')===val && lastNota.get(id)===val) return;
  lastNota.set(id,val);
  S.r.set(id,Object.assign({},prev,{nota:val}));
  enqueue(()=>S.db.doc('respostas/'+id).update({nota:val})).then(()=>{const s=document.getElementById('saved-'+id); if(s) s.textContent='Anotação salva';});
}
document.addEventListener('keydown',e=>{
  if(S.view!=='treinar'||!S.round||S.round.fim) return;
  const t=e.target; if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.tagName==='SELECT')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const rd=S.round, k=e.key.toLowerCase();
  if(!rd.atual && (k==='c'||k==='e'||k==='b')){ e.preventDefault(); marcar(k.toUpperCase()); }
  else if(rd.pend && !rd.atual && (k==='1'||k==='2'||k==='3')){ e.preventDefault(); confirmar(Number(k)); }
  else if(rd.pend && !rd.atual && e.key==='Escape'){ e.preventDefault(); rd.pend=null; render(true); }
  else if(rd.atual && (e.key==='Enter'||e.key==='ArrowRight')){ if(t&&t.dataset&&(t.dataset.origem||t.dataset.conf)&&e.key==='Enter') return; e.preventDefault(); next(); }
});

function subscribe(){
  const db=S.db;
  db.collection('questoes').onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){ const v=d.data(); if(v&&v.enunciado&&(v.gabarito==='C'||v.gabarito==='E')) m.set(d.id,Object.assign({id:d.id},v)); }
    S.q=m; S.qLoaded=true; render();
  },err=>{S.dbState='missing';render(true)});
  db.collection('respostas').onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){ const v=d.data(); if(v) m.set(d.id,Object.assign({qid:d.id},v)); }
    // mantém respostas locais ainda não confirmadas
    for(const [k,v] of S.r){ const s=m.get(k); if(!s || (v.atualizadoEm||'')>(s.atualizadoEm||'')) m.set(k,v); }
    S.r=m; render();
  },()=>{});
  db.collection('rodadas').orderBy('inicio','desc').limit(500).onSnapshot(snap=>{
    S.rodadas=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(['historico','analiseDia','painel','treinar'].includes(S.view)&&!S.round) render(); else updateCounts();
  },()=>{});
  const central=(col,fn)=>db.collection(col).onSnapshot(snap=>{fn(snap.docs.map(d=>Object.assign({id:d.id},d.data())));if(['painel','analiseDia','edital','revisao','pegadinhas','conteudo','cartoes','mapa'].includes(S.view))render();},()=>{});
  central('revisao',ds=>{S.rv=new Map(ds.map(d=>[d.id,d]));});
  central('cartoes_aval',ds=>{S.cav=new Map(ds.map(d=>[d.k||d.id,d]));});
  central('pegadinhas',ds=>{S.pg=new Map(ds.map(d=>[d.id,d]));updateCounts();});
  central('analise',ds=>{S.an=new Map(ds.map(d=>[d.id,d]));const m=new Map();const c=S.an.get('CONTROLE');for(const it of ((c&&c.itens)||[])) if(it.mecanismo&&typeof it.item==='string') m.set(it.item,{m:it.mecanismo,v:it.vacina||'',e:it.evidencia||''});S.mecQ=m;});
  central('config',ds=>{S.cfg=new Map(ds.map(d=>[d.id,d]));});
  central('edital',ds=>{S.ed=new Map(ds.map(d=>[d.id,d]));S.edLoaded=true;});
  central('materiais',ds=>{S.mat=new Map(ds.map(d=>[d.id,d]));});
  central('pontos',ds=>{S.pt=new Map(ds.map(d=>[d.id,d]));});
  central('diario',ds=>{S.di=ds;});
  db.collection('planejamento').onSnapshot(snap=>{
    S.pl=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(['painel','analiseDia'].includes(S.view))render();
  },err=>{console.warn('O planejamento não pôde ser carregado.',err)});
  db.collection('textos').onSnapshot(snap=>{S.tx=new Map(snap.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));if(['simulado','treinar'].includes(S.view))render();},()=>{});
  db.collection('simulados').onSnapshot(snap=>{S.sims=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if((S.view==='simulado'||S.view==='analiseDia')&&!simLS('obj')&&!simLS('disc'))render();},()=>{});
}

function simSigla(cap){
  const m=materiaDoCap(cap); if(m) return m.toLowerCase();
  const c=String(cap||'');
  if(/^BANCA-/i.test(c)) return c.slice(6).toLowerCase();
  if(/^AP-/i.test(c)) return 'da';
  if(/^JUR-DC/i.test(c)) return 'dc';
  if(/^\d/.test(c)) return 'rf';
  return c.split(/[-.]/)[0].toLowerCase();
}
function simBlueprint(){const c=S.cfg.get('simulado');return (c&&c.obj&&c.obj.blocos)?c.obj:SIM_DEF.obj}
function domingos(){const d=new Date();const off=(7-d.getDay())%7;const p=new Date(d);p.setDate(d.getDate()+off);return {hoje:d.getDay()===0,prox:p.toLocaleDateString('pt-BR')}}
function simLS(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('sim:'+k)||'null');if(v===null)localStorage.removeItem('sim:'+k);else localStorage.setItem('sim:'+k,JSON.stringify(v))}catch(e){return null}}
function simMontar(){
  const bp=simBlueprint(), porMat=new Map();
  for(const q of S.q.values()){if(q.foraNivel)continue;const s=simSigla(q.cap);if(!porMat.has(s))porMat.set(s,[]);porMat.get(s).push(q)}
  const usados=new Set();for(const h of S.sims||[])for(const it of (h.itens||[]))usados.add(it.qid);
  const itens=[],falta=[];
  for(const b of bp.blocos) for(const [s,nome,n] of b.mats){
    const pool=(porMat.get(s)||[]).slice();
    const peso=q=>(/^BANCA/.test(q.cap)?0:2)+(S.r.has(q.id)?1:0)+(usados.has(q.id)?3:0)+Math.random();
    pool.sort((a,b)=>peso(a)-peso(b));
    // equilíbrio entre capítulos: round-robin pelos capítulos estudados
    const caps=new Map();for(const q of pool){if(!caps.has(q.cap))caps.set(q.cap,[]);caps.get(q.cap).push(q)}
    const filas=[...caps.values()],esc=[];let i=0;
    while(esc.length<n&&filas.some(f=>f.length)){const f=filas[i%filas.length];if(f.length)esc.push(f.shift());i++}
    {const ord=[],vis=new Map();for(const q of esc){const k=q.textoId||('_'+q.id);if(!vis.has(k)){vis.set(k,[]);ord.push(k)}vis.get(k).push(q)}esc.splice(0,esc.length,...ord.flatMap(k=>vis.get(k).sort((a,b)=>(a.id>b.id)-(a.id<b.id))));}
    if(esc.length<n) falta.push({s,nome,pedido:n,tem:esc.length});
    for(const q of esc) itens.push({qid:q.id,prova:b.prova,mat:s,marcada:null});
  }
  return {itens,falta};
}

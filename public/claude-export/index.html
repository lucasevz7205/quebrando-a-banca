  <div class="tbl-wrap"><table class="narrow"><thead><tr><th>Confiança</th><th class="num">Itens</th><th class="num">Acerto</th><th class="num">Líquido</th></tr></thead><tbody>${[[1,'Chute'],[2,'Dúvida'],[3,'Certeza'],[0,'Sem confiança']].map(([v,t])=>{const xs=so.itens.filter(x=>(x.marcada==='C'||x.marcada==='E')&&(x.conf||0)===v);if(!xs.length)return '';const c=xs.filter(x=>{const q=S.q.get(x.qid);return q&&q.gabarito===x.marcada}).length;return `<tr><td>${t}</td><td class="num">${xs.length}</td><td class="num">${fmtPct(c/xs.length)}</td><td class="num ${2*c-xs.length<0?'neg':'pos'}">${2*c-xs.length}</td></tr>`}).join('')}</tbody></table></div>
  <p class="rule">Se o acerto no chute ficar abaixo de 50%, o líquido é negativo: nesses casos, vale deixar em branco na prova.</p>
  ${(()=>{const tr=so.itens.filter(x=>x.prim&&x.prim!==(x.marcada||'B'));if(!tr.length)return `<p class="rule">Trocas de resposta: nenhuma neste simulado. Trocar após reconsiderar costuma ajudar: em Kruger, Wirtz e Miller (2005), 51% das trocas foram de errado para certo e 25% de certo para errado.</p>`;let ec=0,ce=0,ee=0;for(const x of tr){const q=S.q.get(x.qid);if(!q)continue;const a=x.prim===q.gabarito,b=(x.marcada||'B')===q.gabarito;if(!a&&b)ec++;else if(a&&!b)ce++;else ee++}return `<h2 class="section-title">Trocas de resposta (${tr.length})</h2><div class="summary"><div class="stat c"><span class="v">${ec}</span><span class="k">errado → certo</span></div><div class="stat e"><span class="v">${ce}</span><span class="k">certo → errado</span></div><div class="stat"><span class="v">${ee}</span><span class="k">sem efeito</span></div><div class="stat"><span class="v">${ec-ce>=0?'+':''}${ec-ce}</span><span class="k">saldo das trocas</span></div></div><p class="rule">Estudo de referência: 51% das trocas foram de errado para certo e 25% de certo para errado (Kruger, Wirtz e Miller, 2005). O que vale é o seu saldo: acompanhe aqui a cada simulado.</p>`})()}
  <h2 class="section-title">Itens errados (${erros.length})</h2>
  <p class="rule">Classifique cada erro: o padrão dos erros diz o que treinar na semana (Willingham, dica 56). ${(()=>{const c={};for(const x of erros)if(x.origem)c[x.origem]=(c[x.origem]||0)+1;const k=Object.keys(c);return k.length?'Até agora: '+k.map(o=>ORIGENS[o].t+' '+c[o]).join(' · ')+'.':''})()}</p>
  ${erros.map(it=>{const q=S.q.get(it.qid);const ix=so.itens.indexOf(it);return `<div class="entry"><div class="chips">${Object.entries(ORIGENS).map(([k,v])=>`<button class="chip" data-sim-or="${ix}" data-val="${k}" aria-pressed="${it.origem===k}">${v.t}</button>`).join('')}</div><div class="pills"><span class="pill">${esc(q.cap)}</span><span class="pill e">marcou ${it.marcada}</span>${it.conf?`<span class="pill b">${['','chute','dúvida','certeza'][it.conf]}</span>`:''}<span class="pill c">gabarito ${q.gabarito}</span></div><div class="statement">${esc(q.enunciado)}</div><details class="why"><summary>Por quê</summary><p>${esc(q.comentario)}</p><p class="ref">${esc(q.ref||'')} · ${esc(q.origem||'')}</p></details></div>`}).join('')||'<div class="notice">Nenhum erro.</div>'}
  <button class="btn" id="sim-fechar">Fechar e voltar</button></div>`;
}
function viewSimDisc(sd){
  const rest=sd.inicio+sd.min*6e4-Date.now();
  return `<div class="wrap"><div class="scorebar"><span class="score"><span class="n" id="sim-relogio">${simFmt(rest)}</span></span><span class="progress">Discursiva · escreva de memória</span></div>
  ${sd.itens.map((d,k)=>`<div class="item"><div class="item-head"><span class="item-num">${d.tipo==='peca'?'PEÇA TÉCNICA':'QUESTÃO '+(k+1)}</span><span class="tag">até ${d.linhas} linhas · ${d.tipo==='peca'?30:15} pts</span></div><div class="statement">${esc(d.enunciado)}</div>
  <div class="note"><textarea data-sim-txt="${k}" style="min-height:${d.linhas*14}px">${esc(d.texto||'')}</textarea><span class="saved" id="sim-ln-${k}">${linhas(d.texto)} de ${d.linhas} linhas (≈72 caracteres por linha)</span></div></div>`).join('')}
  <div class="row"><button class="btn" id="sim-dentregar">Entregar discursiva</button><button class="btn ghost small" id="sim-dcancelar">Cancelar</button></div></div>`;
}
function simNota(d){const tl=Math.max(1,linhas(d.texto)),nc=+d.nc||0,ne=+d.ne||0;const v=d.tipo==='peca'?nc-6*ne/tl:nc-3*ne/tl;return Math.max(0,Math.round(v*100)/100)}
function viewSimDiscRes(sd){
  const tot=sd.itens.reduce((a,d)=>a+simNota(d),0);
  return `<div class="wrap"><h2 class="section-title">Correção da discursiva · ${esc(sd.data)}</h2>
  <p class="rule">Compare seu texto com o espelho, dê a nota de conteúdo (NC) e conte os erros de grafia, morfossintaxe e vocabulário (NE). Fórmulas do edital (9.8.5): questão NQ = NC − 3×NE÷TL; peça NPT = NC − 6×NE÷TL. Aprovação na P3: 30 de 60. Espelhos e enunciados são inéditos Claude.</p>
  ${sd.itens.map((d,k)=>`<div class="item"><div class="item-head"><span class="item-num">${d.tipo==='peca'?'PEÇA':'QUESTÃO '+(k+1)}</span><span class="tag">${linhas(d.texto)} linhas escritas</span></div><div class="statement">${esc(d.enunciado)}</div>
  <details class="why"><summary>Seu texto</summary><p>${esc(d.texto||'(em branco)').replace(/\n/g,'<br>')}</p></details>
  <div class="verdict dub"><span class="vt">Espelho</span>${d.espelho.map(e=>`<p>• ${esc(e)}</p>`).join('')}</div>
  <div class="row"><label class="check">NC (0–${d.tipo==='peca'?30:15}) <input type="number" min="0" max="${d.tipo==='peca'?30:15}" step="0.5" data-sim-nc="${k}" value="${d.nc??''}" style="width:70px"></label><label class="check">NE <input type="number" min="0" data-sim-ne="${k}" value="${d.ne??''}" style="width:60px"></label><b class="mono">${simNota(d)} pts</b></div></div>`).join('')}
  <div class="summary two"><div class="stat ${tot>=30?'c':'e'}"><span class="v">${Math.round(tot*100)/100}</span><span class="k">Nota P3 (de 60; aprova com 30)</span></div><div class="stat"><span class="v">${simFmt(sd.fimEm-sd.inicio)}</span><span class="k">Tempo usado</span></div></div>
  <button class="btn" id="sim-dsalvar">Salvar correção e voltar</button></div>`;
}
function simSorteioDisc(){
  const est=new Set();for(const q of S.q.values())est.add(simSigla(q.cap));
  const ok=d=>est.has(d.mat), n=(S.sims||[]).filter(h=>h.tipo==='disc').length;
  const qs=SIM_DISC.filter(d=>d.tipo==='questao'&&ok(d)), ps=SIM_DISC.filter(d=>d.tipo==='peca'&&ok(d));
  const Q=qs.length?qs:SIM_DISC.filter(d=>d.tipo==='questao'), P=ps.length?ps:SIM_DISC.filter(d=>d.tipo==='peca');
  return [Q[(2*n)%Q.length],Q[(2*n+1)%Q.length],P[n%P.length]].map(d=>Object.assign({},d,{texto:''}));
}
let simTimer=null;
function simTick(){clearInterval(simTimer);simTimer=setInterval(()=>{const el=$('#sim-relogio');if(!el||S.view!=='simulado'){clearInterval(simTimer);return}const s=simLS('obj')&&!simLS('obj').fim?simLS('obj'):simLS('disc');if(!s)return;const r=s.inicio+s.min*6e4-Date.now();el.textContent=simFmt(r);if(r<=0){clearInterval(simTimer);toastSim('Tempo esgotado. Entregue a prova.')}},1000)}
function toastSim(t){const el=$('#toast');if(!el)return;el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,3500)}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wireSim(){
  const go=(k,v)=>{simLS(k,v);render(true)};
  const o=$('#sim-obj');if(o)o.addEventListener('click',()=>{const {itens,falta}=simMontar();if(falta.length)toastSim('Faltam itens em: '+falta.map(f=>f.s.toUpperCase()+' ('+f.tem+'/'+f.pedido+')').join(', '));go('obj',{inicio:Date.now(),min:SIM_DEF.obj.min,itens,pos:0,data:hojeISO()})});
  const d=$('#sim-disc');if(d)d.addEventListener('click',()=>go('disc',{inicio:Date.now(),min:SIM_DEF.disc.min,itens:simSorteioDisc(),data:hojeISO()}));
  document.querySelectorAll('[data-sim-m]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const it=s.itens[s.pos||0];const m=b.dataset.simM;if(it.marcada&&!it.prim)it.prim=it.marcada;if(it.marcada===m){it.marcada=null;it.conf=null;go('obj',s);return}if(it.prim&&it.prim!==m)it.trocas=(it.trocas||0)+1;it.marcada=m;it.conf=null;if(m==='B'&&(s.pos||0)<s.itens.length-1)s.pos=(s.pos||0)+1;go('obj',s)}));
  document.querySelectorAll('[data-sim-conf]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const it=s.itens[s.pos||0];it.conf=+b.dataset.simConf;if((s.pos||0)<s.itens.length-1)s.pos=(s.pos||0)+1;go('obj',s);window.scrollTo({top:0})}));
  document.querySelectorAll('[data-sim-ir]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const k=+b.dataset.simIr;if(k<0||k>=s.itens.length)return;s.pos=k;go('obj',s);window.scrollTo({top:0})}));
  const e=$('#sim-entregar');if(e)e.addEventListener('click',()=>{const s=simLS('obj');const br=s.itens.filter(x=>!x.marcada).length;if(br&&!confirm(br+' itens sem marcação contarão como branco. Entregar?'))return;s.fim=true;s.fimEm=Date.now();const {p}=simPontos(s);const id=s.data+'-obj-'+s.inicio;if(S.db)enqueue(()=>S.db.doc('simulados/'+id).set({tipo:'obj',data:s.data,inicio:new Date(s.inicio).toISOString(),minutos:Math.round((s.fimEm-s.inicio)/6e4),p1:p.P1,p2:p.P2,itens:s.itens.map(x=>Object.assign({qid:x.qid,prova:x.prova,mat:x.mat,marcada:x.marcada||'B',conf:x.conf||null},x.prim&&x.prim!==(x.marcada||'B')?{prim:x.prim}:{}))}));go('obj',s)});
  const c=$('#sim-cancelar');if(c)c.addEventListener('click',()=>{if(confirm('Cancelar o simulado em andamento? As marcações serão perdidas.'))go('obj',null)});
  document.querySelectorAll('[data-sim-or]').forEach(b=>b.addEventListener('click',()=>{const s=simLS('obj');const it=s.itens[+b.dataset.simOr];if(!it)return;it.origem=it.origem===b.dataset.val?null:b.dataset.val;go('obj',s)}));
  const f=$('#sim-fechar');if(f)f.addEventListener('click',()=>{const s=simLS('obj');if(s&&S.db&&s.itens.some(x=>x.origem)){const id=s.data+'-obj-'+s.inicio;const origens=s.itens.map((x,k)=>x.origem?{i:k,qid:x.qid,origem:x.origem}:null).filter(Boolean);enqueue(()=>S.db.doc('simulados/'+id).update({origensErros:origens}))}go('obj',null)});
  document.querySelectorAll('[data-sim-txt]').forEach(t=>t.addEventListener('input',()=>{const s=simLS('disc');const k=+t.dataset.simTxt;s.itens[k].texto=t.value;simLS('disc',s);const l=$('#sim-ln-'+k);if(l){const n=linhas(t.value),m=s.itens[k].linhas;l.textContent=n+' de '+m+' linhas (≈72 caracteres por linha)'+(n>m?' — acima do limite: o excedente é desconsiderado':'')}}));
  const de=$('#sim-dentregar');if(de)de.addEventListener('click',()=>{const s=simLS('disc');s.fim=true;s.fimEm=Date.now();go('disc',s)});
  const dc=$('#sim-dcancelar');if(dc)dc.addEventListener('click',()=>{if(confirm('Cancelar a discursiva? O texto será perdido.'))go('disc',null)});
  const upd=(sel,campo)=>document.querySelectorAll(sel).forEach(i=>i.addEventListener('change',()=>{const s=simLS('disc');s.itens[+i.dataset[campo==='nc'?'simNc':'simNe']][campo]=i.value;go('disc',s)}));
  upd('[data-sim-nc]','nc');upd('[data-sim-ne]','ne');
  const ds=$('#sim-dsalvar');if(ds)ds.addEventListener('click',()=>{const s=simLS('disc');const nota=Math.round(s.itens.reduce((a,d)=>a+simNota(d),0)*100)/100;const id=s.data+'-disc-'+s.inicio;if(S.db)enqueue(()=>S.db.doc('simulados/'+id).set({tipo:'disc',data:s.data,inicio:new Date(s.inicio).toISOString(),minutos:Math.round((s.fimEm-s.inicio)/6e4),nota,itens:s.itens.map(d=>({id:d.id,tipo:d.tipo,tema:d.tema,texto:d.texto,linhas:linhas(d.texto),nc:+d.nc||0,ne:+d.ne||0,nota:simNota(d)}))}));go('disc',null)});
  if($('#sim-relogio'))simTick();
}

function init(){
  let v='painel'; try{ const h=(location.hash||'').slice(1); if(VIEWS.includes(h)) v=h; }catch(e){}
  setView(v,false);
  if(window.QBAssistant)window.QBAssistant.mount(S);
  const use=window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null);
  Promise.resolve(use).then(db=>{
    if(!db){ S.dbState='missing'; render(true); return; }
    S.db=db; S.dbState='ok'; render(true); subscribe();
  },()=>{S.dbState='missing';render(true)});
}
init();
})();
</script>

</body></html>
